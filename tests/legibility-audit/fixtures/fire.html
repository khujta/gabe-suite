<div id="tip" role="tooltip" data-show="false"></div>
<script>
/* the hover convention of the suite's generated pages in miniature: data-tip on a target, one #tip box, shown on mouseover;
   a "|" in the attribute is a line break in the hover */
(function () {
  var tip = document.getElementById("tip");
  document.addEventListener("mouseover", function (e) {
    var t = e.target && e.target.closest ? e.target.closest("[data-tip]") : null;
    if (!t) { tip.setAttribute("data-show", "false"); return; }
    tip.textContent = "";
    t.getAttribute("data-tip").split("|").forEach(function (l) { var d = document.createElement("div"); d.textContent = l; tip.appendChild(d); });
    tip.setAttribute("data-show", "true");
  });
})();
</script>

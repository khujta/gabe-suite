<style>
  /* ══ the page's own rules — the kit block above is pasted verbatim by gen-all-endpoints.py ══ */
  /* centred (his rule, 2026-09-17) and WIDE: the subject is a table of every endpoint, and every column saved is a row seen */
  .artifact-page { margin: 0 auto; max-width: min(2400px, 97vw); }

  :root { --alert:#a3470a; --alert-soft:#fbeadb;
          --k-success:#2f855a; --k-refusal:#b7791f; --k-framework:#64748b; --k-validation:#7c3aed; --k-uncaught:#c53030;
          --f-saved:#2f855a; --f-maybe:#d69e2e; --f-rolled:#718096; --f-unsaved:#c05621; --f-after:#2b6cb0; --f-none:var(--rule);
          --p-norm:#cbd5e1; --p-common:#94a3b8; --p-rare:var(--accent); --p-only:var(--alert);
          --m-GET:#2b6cb0; --m-POST:#2f855a; --m-PUT:#b7791f; --m-PATCH:#805ad5; --m-DELETE:#c53030;
          /* the Shared group's own hue (D-034 fix): NOT the accent, because the accent is the heat's hue — a Shared cell tinted in
             the accent reads as a small number. Rose sits far from every skin's accent (indigo · blue · teal) and from --alert */
          --sh:#be185d; --shp:24%;   /* --shp: the Shared header's tint, stronger in dark where a pale tint drowns */
          /* the alternating block ground is NEUTRAL for the same reason: the accent is spent on the heat alone */
          --bz:color-mix(in srgb, var(--ink) 4%, var(--card));
          /* D-041: the element light's own colour — a highlighter yellow, apart from the accent (the heat), --alert (the strip
             light) and --sh (the Shared group) */
          --el:#c48a00;
          --vcink:#fff; /* D-043: the ink on a filled kind chip — the slot's white on the light theme, dark on the dark theme's lighter fills */
          /* D-069 (his L-17, L-10): the In-flight row's one hue (my pick) · a colour per stage for a gate's effect (its option, my proposal) */
          --secrow:#be123c; --if:#0e7490; --st-EDGE:#475569; --st-GATE:#a16207; --st-INPUT:#0e7490; --st-HANDLER:#4f46e5; --st-EFFECTS:#0f766e; --st-ANSWER:#15803d; --st-UNCAUGHT:#b91c1c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --alert:#f0a35a; --alert-soft:#3b2914;
          --k-success:#5fc28e; --k-refusal:#e5b454; --k-framework:#94a3b8; --k-validation:#a78bfa; --k-uncaught:#f47272;
          --f-saved:#5fc28e; --f-maybe:#f2c94c; --f-rolled:#94a3b8; --f-unsaved:#f0955a; --f-after:#6fa8e8; --p-norm:#3b4658; --p-common:#64748b;
          --m-GET:#6fa8e8; --m-POST:#5fc28e; --m-PUT:#e5b454; --m-PATCH:#b69cf0; --m-DELETE:#f47272; --sh:#f472b6; --shp:32%; --el:#facc15; --vcink:#0b0e13;
          --secrow:#fb7185; --if:#5ec8dc; --st-EDGE:#a8b3c4; --st-GATE:#e5b454; --st-INPUT:#5ec8dc; --st-HANDLER:#a5a8f5; --st-EFFECTS:#5fd0bf; --st-ANSWER:#5fc28e; --st-UNCAUGHT:#f47272; } }
  :root[data-theme="dark"] { --alert:#f0a35a; --alert-soft:#3b2914;
          --k-success:#5fc28e; --k-refusal:#e5b454; --k-framework:#94a3b8; --k-validation:#a78bfa; --k-uncaught:#f47272;
          --f-saved:#5fc28e; --f-maybe:#f2c94c; --f-rolled:#94a3b8; --f-unsaved:#f0955a; --f-after:#6fa8e8; --p-norm:#3b4658; --p-common:#64748b;
          --m-GET:#6fa8e8; --m-POST:#5fc28e; --m-PUT:#e5b454; --m-PATCH:#b69cf0; --m-DELETE:#f47272; --sh:#f472b6; --shp:32%; --el:#facc15; --vcink:#0b0e13;
          --secrow:#fb7185; --if:#5ec8dc; --st-EDGE:#a8b3c4; --st-GATE:#e5b454; --st-INPUT:#5ec8dc; --st-HANDLER:#a5a8f5; --st-EFFECTS:#5fd0bf; --st-ANSWER:#5fc28e; --st-UNCAUGHT:#f47272; }
  body { background: var(--ground); }

  .eyebrow { font-size: var(--fs-min); letter-spacing: .18em; text-transform: uppercase; color: var(--accent); margin: 0; }
  h1 { font-size: 2em; line-height: 1.15; margin: 8px 0 0; text-wrap: balance; }
  .lede { color: var(--ink-soft); max-width: 92ch; margin: 12px 0 0; }
  .prop { font-size: var(--fs-sm); color: var(--alert); background: var(--alert-soft); border: 1px solid var(--alert); border-radius: 8px;
          padding: 6px 12px; margin: 12px 0 0; max-width: 92ch; }
  .stamp { font-size: var(--fs-xs); color: var(--muted); margin: 10px 0 0; font-variant-numeric: tabular-nums; }
  .keys { font-size: var(--fs-xs); color: var(--muted); margin: 6px 0 0; max-width: 92ch; }
  .cap { font-size: var(--fs-sm); color: var(--ink-soft); margin: 0; max-width: 92ch; }
  /* D-038: what is not actionable (ledes, column descriptions, the build command, the head line) sits behind ONE toggle beside
     each section's title — closed by default, remembered per viewer. A closed section draws none of its .ainfo */
  .itog { flex: none; width: 26px; height: 26px; padding: 0; box-sizing: border-box; border-radius: 50%; border: 1.5px solid var(--rule); background: var(--raised);
          color: var(--ink-soft); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .itog svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; pointer-events: none; }
  .itog:hover { border-color: var(--accent); color: var(--accent); }
  .itog[aria-expanded="true"] { border-color: var(--accent); background: var(--accent); color: var(--ground); }
  .itog:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sec[data-info="closed"] .ainfo { display: none !important; }
  .ainfo > :first-child { margin-top: 0; }
  #info-board, #info-one { border-left: 3px solid var(--rule); padding: 2px 0 2px 12px; display: flex; flex-direction: column; gap: 6px; }
  #info-board > p, #info-one > p { margin: 0; }
  #info-one .sub { color: var(--muted); font-size: var(--fs-xs); }
  /* the link buttons: an icon and a short word; the whole sentence is the hover and the aria-label */
  a.lbtn { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-size: var(--fs-xs); padding: 4px 10px 4px 8px; white-space: nowrap; }
  a.lbtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; flex: none; }
  a.lbtn[aria-disabled="true"] { opacity: .45; pointer-events: none; }
  .btn { font: inherit; font-size: var(--fs-sm); letter-spacing: inherit; cursor: pointer; border-radius: 8px; padding: 6px 12px; border: 1px solid var(--rule); background: var(--raised); color: var(--ink); }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.quiet { background: transparent; color: var(--ink-soft); font-size: var(--fs-xs); padding: 4px 10px; }
  .said { font-size: var(--fs-xs); color: var(--accent); }

  /* ── the rail ── */
  .rail { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: flex-start; margin: 0 0 10px; }
  .rgrp, .mgrp { display: flex; flex-direction: column; gap: 5px; }
  .rgrp[hidden] { display: none; }
  .rgrp > .rl, .mgrp > .rl { font-size: var(--fs-min); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .opts { display: flex; flex-wrap: wrap; gap: 5px; }
  /* an option is a small icon square (D-034): its words are its aria-label and its hover; pressed = filled; the agent's pick on a
     rail he has not ruled wears a DASHED border. background-clip keeps the dashes' gaps open when the square is also pressed */
  .opt { cursor: pointer; width: 32px; height: 32px; padding: 0; box-sizing: border-box; border-radius: 7px; border: 1.5px solid var(--rule);
         background: var(--raised); background-clip: padding-box; color: var(--ink-soft); display: inline-flex; align-items: center; justify-content: center; }
  .opt svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; pointer-events: none; }
  .opt svg .fl { fill: currentColor; stroke: none; }
  .opt:hover { border-color: var(--accent); color: var(--accent); }
  .opt[data-pick="true"] { border-style: dashed; border-color: var(--ink-soft); }
  .opt[aria-checked="true"] { border-color: var(--accent); background: var(--accent); color: var(--ground); }
  .opt[aria-checked="true"][data-pick="true"] { border-color: var(--ink); }
  .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .rkey { align-self: flex-end; display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--muted); padding-bottom: 7px; }
  .rkey i { width: 14px; height: 14px; border: 1.5px dashed var(--ink-soft); border-radius: 4px; display: block; box-sizing: border-box; }
  .status { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: var(--fs-xs); color: var(--ink-soft); margin: 0 0 8px; }
  .litchip { display: inline-flex; gap: 8px; align-items: center; color: var(--alert); border: 1px solid var(--alert); background: var(--alert-soft); border-radius: 8px; padding: 2px 8px; }
  .litchip[hidden] { display: none; }
  /* D-041: the element light — its chip, its rows and cells in the table, its marks in the two columns, its line at a column's top */
  .elchip { color: var(--ink); border-color: var(--el); background: color-mix(in srgb, var(--el) 16%, var(--card)); }
  .elchip b { font-weight: 700; }
  tr.row[data-el="off"] td > *, .card[data-el="off"] > * { opacity: .22; }
  tr.row[data-el="on"] td.id, .card[data-el="on"] { box-shadow: inset 5px 0 0 var(--el); }
  td[data-elcell="true"], .cc[data-elcell="true"], .idc[data-elcell="true"] { outline: 2.5px solid var(--el); outline-offset: -2px; border-radius: 3px; }
  #ocol-uni [data-key], #ocol-cm [data-key] { cursor: pointer; }
  #ocol-uni [data-key]:hover, #ocol-cm [data-key]:hover { text-decoration: underline dotted; text-underline-offset: 2px; }
  .elon { outline: 2.5px solid var(--el) !important; outline-offset: 1px; border-radius: 4px; box-shadow: 0 0 0 5px color-mix(in srgb, var(--el) 30%, transparent) !important; }
  .elsay { font-size: var(--fs-xs); color: var(--ink); margin: 0 0 6px; padding: 2px 8px; border-left: 3px solid var(--el); background: color-mix(in srgb, var(--el) 10%, transparent); }
  .elsay[hidden] { display: none; }
  .elsay[data-here="false"] { color: var(--alert); border-left-color: var(--alert); background: var(--alert-soft); font-weight: 650; }
  /* D-042: the code map's line says WHY it does not name the lit element; a reason that names a field links it. Pointing at the
     link (or focusing it) lights that field, a click pins the light there — the element light's outline, dashed and filled */
  .elsay .elwhy { white-space: normal; }
  .elsay .elwhy b { font-weight: 700; cursor: help; }
  .elsay .elat { font-weight: 500; color: var(--ink-soft); margin-left: 4px; }
  .elref { font: inherit; font-weight: 600; background: none; border: 0; padding: 0 3px; margin: 0 1px 0 4px; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
  .elref:hover, .elref:focus-visible { outline: 2px solid var(--el); outline-offset: 1px; border-radius: 3px; }
  [data-elref] { outline: 2.5px dashed var(--el) !important; outline-offset: 3px !important; border-radius: 4px; background-color: color-mix(in srgb, var(--el) 14%, transparent) !important; }
  .litchip button, .status button { font: inherit; font-size: var(--fs-min); cursor: pointer; background: none; border: 0; color: inherit; text-decoration: underline; padding: 0; }

  /* ── the pin: the selected endpoint's row under the table's names, always at the top of the page (his ask 2026-09-24) ── */
  .pin { position: sticky; top: 0; z-index: 40; overflow: hidden; background: var(--card); border: 1px solid var(--rule); border-bottom: 2px solid var(--accent); border-radius: 0 0 var(--radius, 10px) var(--radius, 10px); margin: 0 0 10px; box-shadow: 0 6px 14px -10px rgba(0,0,0,.45); }
  .pin:empty { display: none; }
  .pin table.grid thead th { position: static; }
  .pin table.grid.fixed { table-layout: fixed; }
  .pin table.grid.fixed thead th { overflow: hidden; }   /* a block name longer than its columns is cut at their edge, as the table cuts it */
  .pin tr.row td, .pin tr.row td.id { background: color-mix(in srgb, var(--accent) 9%, var(--card)); cursor: pointer; }
  .pin tr.row td.id { box-shadow: inset 4px 0 0 var(--accent); }
  /* ── the board: one scroll surface, header and identity column stick ── */
  .board { position: relative; overflow: auto; max-height: calc(100vh - 24px); border: 1px solid var(--rule); border-radius: var(--radius, 10px); background: var(--card); }
  .board.cardsmode { max-height: none; overflow: visible; border: 0; background: transparent; }
  table.grid { border-collapse: separate; border-spacing: 0; font-size: var(--fs-min); font-variant-numeric: tabular-nums; }
  table.grid th, table.grid td { padding: 0 1px; height: 21px; white-space: nowrap; border-bottom: 1px solid var(--rule-soft); text-align: center; vertical-align: middle; line-height: 1.2; }
  table.grid thead th { position: sticky; background: var(--card); z-index: 3; }
  table.grid thead tr.bh th { top: var(--pagetop, 0px); height: auto; padding: 3px 4px 3px 6px; font-weight: 650; color: var(--ink-soft); border-bottom: 2px solid var(--rule); text-align: left; white-space: normal; line-height: 1.15; vertical-align: bottom; max-width: 1px; }
  table.grid thead tr.ch th { top: calc(var(--pagetop, 0px) + var(--bh, 24px)); height: auto; padding: 4px 3px 5px; vertical-align: bottom; cursor: pointer; border-bottom: 2px solid var(--rule); }
  table.grid thead tr.ch th:hover .hd { color: var(--accent); }
  table.grid th.idh, table.grid td.id { position: sticky; left: 0; z-index: 2; background: var(--card); text-align: left; border-right: 2px solid var(--rule); }
  table.grid thead th.idh { z-index: 5; }
  table.grid th.bstart, table.grid td.bstart { border-left: 1px solid var(--rule); }
  table.grid td.bz, table.grid th.bz { background: var(--bz); }
  .hd { display: block; font-weight: 650; color: var(--ink); font-size: var(--fs-min); white-space: normal; line-height: 1.1; }
  .hd .dir { color: var(--accent); }
  .pips { display: flex; gap: 2px; justify-content: center; margin: 2px 0 3px; }
  .pips i { width: 5px; height: 5px; border-radius: 1px; background: var(--rule); display: block; }
  .pips i.on { background: var(--accent); }
  .pips i.al { background: var(--alert); border-radius: 50%; }
  th[data-sorted] .hd { color: var(--accent); }
  .strip { display: flex; height: 10px; border-radius: 3px; overflow: hidden; background: var(--rule-soft); margin: 0 auto; }
  .strip .sg { height: 100%; min-width: 2px; cursor: pointer; box-shadow: inset -1px 0 0 var(--card); }
  .strip .sg:hover { filter: brightness(1.15); outline: 1px solid var(--ink); outline-offset: -1px; }
  .strip .sg[data-lit="true"] { outline: 2px solid var(--alert); outline-offset: -2px; }

  tr.row { cursor: pointer; }
  tr.row:hover td { background: color-mix(in srgb, var(--accent) 9%, var(--card)); }
  tr.row[data-sel="true"] td { background: color-mix(in srgb, var(--accent) 18%, var(--card)); }
  tr.row[data-dim="true"] td > * { opacity: .22; }
  tr.grow td { background: var(--raised); font-weight: 650; color: var(--ink-soft); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); height: 23px; }
  tr.grow td.id { background: var(--raised); }
  tr.grow td.id { white-space: normal; max-width: 226px; line-height: 1.3; padding: 3px 4px; }
  tr.grow .gn { color: var(--ink); } tr.grow .gc { color: var(--muted); font-weight: 400; margin-left: 8px; }
  tr.grow td .agg { color: var(--muted); font-weight: 400; }
  .idc { display: flex; align-items: center; gap: 6px; max-width: 300px; }
  .mth { font-weight: 700; font-size: var(--fs-min); width: 4.4em; flex: none; letter-spacing: .02em; }
  .pth { color: var(--ink); white-space: normal; min-width: 12em; line-height: 1.25; }   /* wraps after a slash (pathEl), never an ellipsis */

  /* ── cells ── */
  .z { color: var(--muted); }
  .ab { color: var(--muted); font-style: italic; }
  .ab.unk { color: var(--ink-soft); }
  /* a number is a HEAT cell: its tint is its value against the column's largest, so a column read top to bottom is a picture */
  .num { display: block; min-width: 20px; padding: 0 3px; border-radius: 3px; line-height: 17px; color: var(--ink); }
  .num.z { color: var(--muted); }
  .card .num { display: inline-block; }
  .slot { display: inline-block; min-width: 18px; height: 16px; line-height: 16px; border-radius: 4px; color: #fff; font-weight: 650; padding: 0 3px; }
  .slot.e0 { background: transparent !important; color: var(--muted); border: 1px dashed var(--rule); line-height: 14px; font-weight: 400; }
  .spine { display: inline-flex; gap: 1px; align-items: center; }
  .spine i { width: 7px; height: 14px; border-radius: 2px; display: block; border: 1px solid var(--rule); box-sizing: border-box; }
  .spine i.bay { margin-left: 3px; border-style: dashed; }
  .stack { display: inline-flex; align-items: center; gap: 4px; }
  .stack .sb { display: flex; width: 34px; height: 10px; border-radius: 3px; overflow: hidden; background: var(--rule-soft); }
  .stack .sb i { display: block; height: 100%; }
  .stack .n { min-width: 16px; text-align: right; }
  .ratio { display: inline-flex; flex-direction: column; align-items: stretch; min-width: 38px; }
  .ratio .bar { height: 3px; background: var(--rule); border-radius: 2px; overflow: hidden; margin-top: 1px; }
  .ratio .bar i { display: block; height: 100%; background: var(--k-success); }
  .dots { display: inline-flex; gap: 1px; align-items: center; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--rule); display: block; box-sizing: border-box; }
  .dots i.on { background: var(--alert); border-color: var(--alert); }
  /* a category: the column's most common value is drawn quiet, every other value speaks — the odd one out is what a column is for */
  .cat { display: inline-block; white-space: nowrap; vertical-align: middle; border-radius: 4px; padding: 0 5px; border: 1px solid var(--accent); color: var(--ink); }
  .cat.norm { border-color: transparent; color: var(--muted); padding: 0; }

  /* ── small multiples ── */
  .cards { display: grid; gap: 10px; margin-top: 10px; }
  .cards[data-n="2"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cards[data-n="3"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @media (max-width: 1100px) { .cards[data-n="3"] { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 760px) { .cards[data-n="2"], .cards[data-n="3"] { grid-template-columns: minmax(0, 1fr); } }
  .ghead { grid-column: 1 / -1; font-weight: 650; color: var(--ink-soft); font-size: var(--fs-sm); padding: 6px 2px 2px; border-bottom: 1px solid var(--rule); }
  .ghead .gc { color: var(--muted); font-weight: 400; margin-left: 8px; font-size: var(--fs-xs); }
  .card { background: var(--card); border: 1px solid var(--rule); border-radius: 9px; padding: 6px 8px 7px; cursor: pointer; font-size: var(--fs-min); font-variant-numeric: tabular-nums; min-width: 0; }
  .card:hover { border-color: var(--accent); }
  .card[data-sel="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .card[data-dim="true"] > * { opacity: .22; }
  .card .idc { max-width: none; margin-bottom: 4px; }
  /* a card's blocks FLOW: each block is a short run of cells behind a quiet name, so a card is a few lines, not a column */
  .cbs { display: flex; flex-wrap: wrap; gap: 3px 0; }
  .cb { display: inline-flex; flex-wrap: nowrap; align-items: center; gap: 0 7px; padding: 1px 9px 1px 0; margin-right: 8px; border-right: 1px solid var(--rule); white-space: nowrap; }
  .cb .bn { color: var(--accent); font-size: var(--fs-min); max-width: 6em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cc { display: inline-flex; align-items: center; gap: 4px; }
  .cc .cl { color: var(--muted); }
    /* ── the Shared group stands out (D-034): three treatments on a rail, decided by seeing; `.sh` marks its header and cells,
     `.shf`/`.shl` its first and last column, and the board carries the chosen treatment (none when the group is not drawn).
     Every treatment is drawn in --sh, the group's own hue, never the heat's accent; each marks EVERY shared column's head ── */
  .board[data-slook="band"] th.sh { background: color-mix(in srgb, var(--sh) var(--shp), var(--card)); }
  .board[data-slook="band"] tr.bh th.sh, .board[data-slook="band"] tr.ch th.sh .hd { color: var(--sh); }
  .board[data-slook="band"] td.sh { background: color-mix(in srgb, var(--sh) 8%, var(--card)); }
  .board[data-slook="band"] tr.grow td.sh { background: color-mix(in srgb, var(--sh) 14%, var(--raised)); }
  .board[data-slook="band"] tr.row:hover td.sh { background: color-mix(in srgb, var(--sh) 16%, var(--card)); }
  .board[data-slook="band"] tr.row[data-sel="true"] td.sh { background: color-mix(in srgb, var(--sh) 24%, var(--card)); }
  .board[data-slook="rule"] tr.bh th.sh { border-top: 4px solid var(--sh); color: var(--sh); font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
  .board[data-slook="rule"] tr.ch th.sh .hd { color: var(--sh); font-weight: 800; }
  .board[data-slook="box"] tr.bh th.sh { border-top: 2px solid var(--sh); color: var(--sh); }
  .board[data-slook="box"] tr.ch th.sh .hd { color: var(--sh); }
  .board[data-slook="box"] .shf { border-left: 2px solid var(--sh); }
  .board[data-slook="box"] .shl { border-right: 2px solid var(--sh); }
  .board[data-slook="box"] tbody tr:last-child td.sh { border-bottom: 2px solid var(--sh); }
  .board[data-slook="band"] .cb.sh { background: color-mix(in srgb, var(--sh) 10%, var(--card)); border-radius: 5px; padding-left: 5px; }
  .board[data-slook="band"] .cb.sh .bn { color: var(--sh); }
  .board[data-slook="rule"] .cb.sh { border-top: 3px solid var(--sh); padding-top: 2px; }
  .board[data-slook="rule"] .cb.sh .bn { font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--sh); }
  .board[data-slook="box"] .cb.sh { border: 1.5px solid var(--sh); border-radius: 6px; padding: 1px 6px; }
  .board[data-slook="box"] .cb.sh .bn { color: var(--sh); }
  .keytable { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--radius, 10px); background: var(--card); }

  /* ── the block marks (D-036): a block paired to a lab part wears the part's icon and colour; the rest wear my pick (dashed) ── */
  .bm { display: inline-flex; vertical-align: -3px; margin-right: 4px; color: var(--bc, var(--muted)); }
  .bm svg { width: 14px; height: 14px; display: block; }
  .bm[data-pick="true"] { outline: 1.5px dashed currentColor; outline-offset: 1px; border-radius: 3px; }
  table.grid thead tr.bh th[data-block]:not(.sh) { box-shadow: inset 0 3px 0 var(--bc, transparent); padding-top: 6px; }
  table.grid thead tr.bh th.sh .bm { color: var(--sh); }
  .cb .bn .bm svg { width: 12px; height: 12px; }
  .cb.sh .bn .bm { color: var(--sh); }
  .mkey { display: inline-flex; align-items: center; gap: 6px; }
  .mkey i { width: 14px; height: 14px; border: 1.5px dashed var(--ink-soft); border-radius: 3px; display: block; box-sizing: border-box; }

  /* ── section 2: one endpoint, three columns (D-036) — the universe card · the gaps (narrow) · the code map ── */
  /* the face of ONE ENDPOINT is one line (D-038): the title pill, the toggle, the method and path, the two links */
  .onehead { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; min-width: 0; flex: 1 1 auto; }
  .onehead h3 { margin: 0 6px 0 4px; font-size: 1.15em; display: flex; gap: 10px; align-items: baseline; word-break: break-all; }
  .onehead h3 .mth { width: auto; font-size: 1em; }
  .onecmd { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: var(--fs-xs); color: var(--muted); }
  .onecmd pre { font-size: var(--fs-min); background: var(--raised); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; white-space: pre-wrap; word-break: break-all; margin: 0; flex: 1 1 520px; }
  .onenote { font-size: var(--fs-xs); color: var(--alert); margin: 0; }
  .onenote[hidden] { display: none; }
  .one3 { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .62fr) minmax(0, 1.75fr); gap: 14px; align-items: start; }
  .one3[data-stack="true"] { grid-template-columns: minmax(0, 1fr); }
  .ocol { background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius, 10px); padding: 10px 12px 12px; min-width: 0; }
  .ocol > h3 { margin: 0 0 2px; font-size: var(--fs-sm); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); display: flex; gap: 8px; align-items: center; }
  .ocol > h3 svg { width: 16px; height: 16px; }
  .ocol > .plain { font-size: var(--fs-xs); color: var(--muted); margin: 0 0 8px; }
  .ocol.gaps { border-style: dashed; }
  .mine { font-size: var(--fs-min); letter-spacing: 0; text-transform: none; border: 1.5px dashed var(--ink-soft); border-radius: 6px; padding: 0 6px; color: var(--ink-soft); font-weight: 400; }
  /* THE UNIVERSE COLUMN wears the station's card (D-040): `.ust` is the station's panel and holds its rules, lifted into the
     <style id="unilook"> block above (tokens per theme + the card's own classes). This page adds only the card's frame and the
     12px FLOOR over the lifted sizes (the station sets .sechd 10px · .pchip/.sublbl 11px · .ttag .7em — the lab's floor block,
     the same law); every colour, icon, badge and group inside is the station's. */
  .ust { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-top: 6px; }
  .ust .phead { display: block; }
  .ust .sechd, .ust .sechd .cnt, .ust .pchip, .ust .sublbl, .ust .kv, .ust .ttag, .ust .tab, .ust .tab .tabn, .ust .jmeta, .ust .jcid, .ust .corp,
  .ust .ncomp, .ust .more, .ust .xmore, .ust .doc, .ust .flagrow, .ust .flagrow .flbl, .ust .ptype, .ust .pnav { font-size: 12px; }
  .ust .sublbl > span[style], .ust .doc[style] { font-size: 12px !important; }   /* the card's own inline 10px/11px notes */
  .ust .xtw { cursor: help; }
  .ust .urow[data-lit-attr="true"] { outline-offset: -1px; }
  .usilent { font-size: var(--fs-min); color: var(--muted); margin: 8px 0 0; }
  /* the gaps: grouped by block, each attribute a line */
  .gblk { margin: 8px 0 0; }
  .gblk > .gbh { font-size: var(--fs-min); color: var(--ink-soft); display: flex; align-items: center; gap: 2px; font-weight: 650; }
  .gap { font-size: var(--fs-xs); color: var(--ink); padding: 1px 0 1px 20px; }
  .gap .pt { font-size: var(--fs-min); color: var(--muted); border: 1px solid var(--rule); border-radius: 6px; padding: 0 5px; margin-left: 6px; }
  .gcount { font-size: var(--fs-xs); color: var(--muted); margin: 0; }
  /* the two directions of the gaps (D-040): icon squares like the rail's (D-034), the agent's pick dashed */
  .opts.gdir { margin: 4px 0 6px; }
  .gblk[data-row] > .gbh .bm { color: var(--accent); }
  .gap.gunm { color: var(--alert); }
  .gfacts { display: flex; flex-wrap: wrap; gap: 3px 4px; padding: 2px 0 2px 20px; }
  .gfact { font-size: var(--fs-min); color: var(--ink); border: 1px solid var(--rule); border-radius: 5px; padding: 0 5px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gfact[hidden] { display: none; }
  .gfmore { font: inherit; font-size: var(--fs-min); color: var(--accent); background: none; border: 1px dashed var(--rule); border-radius: 5px; padding: 0 5px; cursor: pointer; }
  /* the code map: grouped by block, the pairs in a grid */
  .cmb { border-top: 1px solid var(--rule); padding: 8px 0 4px; }
  .cmb:first-of-type { border-top: 0; padding-top: 0; }
  .cmb > .cbh { font-size: var(--fs-min); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); font-weight: 650; display: flex; align-items: center; margin: 0 0 4px; }
  .cmb.sh > .cbh, .cmb.sh .cbh .bm, .gblk[data-block="_shared"] .bm, #marks .bm[data-mark="_shared"] { color: var(--sh); }
  .pairs { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 4px 14px; }
  .pair { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 0 6px; align-items: start; font-size: var(--fs-xs); min-width: 0; }
  .pair.wide { grid-column: 1 / -1; }
  .pair .pi { color: var(--ink-soft); padding-top: 1px; display: flex; }
  .pair .pi svg { width: 15px; height: 15px; }
  .pair .pk { color: var(--muted); }
  .pair .pv { color: var(--ink); overflow-wrap: anywhere; }
  .pair .pv.z { color: var(--muted); }
  .pair .pv .slot { margin-right: 3px; }
  .pair .pv .num { display: inline-block; }
  .pair ul { margin: 2px 0 0; padding-left: 16px; }
  .pair table { border-collapse: collapse; font-size: var(--fs-min); width: 100%; margin-top: 2px; }
  .pair table td, .pair table th { text-align: left; padding: 1px 6px 1px 0; vertical-align: top; }
  .pair table th { color: var(--muted); font-weight: 400; }
  .pair[data-gap="true"] > div > .pk, .pair [data-sub][data-gap="true"] .pk { color: var(--alert); }
  .pair[data-gap="part"] > div > .pk, .pair [data-sub][data-gap="part"] .pk { color: var(--alert); font-style: italic; }
  /* ── D-053 · the endings in the order they happen: one table, the own check on its ending's row, the moments as header rows (or
     inside the stage chip), shared code named apart, muted and dashed — never drawn as an own check ── */
  .eopts { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 2px 0 4px; }
  .eplain p { margin: 0 0 4px; color: var(--ink-soft); font-size: var(--fs-min); max-width: 110ch; }
  .pair table.etab tr.mom th { padding: 6px 6px 1px 0; color: var(--ink-soft); font-weight: 650; border-top: 1px solid var(--rule-soft); white-space: normal; }
  .pair table.etab tr.mom[data-mom="failed"] th { color: var(--ink); }
  .pair table.etab td.chk { min-width: 12em; }
  .etab .ck { display: block; color: var(--ink); }
  .etab .ckp { color: var(--muted); }
  .etab .shd { color: var(--muted); display: block; }
  .etab .ck.ckm { color: var(--muted); }
  .etab .shm { font-size: var(--fs-min); border: 1px dashed var(--rule); border-radius: 4px; padding: 0 4px; margin-right: 1px; }
  .etab td.says .ckl { color: var(--ink); margin-top: 1px; }
  .etab td.says.unpl { font-style: italic; color: var(--muted); }
  .etab .mw { font-weight: 400; margin-left: 4px; color: var(--ink-soft); white-space: nowrap; }
  .etab th.chkh .pk { color: var(--muted); }
  .pair table.etab tr:first-child th { white-space: nowrap; }
  [data-lit-attr="true"] { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  /* ── D-043 · the code map's VALUE CHIPS: every action word and every value from a fixed set, a colour and/or an icon. Each
     family's look is the one it already wears elsewhere (the JS block THE VALUE CHIPS names where); only the chip's frame is
     here. A family with no look anywhere wears an icon from the station's set, never a new colour ── */
  .vc { display: inline-flex; align-items: center; gap: 3px; vertical-align: middle; white-space: nowrap; font-size: var(--fs-min); line-height: 16px;
        border-radius: 4px; padding: 0 5px; border: 1px solid transparent; box-sizing: border-box; color: var(--ink); cursor: help; }
  .vc svg { width: 13px; height: 13px; flex: none; display: block; }
  .vc .vn { color: var(--ink-soft); margin-left: 2px; font-variant-numeric: tabular-nums; }
  .vcs { display: inline-flex; flex-wrap: wrap; gap: 3px 4px; margin-left: 6px; vertical-align: middle; }
  .pair .pv .vcs.solo { margin-left: 0; }
  #ocol-cm .vc.jdrw, #mogrid .vc.jdrw, #moband .vc.jdrw { display: inline-flex; gap: 3px; border: 0; }   /* the lab's channel chip: its own fill and ink (D-069: BY MOMENT's too) */
  #ocol-cm .vc.jdrw svg, #mogrid .vc.jdrw svg, #moband .vc.jdrw svg { width: 12px; height: 12px; }
  .vc.slot { height: auto; min-width: 0; line-height: 16px; padding: 0 6px 0 4px; color: var(--vcink); }   /* the table's endings slot, a kind's glyph in it */
  .vc-stage { border-color: var(--rule); padding-left: 3px; }
  .vc-stage .spine { gap: 1px; margin-right: 2px; }
  .vc-stage .spine i { width: 5px; height: 11px; }
  .vc-stage .spine i.bay { margin-left: 2px; }
  .vc-stage .spine i.on { background: var(--accent); border-color: var(--accent); }
  .vc-stage b { font-weight: 650; letter-spacing: .02em; }
  .vc-status { font-weight: 650; border-color: var(--vcc); background: color-mix(in srgb, var(--vcc) 18%, transparent); font-variant-numeric: tabular-nums; }
  .vc .sw { width: 10px; height: 10px; border-radius: 2px; display: block; flex: none; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 16%, transparent); }
  .vc .sw.dot { border-radius: 50%; }
  .vc-fate, .vc-piece, .vc-ifk, .vc-switch, .vc-branch, .vc-limit, .vc-ent { border-color: var(--rule); }
  .vc-ifk svg, .vc-switch svg, .vc-branch svg, .vc-limit svg, .vc-does svg, .vc-arm svg { color: var(--ink-soft); }
  .vc-life { border-left: 3px solid var(--vcc); background: color-mix(in srgb, var(--vcc) 13%, transparent); border-radius: 2px 4px 4px 2px; }
  .vc-method { font-weight: 700; color: var(--vcc); padding: 0 1px; }
  /* ── D-052 · an element the Gabe Universe draws: its glyph in its kind colour (the colours per kind and per theme are the
     generated block under THE STATION'S KIND COLOURS), and its subcategory as a label at the END, the station's badge colour
     filled under the station's badge ink — the station's own disc, as a word ── */
  .skg { display: inline-flex; vertical-align: -2px; margin-right: 3px; flex: none; cursor: help; }
  .skg svg { width: 14px; height: 14px; display: block; }
  .vc.sksub { background: var(--skb); color: var(--skt); border: 0; font-weight: 650; border-radius: 8px; padding: 0 6px 0 2px; margin-left: 4px; gap: 2px; }
  .vc.sksub canvas.skd { width: 14px; height: 14px; display: block; flex: none; }   /* the station's own badge glyph, painted by its __badgeGlyph */
  .skn { white-space: nowrap; }
  .skkey { margin: 0 0 10px; }
  .skkey .skr { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; font-size: var(--fs-xs); padding: 2px 0; border-top: 1px dotted var(--rule); }
  .skkey .skr .skt2 { font-weight: 650; }
  .skkey .skr .skw { color: var(--ink-soft); flex: 1 1 100%; padding-left: 20px; }
  .skkey .sknot { font-size: var(--fs-xs); color: var(--ink-soft); margin: 6px 0 0; }
  .vc-alarm { border-color: color-mix(in srgb, var(--alert) 55%, var(--rule)); }
  .vc-alarm svg { color: var(--alert); }
  .vc-rule { border-color: color-mix(in srgb, var(--k-validation) 55%, var(--rule)); }
  .vc-rule svg { color: var(--k-validation); }
  .vc-does, .vc-arm { border: 1px dotted var(--ink-soft); }                 /* about how the map knows (D-017): dotted */
  .pair table td.says { color: var(--ink-soft); }
  /* the key to the chips, behind the section's info toggle (D-038): a family per line, its chips drawn, where each look is read */
  .enckey { border-left: 3px solid var(--rule); padding: 2px 0 2px 10px; margin: 0 0 10px; display: grid; gap: 4px; }
  .enckey .ekt { font-size: var(--fs-xs); color: var(--ink-soft); margin: 0 0 2px; }
  .enckey .ekr { display: grid; grid-template-columns: minmax(0, 11em) minmax(0, 1fr); gap: 0 10px; align-items: start; font-size: var(--fs-min); }
  .enckey .ekn { color: var(--ink-soft); font-weight: 650; }
  .enckey .ekv { display: flex; flex-wrap: wrap; gap: 3px 4px; align-items: center; }
  .enckey .ekf { color: var(--muted); margin-left: 4px; }
  .enckey .ekf.mine { border: 1.5px dashed var(--ink-soft); border-radius: 6px; padding: 0 6px; color: var(--ink-soft); }

  /* ── BY MOMENT (his ask 2026-09-26): one endpoint's moments × the blocks that happen in time. A column is a moment (his default,
     D-055: time left to right), a row a block, a cell that block's elements acting then; the path picker keeps one ending's path.
     The two looks sit on icon squares — his defaults ruled, no dash; the rest of the look is my proposal (D-025.2) ── */
  #sec-mo [data-key] { cursor: pointer; }
  #sec-mo [data-key]:hover { text-decoration: underline dotted; text-underline-offset: 2px; }
  .mohead { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; min-width: 0; flex: 1 1 auto; }
  .mohead h3 { margin: 0 6px 0 4px; font-size: 1.15em; display: flex; gap: 10px; align-items: baseline; word-break: break-all; }
  #info-mo { border-left: 3px solid var(--rule); padding: 2px 0 2px 12px; display: flex; flex-direction: column; gap: 6px; margin: 0 0 10px; }
  #info-mo > p { margin: 0; max-width: 110ch; }
  #info-mo .mocov { font-size: var(--fs-xs); color: var(--ink-soft); margin: 0; padding-left: 12px; }
  .mobar { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: flex-start; margin: 0 0 8px; }
  .mopaths { display: flex; flex-wrap: wrap; gap: 4px 12px; max-width: 100%; align-items: flex-start; }
  /* the path picker (R4): the endings under the moment each one leaves at, in time order; two of one status there carry their own words */
  .mopg { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; padding-left: 8px; border-left: 2px solid var(--rule-soft); }
  .mopg .mopgl { font-size: var(--fs-min); color: var(--muted); flex: 1 1 100%; }
  .mopath .mpf { max-width: 16em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mopath { font: inherit; font-size: var(--fs-min); cursor: pointer; border: 1.5px solid var(--rule); border-radius: 7px; background: var(--raised); color: var(--ink-soft);
            padding: 2px 6px; display: inline-flex; gap: 4px; align-items: center; min-height: 26px; box-sizing: border-box; }
  .mopath:hover { border-color: var(--accent); }
  .mopath[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 1.5px var(--accent); color: var(--ink); font-weight: 650; }
  .mopath:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mopath .vc { cursor: pointer; }
  .mogrid { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--radius, 10px); background: var(--card); }
  /* the matrix fits its box (R5): a fixed layout shares the width out, a chip wraps inside its cell instead of widening it; only when
     the columns would fall under their floor does the box scroll, and then it says so */
  table.motab { border-collapse: separate; border-spacing: 0; font-size: var(--fs-min); width: 100%; table-layout: fixed; }
  table.motab col.mhc { width: 11em; }
  table.motab[data-lay="cols"] col.mhc { width: 9.5em; }
  table.motab[data-lay="cols"] td { padding: 3px 4px; }   /* moFloor's room: the cell's own padding is 8px across in the columns look */
  .moscroll { font-size: var(--fs-min); color: var(--muted); margin: 0 0 4px; }
  table.motab th, table.motab td { border-bottom: 1px solid var(--rule-soft); border-left: 1px solid var(--rule-soft); padding: 4px 6px; vertical-align: top; text-align: left; }
  table.motab thead th { background: var(--card); font-weight: 650; color: var(--ink-soft); border-bottom: 2px solid var(--rule); white-space: normal; overflow-wrap: normal; vertical-align: bottom; }   /* review F27: never between two letters */
  table.motab thead th[data-block] { box-shadow: inset 0 3px 0 var(--bc, transparent); }
  table.motab th.mom { white-space: normal; overflow-wrap: normal; background: var(--raised); font-weight: 400; }
  table.motab.mostk thead th { position: relative; z-index: 6; }   /* review CR-07: the heads ride down under the pinned row */
  table.motab th .mjyh { margin-top: 6px; font-weight: 400; } table.motab th .mjyl { color: var(--muted); font-style: italic; }   /* review CR-20: a test's earlier requests, in Proof's head (its option) */
  table.motab.mostk thead tr:last-child th { box-shadow: 0 5px 6px -5px rgba(0,0,0,.35); }
  table.motab.mostk thead th.mosb[data-stage="out"], table.motab.mostk thead th.mocorner { background: var(--card); }
  table.motab td.mo0 { background: color-mix(in srgb, var(--ink) 2%, var(--card)); }
  table.motab tr[data-lit="true"] > th.mom { box-shadow: inset 4px 0 0 var(--accent); }
  /* an open slot (D-012's rule): a fixed moment nothing acts at is drawn, empty and dashed */
  .moempty { display: block; min-height: 14px; border: 1px dashed var(--rule); border-radius: 4px; }
  .mcs { display: flex; flex-wrap: wrap; gap: 3px 4px; align-items: center; }
  .mc { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 0 3px; border: 1px solid var(--rule); border-radius: 5px; padding: 0 5px; background: var(--card); color: var(--ink);
        max-width: 100%; box-sizing: border-box; line-height: 18px; }
  .mc .mt { min-width: 0; overflow-wrap: normal; word-break: normal; }   /* review F27 · CR-39: a name breaks at its <wbr> (_ . / and camel humps) or a space */
  #mogrid .mc > *, #moband .mc > * { min-width: 0; max-width: 100%; }
  #mogrid .mc, #mogrid .mc *, #moband .mc * { white-space: normal !important; overflow-wrap: normal; word-break: normal; }
  #mogrid .mgh0 { overflow-wrap: normal; word-break: normal; }
  #mogrid .mc.milf, #mogrid .mc.milf * { white-space: nowrap !important; }   /* review CR-32: a folded lane is one line */
  #mogrid .mc .mtw { color: var(--ink-soft); border-left: 1px solid var(--rule); padding-left: 4px; margin-left: 2px; }   /* review CR-16: what tells it from a twin */
  #mogrid .mc .mtg { display: inline-flex; align-items: center; } #mogrid .mc .mtg svg { width: 12px; height: 12px; }   /* review S4-32: the page's test mark */
  table.motab th.mom .mh2.mhs { font-weight: 400; color: var(--muted); }   /* review CR-17: a moment's calls, under its one name */
  /* a badge word never breaks ("refus al"): a value chip keeps its own no-wrap, and its column's floor is its widest badge (moFloor);
     a name breaks after its _ . / instead (moTxt's <wbr>), and only past that anywhere */
  #mogrid .mc .vc, #mogrid .mc .vc *, #moband .mc .vc, #moband .mc .vc * { white-space: nowrap !important; overflow-wrap: normal !important; }
  #mogrid .mc .vc, #moband .mc .vc { max-width: none; flex: none; }   /* its own width, so moFloor measures the word, not the chip */
  .mc .mq { color: var(--muted); font-style: italic; }
  .mc .mpv { color: var(--muted); }
  /* D-057: the Endings row's info line (behind the section's toggle) takes the head's width and never widens it: the columns were
     measured without it */
  #mogrid .moinf { display: block; width: 0; min-width: 100%; margin-top: 4px; white-space: normal; font-weight: 400; font-size: 12px; line-height: 1.35; color: var(--muted); text-transform: none; letter-spacing: 0; }
  .mcount { display: inline-block; min-width: 18px; font-weight: 650; font-variant-numeric: tabular-nums; }
  /* D-056 · the twelve adds, drawn: a status the endpoint does not declare is hollow (its frame, no fill); a test that fits endings at
     several moments rides each, its chip hollow and dashed; a function's depth, a race and a nested schema's mark ride inside the chip */

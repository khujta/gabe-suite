<title>Legibility Review</title>

<style>
  /* ── font roster (H3) — the script keeps these in sync ─────────────── */
  :root { --af-stack: ui-monospace, monospace; --af-size: 16.5px; --af-track: -0.025em; }
  /* ── text size + spacing — the reader's own dials, beside the family.
        Size scales the family's base (never below it, so the 12px floor holds at every step);
        spacing sets line height, the gap between paragraphs and a little tracking. */
  :root { --af-lh: 1.65; --af-para: 1.1; }

  /* ── title face (H3) — ONLY the section title pills pin a face: a modern
        condensed grotesque, set in caps. DIN lineage, so it reads as console
        lettering rather than book type, and it holds a long title in a pill
        without wrapping. Locally resolvable in order — Bahnschrift ships with
        Windows 10+, DIN Alternate with macOS — so nothing routes through a
        blocked webfont. Every OTHER title on the page stays in the body face:
        one distinctive treatment, or the distinction is worthless. */
  :root {
    --af-title: "Bahnschrift", "DIN Alternate", "Roboto Condensed",
                "Arial Narrow", ui-sans-serif, system-ui, sans-serif;
  }

  /* ── the legibility floor (H6) — the smallest text on a page is the text
        most often unreadable. Secondary content sizes off THESE steps, never
        below them: at the 15px base they compute to 13.8 / 12.8 / 12.3px.
        They are calc() off the roster base, NOT bare `em`, because `em`
        stacks: a .855em head inside a .92em table lands at 11.8px while both
        authored values look safe. An absolute step cannot compound. */
  :root {
    --fs-sm:  calc(var(--af-size) * 0.92);
    --fs-xs:  calc(var(--af-size) * 0.855);
    --fs-min: calc(var(--af-size) * 0.82);
  }

  /* ══ skins (H5) — chrome only: ground, ink, rules, accent, geometry.
        Sources: Catalog = docs/site/center/assets/a3.css · Blueprint = skin F ·
        Mission Console = skin B (output/mockups/center-skins.css). B and F are
        spec'd light-only; their dark arms are derived so the viewer's theme
        toggle still answers. Chart series and status colours are NEVER themed. */

  /* --muted holds ≥ 4.5:1 on card, ground and raised in every skin and theme (2026-10-04: the old greys
     measured 3.6–4.3:1 in the light themes, and the narrated dock sets its times in it at --fs-min). */
  /* ── Catalog · cool developer portal (default) ── */
  :root, :root[data-skin="catalog"] {
    --ground:#f6f7f9; --card:#ffffff; --raised:#fbfcfd;
    --ink:#141a24; --ink-soft:#3d4756; --muted:#677081;
    --rule:#e7e9ee; --rule-soft:#eef0f4;
    --accent:#4f46e5; --accent-soft:#eef0fe; --strong:#101726;
    --radius:10px;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 4px 14px rgba(16,24,40,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]), :root[data-skin="catalog"]:not([data-theme="light"]) {
      --ground:#101726; --card:#1b2436; --raised:#212b40;
      --ink:#e7ebf3; --ink-soft:#c7cfdd; --muted:#8e98ae;
      --rule:#2c3648; --rule-soft:#232d3f;
      --accent:#8b83f5; --accent-soft:#23214a; --strong:#c7cfdd;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"], :root[data-skin="catalog"][data-theme="dark"] {
    --ground:#101726; --card:#1b2436; --raised:#212b40;
    --ink:#e7ebf3; --ink-soft:#c7cfdd; --muted:#8e98ae;
    --rule:#2c3648; --rule-soft:#232d3f;
    --accent:#8b83f5; --accent-soft:#23214a; --strong:#c7cfdd;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.9);
  }
  :root[data-skin="catalog"][data-theme="light"] {
    --ground:#f6f7f9; --card:#ffffff; --raised:#fbfcfd;
    --ink:#141a24; --ink-soft:#3d4756; --muted:#677081;
    --rule:#e7e9ee; --rule-soft:#eef0f4; --accent:#4f46e5; --accent-soft:#eef0fe;
    --strong:#101726;
  }

  /* ── Blueprint · skin F, blue ink ── */
  :root[data-skin="blueprint"] {
    --ground:#f6f8fc; --card:#fdfeff; --raised:#f1f5fd;
    --ink:#16233b; --ink-soft:#41547a; --muted:#5f6f90;
    --rule:#c3d0f0; --rule-soft:#dde5f8;
    --accent:#1d4ed8; --accent-soft:#e4ecfe; --strong:#16233b;
    --radius:6px; --shadow:none;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-skin="blueprint"]:not([data-theme="light"]) {
      --ground:#0b1220; --card:#101a2e; --raised:#142138;
      --ink:#dce6fa; --ink-soft:#a8bce4; --muted:#8195bd;
      --rule:#23375f; --rule-soft:#1a2942;
      --accent:#6f9bff; --accent-soft:#16264a; --strong:#a8bce4; --shadow:none;
    }
  }
  :root[data-skin="blueprint"][data-theme="dark"] {
    --ground:#0b1220; --card:#101a2e; --raised:#142138;
    --ink:#dce6fa; --ink-soft:#a8bce4; --muted:#8195bd;
    --rule:#23375f; --rule-soft:#1a2942;
    --accent:#6f9bff; --accent-soft:#16264a; --strong:#a8bce4; --shadow:none;
  }
  :root[data-skin="blueprint"][data-theme="light"] {
    --ground:#f6f8fc; --card:#fdfeff; --raised:#f1f5fd;
    --ink:#16233b; --ink-soft:#41547a; --muted:#5f6f90;
    --rule:#c3d0f0; --rule-soft:#dde5f8; --accent:#1d4ed8; --accent-soft:#e4ecfe;
    --strong:#16233b;
  }

  /* ── Mission Console · skin B, teal ops console ── */
  :root[data-skin="mission"] {
    --ground:#eef1f4; --card:#ffffff; --raised:#f6f8fa;
    --ink:#1a2b36; --ink-soft:#4a6272; --muted:#5b6f7d;
    --rule:#c8d4dc; --rule-soft:#e2e9ee;
    --accent:#0e7c8c; --accent-soft:#e0f1f4; --strong:#1a2b36;
    --radius:4px; --shadow:none;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-skin="mission"]:not([data-theme="light"]) {
      --ground:#0e161c; --card:#16222b; --raised:#1b2934;
      --ink:#e3edf3; --ink-soft:#b3c6d2; --muted:#8aa0ae;
      --rule:#27394a; --rule-soft:#1e2c39;
      --accent:#2ba7bb; --accent-soft:#0f3038; --strong:#b3c6d2; --shadow:none;
    }
  }
  :root[data-skin="mission"][data-theme="dark"] {
    --ground:#0e161c; --card:#16222b; --raised:#1b2934;
    --ink:#e3edf3; --ink-soft:#b3c6d2; --muted:#8aa0ae;
    --rule:#27394a; --rule-soft:#1e2c39;
    --accent:#2ba7bb; --accent-soft:#0f3038; --strong:#b3c6d2; --shadow:none;
  }
  :root[data-skin="mission"][data-theme="light"] {
    --ground:#eef1f4; --card:#ffffff; --raised:#f6f8fa;
    --ink:#1a2b36; --ink-soft:#4a6272; --muted:#5b6f7d;
    --rule:#c8d4dc; --rule-soft:#e2e9ee; --accent:#0e7c8c; --accent-soft:#e0f1f4;
    --strong:#1a2b36;
  }

  /* ══ section blocks — page furniture, deliberately OUTSIDE the series and
        status palettes so a section header can never be mistaken for data. */
  :root {
    --sec1:#2b3a55; --sec2:#2f4858; --sec3:#1f5453; --sec4:#2e5339;
    --sec5:#5a4a2b; --sec6:#5c3340; --sec7:#4a3560; --sec8:#33415c;
    --sec9:#6b3f2e;
    --sec-ink:#f7f8fa;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sec1:#9fb4d6; --sec2:#a3bfcd; --sec3:#8fc9c4; --sec4:#a8cfa6;
      --sec5:#d8c48d; --sec6:#d9a3b0; --sec7:#bda8dd; --sec8:#a6b6d9;
      --sec9:#e3ab8f;
      --sec-ink:#111722;
    }
  }
  :root[data-theme="dark"] {
    --sec1:#9fb4d6; --sec2:#a3bfcd; --sec3:#8fc9c4; --sec4:#a8cfa6;
    --sec5:#d8c48d; --sec6:#d9a3b0; --sec7:#bda8dd; --sec8:#a6b6d9;
    --sec9:#e3ab8f;
    --sec-ink:#111722;
  }
  :root[data-theme="light"] {
    --sec1:#2b3a55; --sec2:#2f4858; --sec3:#1f5453; --sec4:#2e5339;
    --sec5:#5a4a2b; --sec6:#5c3340; --sec7:#4a3560; --sec8:#33415c;
    --sec9:#6b3f2e;
    --sec-ink:#f7f8fa;
  }

  /* ── chart series + status — never themed, validated (dataviz skill) ── */
  :root {
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; }
  }
  :root[data-theme="dark"] { --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; }

  /* ══ the page: one centred column, text set left inside it (H1) ════ */
  body {
    background: var(--ground); color: var(--ink);
    font-family: var(--af-stack); font-size: var(--af-size); letter-spacing: var(--af-track);
    line-height: var(--af-lh); text-align: left; -webkit-font-smoothing: antialiased;
  }
  /* ── scrollbars wear the skin ────────────────────────────────────────
     A native scrollbar is the one piece of chrome the page does not own by
     default, and it shows: a grey OS bar with stepper arrows sitting inside a
     dark panel reads as a rendering fault, not as a control. Both engines are
     addressed (Firefox takes the two `scrollbar-*` properties, WebKit/Blink the
     pseudo-elements), the thumb is mixed from the skin's own accent so it moves
     with the theme, and the stepper arrows are removed — a scroll bar is a
     position indicator, not a set of buttons anyone clicks. */
  :root {
    --sb-thumb: color-mix(in srgb, var(--accent) 42%, var(--rule));
    scrollbar-width: thin;
    scrollbar-color: var(--sb-thumb) var(--rule-soft);
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--rule-soft); border-radius: 999px; }
  ::-webkit-scrollbar-thumb {
    background: var(--sb-thumb); border-radius: 999px;
    border: 2px solid transparent; background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); background-clip: padding-box; }
  ::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
  ::-webkit-scrollbar-corner { background: transparent; }

  .artifact-page {
    max-width: 74rem;
    margin: 0 auto;   /* centred: a wide screen keeps equal air both sides */
    padding: 32px 24px 48px;
    display: flex; flex-direction: column; gap: 30px;
    text-align: left;
  }
  .artifact-page > :first-child { padding-right: 56px; }   /* clear of the fixed cog */
  :is(a, button, select, input, textarea, summary):focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px;
  }
  p { margin: 0; }

  /* ══ the two devices (H5) — every skin, every section ══════════════ */
  .sec { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .sec-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); padding-bottom: 8px; }
  .sec-head .n { margin-left: auto; font-size: var(--fs-min); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  /* Title = normal-size text in a PILL that hugs it, led by an icon.
     Prominence is the background and the icon, never the type: no uppercase,
     no tracking, no size bump. The pill's padding stays tight — a wide slab
     reads as a banner and competes with the content it introduces. */
  .sec-head h2 {
    margin: 0; background: var(--sec, var(--strong)); color: var(--sec-ink, var(--ground));
    padding: 2px 11px 2px 9px; border-radius: 999px;
    font-family: var(--af-title);
    font-size: 1em; font-weight: 600; letter-spacing: .045em; text-transform: uppercase;
    line-height: 1.34;
    display: inline-flex; align-items: center; gap: 7px;
  }
  /* Every title carries an icon (H6). Lucide geometry, inlined — the CSP
     blocks icon CDNs, and an icon font would fall back silently. */
  .sec-head h2 svg {
    width: 1.02em; height: 1.02em; flex: 0 0 auto;
    fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .sec[data-sec="1"] { --sec: var(--sec1); } .sec[data-sec="2"] { --sec: var(--sec2); }
  .sec[data-sec="3"] { --sec: var(--sec3); } .sec[data-sec="4"] { --sec: var(--sec4); }
  .sec[data-sec="5"] { --sec: var(--sec5); } .sec[data-sec="6"] { --sec: var(--sec6); }
  .sec[data-sec="7"] { --sec: var(--sec7); } .sec[data-sec="8"] { --sec: var(--sec8); }
  .sec[data-sec="9"] { --sec: var(--sec9); }

  .panel {
    background: var(--card); border: 1px solid var(--rule);
    border-radius: var(--radius, 10px); padding: 15px;
    display: flex; flex-direction: column; gap: 12px; min-width: 0;
  }
  /* No accent rail (operator 2026-10-05): a 5px accent bar down every panel read as AI slop —
     the same mark on every box says nothing about any of them. A panel is a hairline frame; what is inside
     it carries the colour, and only where the colour encodes something. */
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 14px; align-items: start; }

  /* ══ cog + options panel (H2 — the only floating affordance) ═══════ */
  .af-chrome { position: fixed; top: 14px; right: 14px; z-index: 200; }
  .af-cog {
    display: grid; place-items: center; width: 38px; height: 38px;
    background: var(--card); color: var(--muted);
    border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow);
    cursor: pointer; transition: color .15s ease, border-color .15s ease, transform .25s ease;
  }
  .af-cog:hover { color: var(--accent); border-color: var(--accent); }
  .af-cog[aria-expanded="true"] { color: var(--accent); border-color: var(--accent); transform: rotate(45deg); }
  .af-cog svg { width: 18px; height: 18px; display: block; }
  .af-panel {
    position: absolute; top: 46px; right: 0; width: 262px;
    background: var(--card); border: 1px solid var(--rule); border-radius: 12px;
    box-shadow: var(--shadow); padding: 14px;
    display: none; flex-direction: column; gap: 11px; max-height: 82vh; overflow-y: auto;
  }
  .af-panel[data-open="true"] { display: flex; }
  .af-group { display: flex; flex-direction: column; gap: 7px; }
  .af-legend { font-size: .72em; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .af-opt {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    width: 100%; text-align: left; cursor: pointer; font-family: inherit;
    background: var(--raised); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 8px; padding: 8px 11px;
  }
  .af-opt:hover { border-color: var(--accent); }
  .af-opt[aria-checked="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .af-opt .af-name { font-size: 14px; line-height: 1.2; }
  /* size and spacing are short scales — one row of steps, so the panel still fits one screen */
  .af-seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
  .af-seg .af-opt { justify-content: center; align-items: center; padding: 6px 4px; min-height: 34px; }
  .af-seg .af-name { line-height: 1; }
  .af-opt .af-spec { font-size: 12px; color: var(--muted); letter-spacing: 0; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .af-opt[aria-checked="true"] .af-spec { color: var(--accent); }
  .af-foot { font-size: 12px; color: var(--muted); margin: 0; letter-spacing: 0; }
  .af-divider { height: 1px; background: var(--rule-soft); }

  /* motion primitives — global pause is wired to this attribute */
  :root[data-motion="off"] *, :root[data-motion="off"] *::before { animation-play-state: paused !important; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
<style>
  /* ══ the page's own rules — the kit block above is pasted verbatim by gen-legibility-review.mjs ══
     No motion (the kit's Motion group is dropped), no hovers (every word is on the face), the 12px floor: every size below is
     one of the kit's --fs-* steps, which are absolute (computed from the roster's base), so nesting never shrinks them. */
  .artifact-page { margin: 0 auto; max-width: min(96vw, 1800px); box-sizing: border-box; }   /* operator rule: an artifact's column is centred; L-24: and it takes the screen's width, so a table has room for a row on one line */
  :root { --ok: #2f9e44; --warn: #e8890c; --bad: #e03131; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ok: #69db7c; --warn: #f0a23a; --bad: #ff6b6b; } }
  :root[data-theme="dark"] { --ok: #69db7c; --warn: #f0a23a; --bad: #ff6b6b; }
  .eyebrow { font-size: var(--fs-min); letter-spacing: .18em; text-transform: uppercase; color: var(--accent); margin: 0; }
  h1 { font-size: 2em; line-height: 1.15; margin: 8px 0 0; text-wrap: balance; }
  h3 { margin: 0; font-size: 1.05em; text-wrap: balance; }
  h4 { margin: 0; font-size: 1em; }
  .lede { color: var(--ink-soft); max-width: 110ch; margin: 12px 0 0; }
  .cap { font-size: var(--fs-sm); color: var(--ink-soft); margin: 0; max-width: 112ch; }
  .take { font-size: var(--fs-sm); color: var(--ink); margin: 2px 0 0; border-left: 3px solid var(--accent); padding: 4px 0 4px 11px; max-width: 112ch; }
  .sec-head { flex-wrap: wrap; }
  .sec-head .n { flex: 0 1 auto; min-width: 0; font-variant-numeric: tabular-nums; }
  .body { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .lab { font-size: var(--fs-min); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 14px; align-items: start; }

  .key { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; font-size: var(--fs-sm); color: var(--ink-soft); margin-top: 14px; }
  .key span { display: inline-flex; align-items: center; gap: 7px; }
  .key .btn { pointer-events: none; }

  .btn { font: inherit; font-size: var(--fs-sm); letter-spacing: inherit; cursor: pointer; border-radius: 8px; padding: 5px 11px; border: 1px solid var(--rule); background: var(--raised); color: var(--ink); text-align: left; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn[data-mine="true"] { border: 1.5px dashed var(--accent); color: var(--accent); }                       /* dashed = my pick */
  .btn[aria-pressed="true"] { border: 1.5px solid var(--accent); background: var(--accent); color: var(--ground); }   /* filled = yours */
  .btn.pri { background: var(--accent); border-color: var(--accent); color: var(--ground); }
  .btn.nb { background: transparent; color: var(--ink-soft); font-size: var(--fs-xs); padding: 3px 9px; }
  .btn.nb[data-has="true"] { border-color: var(--accent); color: var(--accent); }
  .state { font-size: var(--fs-min); color: var(--muted); letter-spacing: .04em; }
  [data-state="yours"] > .verdict .state, [data-state="yours"] .state.top { color: var(--accent); }
  .verdict { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .note { font: inherit; letter-spacing: inherit; font-size: var(--fs-sm); color: var(--ink); background: var(--raised); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; width: 100%; box-sizing: border-box; resize: vertical; min-height: 2.6em; }
  .note[hidden] { display: none; }

  .chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .chip { font-size: var(--fs-min); color: var(--ink); border: 1px solid var(--rule); border-radius: 10px; padding: 0 9px; line-height: 1.7; background: var(--card); max-width: 100%; box-sizing: border-box; }   /* wraps at a space, never inside a word */
  .chip.acc { border-color: var(--accent); color: var(--accent); }
  .chip[data-o="fixed"], .chip[data-v="answered"], .chip[data-o="closed"] { border-color: var(--ok); color: var(--ok); }
  .chip[data-o="partly"], .chip[data-v="partly"] { border-color: var(--warn); color: var(--warn); }
  .chip[data-o="left"], .chip[data-v="not"], .chip[data-o="open"] { border-color: var(--bad); color: var(--bad); }
  .chip[data-o="his"] { border-color: var(--accent); color: var(--ground); background: var(--accent); }
  .chip.ic, a.chip.ref.ic { display: inline-flex; align-items: center; gap: 5px; }
  .chip.ic .mk { gap: 3px; }

  /* the marks (L-25): an inline-svg icon, its word in the hover and for a reader, colour for the state. The legend says each word once. */
  .ico { width: 1.15em; height: 1.15em; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .mk { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-soft); white-space: nowrap; vertical-align: middle; }
  .mk .ico { width: 1.25em; height: 1.25em; }
  .mk .n { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 650; }
  .mk[data-o="fixed"], .mk[data-o="down"], .mk[data-o="ruled"], .mk[data-o="question"] { color: var(--ok); }
  .mk[data-o="partly"], .mk[data-o="option"] { color: var(--warn); }
  .mk[data-o="left"], .mk[data-o="open"], .mk[data-o="up"] { color: var(--bad); }
  .mk[data-o="his"], .mk[data-o="mine"], .mk[data-o="yours"], .mk[data-o="land"], .mk[data-o="built"], .mk.pm { color: var(--accent); }
  .mk[data-o="logged"], .mk[data-o="deferred"], .mk[data-o="notyet"], .mk[data-o="same"], .mk.zero { color: var(--muted); }
  .mk.zero .n { color: var(--muted); font-weight: 400; }
  .marks { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; font-size: 1.1em; }
  .marks .mk .ico { width: 1.6em; height: 1.6em; }
  .chips.nw { flex-wrap: nowrap; }
  /* a stacked bar: one segment per outcome, widths by count (L-25) */
  .stk { display: inline-flex; width: 7.5rem; height: 12px; border-radius: 4px; overflow: hidden; border: 1px solid var(--rule); background: var(--rule-soft); vertical-align: middle; flex: 0 0 auto; }
  .stk.wide { display: flex; width: 100%; height: 18px; border-radius: 6px; }
  .stk > span { display: block; height: 100%; flex-basis: 0; min-width: 2px; }
  .stk [data-o="fixed"], .stk [data-o="question"] { background: var(--ok); } .stk [data-o="partly"], .stk [data-o="option"] { background: var(--warn); } .stk [data-o="left"] { background: var(--bad); }
  .stk [data-o="his"], .stk [data-o="built"] { background: var(--accent); } .stk [data-o="logged"], .stk [data-o="deferred"] { background: var(--muted); }

  /* tables: inside their own scroller, so the page never scrolls sideways */
  .tw { overflow-x: auto; max-width: 100%; }
  table.t { border-collapse: collapse; font-size: var(--fs-sm); font-variant-numeric: tabular-nums; width: 100%; }
  table.t th, table.t td { text-align: left; padding: 5px 16px 5px 0; vertical-align: top; border-bottom: 1px solid var(--rule-soft); color: var(--ink); font-weight: 400; overflow-wrap: break-word; }
  table.t td.id, table.t th.id, table.t td.sv, table.t th.sv { white-space: nowrap; overflow-wrap: normal; }   /* L-24: a short value never wraps — a status, a count, an id, a kind, a verdict stays on one line */
  table.t td.pr { min-width: 16ch; }
  table.t th { color: var(--muted); font-size: var(--fs-min); letter-spacing: .06em; text-transform: uppercase; }
  table.t td.num, table.t th.num { text-align: right; white-space: nowrap; overflow-wrap: normal; }
  table.t td.lower { color: #2f9e44; font-weight: 650; }
  :root:not([data-theme="light"]) table.t td.lower, :root[data-theme="dark"] table.t td.lower { color: #69db7c; }
  table.t .sub { display: block; font-size: var(--fs-min); color: var(--muted); }
  table.t td.num { font-variant-numeric: tabular-nums; }
  table.t td a.ref { color: var(--accent); text-decoration: none; } table.t td a.ref:hover { text-decoration: underline; }

  /* a call: its looks, each with its picture */
  .call { gap: 10px; }
  .call[data-state="yours"] { border-left-color: var(--strong) !important; }
  /* D-083: a choice deferred to the all-endpoints bench — its card is for reading, under one banner; its buttons are off and its menu entry is dimmed */
  .call[data-state="deferred"], .prop[data-state="deferred"] { border-left-style: dashed !important; }
  .defer { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1.5px dashed var(--ink-soft); border-radius: 8px; background: var(--raised); }
  .defer p { margin: 0; font-size: var(--fs-sm); color: var(--ink); max-width: 112ch; }
  .defer .mk .ico { width: 1.6em; height: 1.6em; }
  .btn:disabled { cursor: not-allowed; opacity: .6; }
  .btn:disabled:hover { border-color: var(--rule); color: var(--ink); }
  .ddi[data-st="deferred"] .nm { color: var(--muted); }
  .call .hd { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
  .looks { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 12px; align-items: start; }
  .look { display: flex; flex-direction: column; gap: 6px; padding: 8px; border: 1px solid var(--rule); border-radius: 8px; background: var(--raised); min-width: 0; }
  .look .plain { font-size: var(--fs-sm); color: var(--ink-soft); margin: 0; }
  /* L-34: two looks whose pictures are tight crops of the region that changes stand always beside each other */
  .looks.side { grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); }
  .looks.side figure.pic a { align-self: stretch; } .looks.side figure.pic img { width: 100%; max-width: none; } .full .looks.side figure.pic img { width: auto; }   /* a tight crop fills its half, so the difference is large enough to see */
  @media (max-width: 640px) { .looks.side { grid-template-columns: minmax(0, 1fr); } }
  /* L-35: what you would see after picking an option — a line, then a picture pair (real clicks) or a mock drawn on the page and labelled as one */
  .depict { display: flex; flex-direction: column; gap: 6px; padding-top: 6px; border-top: 1px dashed var(--rule); }
  .depict .dl { margin: 0; font-size: var(--fs-sm); color: var(--ink); }
  .dfigs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); gap: 8px; align-items: start; }
  .dfig { margin: 0; display: flex; flex-direction: column; gap: 3px; min-width: 0; max-width: 420px; }   /* one picture is never blown up to the width a pair shares */
  .dfig .dimg { display: block; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: #0b1020; max-height: 340px; }
  .dfig img { display: block; width: 100%; height: auto; }
  .dfig figcaption { font-size: var(--fs-min); color: var(--muted); overflow-wrap: anywhere; }
  .dfig .dtag { font-size: var(--fs-min); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); font-weight: 650; }
  .dfig .dmock { align-self: flex-start; font-size: var(--fs-min); border: 1px dashed var(--ink-soft); border-radius: 999px; padding: 0 8px; color: var(--ink-soft); cursor: help; }
  .mock { border: 1.5px dashed var(--ink-soft); border-radius: 8px; padding: 8px; background: var(--card); display: flex; flex-direction: column; gap: 5px; font-size: var(--fs-min); color: var(--ink); min-width: 0; }
  .mock .mg { color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .mock .mh { border: 1px solid var(--rule); border-radius: 5px; padding: 3px 7px; font-weight: 650; background: var(--raised); }
  .mock .mh.changed { border-color: var(--accent); box-shadow: 0 0 0 1.5px var(--accent); }
  .mock .mcs { display: flex; gap: 4px; } .mock .mcs i { flex: 1; height: 8px; border-radius: 4px; background: var(--rule); }
  .mock ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
  .mock li { border: 1px solid var(--rule); border-radius: 5px; padding: 2px 7px; background: var(--raised); }
  .mock li.lit { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--raised)); }
  .mock li.new { border-style: dashed; border-color: var(--ink-soft); font-weight: 650; }
  .mock li .nt { margin-left: 6px; color: var(--muted); }
  .mock .mctl { align-self: flex-start; border: 1.5px solid var(--accent); border-radius: 999px; padding: 1px 10px; font-weight: 650; color: var(--accent); }
  .mock.mframe { padding: 4px; } .mock.mframe img { display: block; width: 100%; height: auto; border-radius: 4px; }
  .look .noshot { font-size: var(--fs-min); color: var(--muted); border: 1px dashed var(--rule); border-radius: 6px; padding: 10px; }
  .sets { font-size: var(--fs-sm); color: var(--ink); margin: 0; }
  .sets b { color: var(--muted); font-weight: 400; font-size: var(--fs-min); letter-spacing: .08em; text-transform: uppercase; margin-right: 6px; }
  .facts { font-size: var(--fs-sm); color: var(--ink-soft); margin: 0; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--raised); list-style: none; display: flex; flex-direction: column; gap: 4px; }
  .facts b { color: var(--ink); font-weight: 650; margin-right: 6px; }

  figure.pic { margin: 0; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  figure.pic a { display: block; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: #0b1020; align-self: flex-start; max-width: 100%; }   /* a picture narrower than its box frames itself, with no dark void beside it */
  figure.pic img { display: block; max-width: 100%; height: auto; }
  figure.pic figcaption { font-size: var(--fs-min); color: var(--muted); overflow-wrap: anywhere; }
  .pics { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 10px; align-items: start; }

  /* an item card */
  .item h3 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
  .item blockquote { margin: 0; padding: 4px 0 4px 12px; border-left: 3px dashed var(--rule); color: var(--ink); font-size: 1em; }
  details { font-size: var(--fs-sm); color: var(--ink-soft); }
  details > summary { cursor: pointer; color: var(--accent); font-size: var(--fs-sm); }
  details[open] > summary { margin-bottom: 6px; }
  dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 18px; margin: 0; font-size: var(--fs-sm); }
  dl.kv dt { color: var(--muted); font-size: var(--fs-min); letter-spacing: .06em; text-transform: uppercase; padding-top: 2px; white-space: nowrap; }
  dl.kv dd { margin: 0; color: var(--ink); overflow-wrap: anywhere; }
  @media (max-width: 720px) { dl.kv { grid-template-columns: minmax(0, 1fr); } }
  ul.fl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; font-size: var(--fs-sm); }
  ul.fl li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: baseline; color: var(--ink); }
  ul.fl li .why { grid-column: 2; color: var(--ink-soft); font-size: var(--fs-min); }
  ul.fl li > span { min-width: 0; overflow-wrap: break-word; }
  @media (max-width: 720px) { ul.fl li { grid-template-columns: minmax(0, 1fr); } ul.fl li .why { grid-column: 1; } }
  ol.ans { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; color: var(--ink); }
  ol.ans li { overflow-wrap: anywhere; }
  .q { font-size: 1.05em; color: var(--ink); margin: 0; }

  /* patterns */
  .why2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 10px; }
  .why2 > div { border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; background: var(--raised); font-size: var(--fs-sm); color: var(--ink); }
  .why2 .lab { margin-bottom: 3px; }
  .suite { display: flex; flex-direction: column; gap: 8px; }
  .prop { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 8px; }
  .prop[data-state="yours"] { border-color: var(--accent); }
  .prop .what { font-size: var(--fs-sm); color: var(--ink); margin: 0; }
  .landnote { font-size: 1em; color: var(--ink); margin: 0; border: 1.5px solid var(--accent); border-radius: 8px; padding: 8px 12px; }

  /* the contents bar (L21, L11, L-27): every section one jump away, and a way back from each. While a voice plays (or always, if you pick it) it
     freezes at the top of the screen and carries the player. It is one box either way: freezing moves nothing, it only holds the bar in place. */
  :root { --bar-h: 0px; }
  nav.toc { display: flex; flex-direction: column; gap: 8px; font-size: var(--fs-sm); position: static; z-index: 100; background: var(--ground); padding: 8px 0; margin: -22px 0 -8px; }
  nav.toc[data-frozen="true"] { position: sticky; top: 0; box-shadow: 0 1px 0 var(--rule), 0 12px 14px -12px rgba(0, 0, 0, .5); }
  nav.toc .row { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; min-width: 0; }
  nav.toc .lab { margin-right: 2px; }
  nav.toc .player { display: none; }
  nav.toc[data-player="true"] .player { display: flex; }
  .pb { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 34px; height: 32px; padding: 0 9px; box-sizing: border-box; font: inherit; font-size: var(--fs-sm); letter-spacing: inherit; color: var(--ink); background: var(--raised); border: 1px solid var(--rule); border-radius: 8px; cursor: pointer; }
  .pb:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .pb:disabled { opacity: .45; cursor: default; }
  .pb .ico { width: 1.2em; height: 1.2em; }
  .pb.go { background: var(--accent); border-color: var(--accent); color: var(--ground); }
  .pb.go:hover:not(:disabled) { color: var(--ground); filter: brightness(1.08); }
  .pb[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .pb[aria-pressed="false"] .ico { opacity: .7; }
  .vox { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-min); color: var(--ink-soft); min-width: 0; }
  .vox .ico { width: 1.3em; height: 1.3em; color: var(--accent); flex: 0 0 auto; }
  .vox .vn { max-width: 18ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tcs { position: relative; }
  nav.toc .tcs { gap: 6px 7px; }
  nav.toc .tcs > * { flex: 0 0 auto; white-space: nowrap; }
  nav.toc a.tc { color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 10px; padding: 0 8px; line-height: 1.8; background: var(--card); white-space: nowrap; }
  nav.toc a.tc:hover { border-color: var(--accent); color: var(--accent); }
  nav.toc a.tc[data-lit="true"] { background: var(--accent); border-color: var(--accent); color: var(--ground); }
  @media (max-width: 720px) { nav.toc[data-frozen="true"] { padding-right: 28px; } nav.toc .tcs { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 3px; } nav.toc .player { gap: 6px; } .vox, .pb .fw { display: none; } .pb { padding: 0 6px; } .bar-rate .sel { padding: 0 3px; } }   /* a phone: clear of the fixed cog, one row of controls, the chips scroll inside their own row */
  nav.toc a.up, a.up, a.ref { color: var(--accent); text-decoration: none; }
  a.up:hover, a.ref:hover { text-decoration: underline; }
  a.up { font-size: var(--fs-min); letter-spacing: .04em; }
  a.chip.ref { display: inline-block; }
  .artifact-page [id] { scroll-margin-top: calc(var(--bar-h, 0px) + 14px); }   /* a jump lands below the frozen bar */
  .artifact-page #toc { scroll-margin-top: 0; }
  .say[data-reading="true"] { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }   /* the summary being read */
  .sub2 { font-size: var(--fs-sm); color: var(--muted); margin: 6px 0 0; letter-spacing: .06em; text-transform: uppercase; }
  .costl { font-size: var(--fs-sm); color: var(--ink); margin: 0; }
  .costl b, .against b, .because b { color: var(--muted); font-weight: 400; font-size: var(--fs-min); letter-spacing: .08em; text-transform: uppercase; margin-right: 6px; }
  .against, .because { font-size: var(--fs-sm); color: var(--ink-soft); margin: 0; }
  .audit { border: 1.5px solid var(--accent); }
  /* pictures at full size, each in its own scroller (L10) */
  .full figure.pic a { overflow-x: auto; overflow-y: hidden; align-self: stretch; }
  .full figure.pic img { max-width: none; width: auto; }
  .full .looks { grid-template-columns: minmax(0, 1fr); }
  .out { font: inherit; letter-spacing: inherit; font-size: var(--fs-sm); line-height: 1.5; color: var(--ink); background: var(--raised); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; width: 100%; box-sizing: border-box; min-height: 18em; resize: vertical; white-space: pre; overflow: auto; }
  .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .said { font-size: var(--fs-sm); color: var(--accent); min-height: 1.4em; }

  /* head rows that carry marks beside a title (L-25) */
  h3.hp, .hrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
  h3.hp .mk.pm .ico { width: 1.5em; height: 1.5em; }
  .btn.ic { display: inline-flex; align-items: center; gap: 7px; }
  .btn.ic .ico { width: 1.1em; height: 1.1em; }
  .btn.ls[data-on="true"] { border-style: solid; background: var(--accent-soft); color: var(--accent); }
  .btn[hidden], .rate[hidden], .ls[hidden] { display: none; }
  .btn.ls { border-width: 1.5px; }

  /* the legend, said once (L-25) */
  .legend { gap: 10px; }
  .lg-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: 12px 28px; align-items: start; }
  .lgg .lab { margin-bottom: 4px; }
  .lgl { display: flex; flex-direction: column; gap: 4px; }
  .lgg.wide { grid-column: 1 / -1; } .lgg.wide .lgl { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 30rem), 1fr)); gap: 4px 24px; }
  .lg { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-sm); color: var(--ink); }
  .legend .key { margin-top: 0; }

  /* the top row: copy every summary, listen to every summary, the speed (L-26) */
  .topacts { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 14px; }
  .rate { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-sm); color: var(--ink-soft); }
  .sel { font: inherit; font-size: var(--fs-sm); color: var(--ink); background: var(--raised); border: 1.5px dashed var(--accent); border-radius: 8px; padding: 4px 8px; }
  .opt { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: var(--fs-sm); color: var(--ink-soft); }
  .opt[hidden] { display: none; }
  .opt .btn.ic .ico { width: 1.1em; height: 1.1em; }
  .bar-rate { display: inline-flex; align-items: center; }
  .bar-rate .sel { height: 32px; box-sizing: border-box; padding: 0 8px; }

  /* the spoken summary that opens every section (L-26) */
  .say { gap: 8px; background: var(--raised); }
  .say-hd { display: flex; align-items: center; gap: 7px; }
  .say-hd .ico { width: 1.2em; height: 1.2em; color: var(--accent); }
  .say-text { margin: 0; max-width: 112ch; font-size: 1em; line-height: 1.55; color: var(--ink); }
  .sec-head .st { white-space: normal; }
  .ovh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }

  /* the nested menu (L-29, D-077): a section chip that holds decisions is the chip plus a caret; the caret opens its decisions, indented
     under their group. The panel is fixed (the chips scroll inside their own row on a phone, which would clip it) and opens as a full-width
     sheet under the bar at 720px and below. No motion, no transition. */
  .dd { display: inline-flex; align-items: stretch; }
  nav.toc .dd > a.tc { display: inline-flex; align-items: center; gap: 6px; border-radius: 10px 0 0 10px; }
  nav.toc .dd > button.car { display: inline-flex; align-items: center; justify-content: center; padding: 0 4px; font: inherit; color: var(--ink-soft); background: var(--card); border: 1px solid var(--rule); border-left: 0; border-radius: 0 10px 10px 0; cursor: pointer; }
  nav.toc .dd > button.car:hover, nav.toc .dd[data-open="true"] > button.car { border-color: var(--accent); color: var(--accent); }
  nav.toc .dd > a.tc[data-lit="true"] + button.car { background: var(--accent); border-color: var(--accent); color: var(--ground); }
  .car .ico { width: 1.1em; height: 1.1em; }
  .dd[data-open="true"] .car .ico { transform: rotate(180deg); }
  .oc { font-size: var(--fs-min); font-variant-numeric: tabular-nums; border: 1px solid currentColor; border-radius: 8px; padding: 0 6px; line-height: 1.5; }
  .oc[data-zero="true"] { opacity: .6; }
  .ddm { position: fixed; z-index: 120; box-sizing: border-box; width: 34rem; max-width: calc(100vw - 16px); overflow-y: auto; overscroll-behavior: contain; background: var(--card); border: 1.5px solid var(--accent); border-radius: 10px; box-shadow: 0 18px 38px -12px rgba(0, 0, 0, .6); padding: 8px 6px 10px; white-space: normal; text-align: left; font-size: var(--fs-sm); font-weight: 400; letter-spacing: normal; color: var(--ink); }
  .ddm[hidden] { display: none; }
  .ddm[data-sheet="true"] { max-width: 100vw; border-radius: 0 0 10px 10px; border-left: 0; border-right: 0; }
  .dd-head { margin: 2px 8px 6px; font-size: var(--fs-min); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .ddg { margin: 8px 0 2px; }
  .ddgh { display: flex; align-items: center; gap: 6px; margin: 0 8px 3px; font-size: var(--fs-min); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
  .ddgh .mk { color: var(--accent); }
  .ddl { display: flex; flex-direction: column; gap: 1px; margin: 0 0 0 14px; padding: 0 0 0 8px; border-left: 1px solid var(--rule); }   /* the decisions stand indented under their group */
  .ddi { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 32px; box-sizing: border-box; padding: 4px 8px; font: inherit; text-align: left; color: var(--ink); background: transparent; border: 0; border-radius: 6px; cursor: pointer; }
  .ddi:hover { background: var(--accent-soft); }
  .ddi:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--accent-soft); }
  .ddi[aria-current="true"] { background: var(--accent); color: var(--ground); }
  .ddi[aria-current="true"] .mk, .ddi[aria-current="true"] .tg, .ddi[aria-current="true"] .did { color: var(--ground); }
  .ddi .slot { display: inline-flex; flex: 0 0 auto; }
  .ddi .did { flex: 0 0 auto; font-size: var(--fs-min); color: var(--muted); font-variant-numeric: tabular-nums; }
  .ddi .nm { min-width: 0; overflow-wrap: anywhere; }
  .ddi .tg { margin-left: auto; padding-left: 8px; font-size: var(--fs-min); color: var(--muted); text-align: right; }
  .mk[data-o="check"] { color: var(--accent); }

  /* a decision's card (L-29): its plain line, its listen button and what is read aloud; the one you are at is lit */
  .decb { display: flex; flex-direction: column; gap: 6px; }
  .decrow { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 12px; }
  .decrow .acts { flex: 0 0 auto; }

(\"Endings\") shows its legend: the kinds and labels it draws, cloned, with what each means and how many are here (your placement, ruled); the legend above the table, one line per row, is the other option (mo.opt.leg).","status":"built (D-067); the legend ruled — on the row's name (D-067)","kind":"built","pattern":"P1","patternName":"The hover describes the kind, not the item","verdicts":[{"lens":0,"verdict":"answered","remains":"The legend sits on the row name as you asked. In its LABELS list, one sample chip stands for a whole class but carries that class's count: '[429] … 10 here' when there are two 429s."},{"lens":1,"verdict":"partly","remains":"The legend is on the row name. A status entry stands for a whole class ('429 … 14 here', where two 429s exist). Labels 'Model', 'Hook (FE)' and 'API endpoint' carry no meaning, and the hollow R is not explained."}],"findings":[{"id":"F13","sev":"misleading","what":"The sample chip stands for a whole class of statuses but carries the class's count, so a reader reads 'ten 429s'.","outcome":"fixed","why":null},{"id":"CR-11","sev":"misleading","what":"A status label stands for its whole class and counts the class. A reader believes there are 14 429s in the Gates row.","outcome":"fixed","why":null},{"id":"CR-35","sev":"costly","what":"Some legend labels have no meaning line. The hollow R on the login check's tables is explained only inside the row's options slot. The status marks on a function chip are not said to be the statuses its own code decides.","outcome":"fixed","why":null}],"shots":[{"f":"301-d066-hover-the-endings-row-name.png","w":520,"h":563,"cap":"pointing at Endings · the legend: legend on the row's name"},{"f":"302-d066-legend-above-the-table.png","w":1872,"h":1578,"cap":"click: legend above the table · the legend: legend above the table"},{"f":"303-d066-legend-back-on-the-row-name.png","w":102,"h":72,"cap":"click: legend on the row's name · the legend: legend on the row's name"}]},{"id":"L-05","round":1,"name" ver the moments (INPUT 1 of 2 · 2 of 2 around GATE, the save under EFFECTS, the moments outside the request in a cell of their own, each stage counting the endings that leave it); the excepts of one try and where it goes on under one bracket, \"one of 4\", proven per path by gen-all-endpoints.py; the stage mark left the heads (all-endpoints.tpl.html `moRuns`/`moForks`).","status":"built (D-068); ruled — stages over moments, saving under EFFECTS (D-084)","kind":"built","pattern":"P5","patternName":"Structure hidden in a mark, or mixed into an axis","verdicts":[{"lens":0,"verdict":"answered","remains":"The stage band and the 'one of 4' bracket are there. 'INPUT 1 of 2' has a bare count pill '2' next to it, so two numbers sit side by side with no unit. The column head 'subscription_tier_for +2' names a function, but its moment is 'the work'."},{"lens":1,"verdict":"partly","remains":"The band is built. The count beside each stage says nothing on its face, and 'INPUT 1 of 2' sits next to a bare '2'. 'one of 4' has no noun. Moments carry different names in the heads, the hovers and the map ('subscription_tier_for +2' vs 'the work'; 'commit' vs 'saving' vs 'way 4: saving'). GET /recipes has three heads named 'checks', and 'INPUT 1 of…' is cut."},{"lens":2,"verdict":"answered","remains":"The stage band counts are true on all three endpoints. The fork 'one of 4' names the right four ways (except SessionNotFoundError :155, AllergenConflictError :159, ConcurrentCookCapError :164, and saving :167)."}],"findings":[{"id":"F30","sev":"minor","what":"Two numbers sit side by side with no units. One moment head names a function instead of the moment.","outcome":"fixed","why":null},{"id":"CR-17","sev":"costly","what":"One moment carries two names. The head says one thing, and the hovers, the map bands and the fork list say another, so a reader cannot find 'the work' or 'saving' among the heads.","outcome":"fixed","why":null},{"id":"CR-18","sev":"costly","what":"Three different moments are all headed 'checks', and the fork's hover names its other way 'way 2: checks', so a reader cannot tell which one.","outcome":"partly","why":"heads told apart by their lines; the feed does not name which call raised GET /recipes' two except ValueError"},{"id":"CR-19","sev":"costly","what":"Some band marks say nothing on their face. The number beside each stage is explained only in its hover. INPUT reads '1 of 2' next to a bare '2', and the bracket says 'one of 4' with no noun. On GET /recipes the band cuts 'INPUT 1 of…'.","outcome":"fixed","why":null},{"id":"CR-20","sev":"costly","what":"One column holds two unrelated times: values the server builds when it starts, and requests a test made earlier. Journey chips 'C250 2 steps before' sit under a moment the band calls 'the server starting'.","outcome":"fixed","why":null}],"shots":[{"f":"304-d066-header-stages-over-moments.png","w":560,"h":242,"cap":"as it opens · the header: stages over moments"},{"f":"305-d066-header-stages-roads-moments.png","w":560,"h":242,"cap":"click: stages, roads, moments · the header: stages, roads, moments"},{"f":"306-d066-header-back-to-the-band.png","w":102,"h":72,"cap":"click: stages over moments · the header: stages over moments"},{"f":"307-d066-saving-under-effects.png","w":480,"h":242,"cap":"as it opens · saving: saving under EFFECTS"},{"f":"308-d066-saving-under-handler.png","w":480,"h":242,"cap":"click: saving under HANDLER · saving: saving under HANDLER"},{"f":"309-d066-saving-back-under-effects.png","w":85,"h":72,"cap":"click: saving under EFFECTS · saving: saving under EFFECTS"}]},{"id":"L-06","round":1,"name":"the endpoint metadata out of the table","words":"\"the final column, the one that says \"no moment\", in that column we might just remove it. I mean, not remove it at all, but put it in a different— in another row, separate from the table at the end. Or at the beginning. With the metadata. And we can put labels on that metadata saying that some data pertains to the proof section, or the data effects, and so on. But there is no need to have this \"no moment\" section there.\"","readAs":null,"first":"the final column, the one that says \"no moment\", in that column we might just remove it.","rest":"I mean, not remove it at all, but put it in a different— in another row, separate from the table at the end. Or at the beginning. With the metadata. And we can put labels on that metadata saying that some data pertains to the proof section, or the data effects, and so on. But there is no need to have this \"no moment\" section there.","where":"BY MOMENT · the last column, \"no moment\"","couldNot":"that a column in a time table holds no time — it reads as one more moment and takes width from the rest.","fix":"The column left the table for the ENDPOINT METADATA inside BY MOMENT: one card per block, its mark and name on top; what sums it up in the pinned row's own cells and head words, what it is as chips.","fixRecord":"BUILT — the column left the table for the ENDPOINT METADATA inside BY MOMENT: one card per block, its mark and name on top; what sums it up in the pinned row's own cells and head words, what it is as chips (all-endpoints.tpl.html `renderMeta`).","status":"built (D-068); ruled — metadata after the table (D-081); one big element with layout controls later (L-39)","kind":"built","pattern":"P5","patternName":"Structure hidden in a mark, or mixed into an axis","verdicts":[{"lens":0,"verdict":"answered","remains":"The 'no moment' column is gone. The metadata cards sit after the table."},{"lens":1,"verdict":"answered","remains":"The column left the table. The metadata hovers repeat one paragraph that talks about the page."}],"findings":[],"shots":[{"f":"310-d066-the-endpoint-metadata-after-the-table.png","w":1872,"h":724,"cap":"as it opens · the metadata: metadata after the table"},{"f":"311-d066-metadata-before-the-table.png","w":1872,"h":865,"cap":"click: metadata before the table · the metadata: metadata before the table"},{"f":"312-d066-metadata-back-after-the-table.png","w":120,"h":72,"cap":"click: metadata after the table · the metadata: metadata after the table"}]},{"id":"L-07","round":1,"name":"Overview and risk out of the table","words":"\"Same thing for \"overview\" and \"risk\". That is also metadata information. So this is metadata for the whole API endpoint, and that will go in a different section in our navigation bar on the Gabe universe.\" — and later: \"overview. We already said that it will be consolidated in a metadata information section for the whole API endpoint or element that we are selecting\"","readAs":null,"first":"Same thing for \"overview\" and \"risk\".","rest":"That is also metadata information. So this is metadata for the whole API endpoint, and that will go in a different section in our navigation bar on the Gabe universe.\" — and later: \"overview. We already said that it will be consolidated in a metadata information section for the whole API endpoint or element that we are selecting","where":"BY MOMENT · the rows Overview and Risk","couldNot":"same as L-06 — rows of timeless facts inside the timeline.","fix":"The Overview and risk row left the table; its facts are the metadata's first card, the proof's two counts one under the other, each saying what it counts (proven 2/14 · named 4/11, rank 3–6 of 80).","fixRecord":"BUILT — the Overview and risk row left the table; its facts are the metadata's first card, the proof's two counts one under the other, each saying what it counts (proven 2/14 · named 4/11, rank 3–6 of 80).","status":"built (D-068)","kind":"built","pattern":"P5","patternName":"Structure hidden in a mark, or mixed into an axis","verdicts":[{"lens":0,"verdict":"answered","remains":"Overview and risk is out of the table. 'conflict · large surface' explains only 'large surface'. The six alarm chips share one identical hover."},{"lens":1,"verdict":"partly","remains":"'rank 3–6 of 80' does not say which end is good. 'conflict · large surface' uses the word the gate roles use for a 409. The 'lacks' head hover carries the definition of 'pieces'."},{"lens":2,"verdict":"partly","remains":"'named 4/11 of its refusals' divides by the produced rows, which include the 500 and leave out the body-parse endings. True figures: 5/12 on POST, 19/20 on GET /recipes, 1/4 on GET /cooking/active. On POST, 'behind 18' is lit on a different set of 24 functions. On GET /recipes, the Proof card calls C859 and C867 set-up-only cases, but both test the endpoint."}],"findings":[{"id":"F31","sev":"minor","what":"Half the label is never explained.","outcome":"fixed","why":null},{"id":"CR-12","sev":"misleading","what":"The hover on 'lacks' gives the definition of 'pieces'.","outcome":"fixed","why":null},{"id":"CR-13","sev":"misleading","what":"The overview flag's word 'conflict' is the same word the gate roles use for a 409. A reader takes it for an HTTP conflict.","outcome":"fixed","why":null},{"id":"CR-23","sev":"costly","what":"The rank has no direction and no scale: a reader cannot tell whether 3–6 is good or bad, or why it is a range.","outcome":"fixed","why":null},{"id":"N3-04","sev":"misleading","what":"The denominator is not the endpoint's refusals.","outcome":"fixed","why":null},{"id":"N3-05","sev":"misleading","what":"The count and the set it lights are different sets of functions.","outcome":"fixed","why":null}],"shots":[{"f":"310-d066-the-endpoint-metadata-after-the-table.png","w":1872,"h":724,"cap":"as it opens · the metadata: metadata after the table"},{"f":"311-d066-metadata-before-the-table.png","w":1872,"h":865,"cap":"click: metadata before the table · the metadata: metadata before the table"},{"f":"312-d066-metadata-back-after-the-table.png","w":120,"h":72,"cap":"click: metadata after the table · the metadata: metadata after the table"}]},{"id":"L-08","round":1,"name":"what a test does and touches","words":"\"proof is a different monster because it encodes a lot of information. A lot. Information. So ideally we should find— we will iterate in a way to show better how we represent the tests, like. Say I would like to see, okay, like the data structures, the functions, the models, use, or different components using that that are around our API endpoint used in that. The gates and decisions also, that's very important. In-flight states. That might be affected by the test. So we will do a similar work done we did in the. In the. Endpoint lab, where we figured out a way to represent the tables. In blocks. But this will be for tests. Because right now it's very difficult to grasp what is happening on each test and journey, and how it relates to our API endpoint. If we hover on top of it, we have some information there, but it's not enough. I mean, it's enough in the sense of having the context, but it doesn't— Communicate well the meaning of what is happening inside the tests and what is being affected and what is being tested.\"","readAs":null,"first":"proof is a different monster because it encodes a lot of information.","rest":"A lot. Information. So ideally we should find— we will iterate in a way to show better how we represent the tests, like. Say I would like to see, okay, like the data structures, the functions, the models, use, or different components using that that are around our API endpoint used in that. The gates and decisions also, that's very important. In-flight states. That might be affected by the test. So we will do a similar work done we did in the. In the. Endpoint lab, where we figured out a way to represent the tables. In blocks. But this will be for tests. Because right now it's very difficult to grasp what is happening on each test and journey, and how it relates to our API endpoint. If we hover on top of it, we have some information there, but it's not enough. I mean, it's enough in the sense of having the context, but it doesn't— Communicate well the meaning of what is happening inside the tests and what is being affected and what is being tested.","where":"BY MOMENT · Proof · the proof chips (`C221 proves 404` …), the journey chips (`C250 4 steps after` …), the arranging tests","couldNot":"what a test does, what it touches (structures, functions, models, gates, in-flight state) and what it proves.","fix":"The TEST column of the examples bench — a strip of its requests, and a click that opens the ordered chain (request → checks passed → branch → functions → tables, saved or not → ending) with what the test does not tell.","fixRecord":"built: the TEST column of the examples bench (`sec-ex`) — a strip of its requests, and a click that opens the ordered chain (request → checks passed → branch → functions → tables, saved or not → ending) with what the test does not tell.","status":"built (D-071); its look is decided on the all-endpoints bench (D-083)","kind":"built","pattern":"P4","patternName":"One end of a relation","verdicts":[{"lens":0,"verdict":"partly","remains":"The bench TEST column is built, but it is an option. On the page, 7 of the 8 'proves 404' chips are tests of other functions (cancel_session, set timer, step progress). C237 is said to send 'no headers' when it sends auth_headers. Its bench chain offers a body-parse 400 although the test's JSON body is written out in the test, and says 'the body it sends' is not known. The 'arranges' chips give no test name."},{"lens":1,"verdict":"partly","remains":"The bench chain exists, but it lists the checks passed by their error endings with a ✓. Eight service-side tests of other functions read 'Cxxx proves 404' and count toward 'proven'. C237 says 'sends no headers' although it passes auth_headers. The bench shows raw assert code."},{"lens":2,"verdict":"partly","remains":"7 of the 8 service-side 404 proofs test other functions. 'sends no headers' is shown where the feed simply did not read the headers (C237, C283). 'beyond' ignores body assertions. The C267/C250 'checks it passes' lists leave out the checks inside calls. The bench says C250 and C237 'prove' endings that the metadata says they do not prove. On GET /recipes, C574/C316/C811/C813/C823 each show as proving all 16 400s, though each request's query names one."}],"findings":[{"id":"F01","sev":"misleading","what":"A reader believes 8 tests prove this endpoint's 404 'Recipe not found'. 7 of them test other service functions and never touch this endpoint's code.","outcome":"fixed","why":null},{"id":"F02","sev":"misleading","what":"The reader is told the test sends no headers, so it cannot tell how the test gets past the login check.","outcome":"fixed","why":null},{"id":"F03","sev":"misleading","what":"The face says 'proves' on a chip that only fits. The ending it sits on is a JSON parse error that this test cannot produce. The bench says the body is unknown although it is written out in the test.","outcome":"fixed","why":null},{"id":"F12","sev":"costly","what":"The chips show no test name and not what the test sets up, so a reader cannot tell one arranging test from another.","outcome":"fixed","why":null},{"id":"CR-01","sev":"misleading","what":"Eight tests that never call this endpoint or start_session are drawn as 'Cxxx proves 404' on POST /cooking/sessions, and the 404 then counts as proven. A reader believes eight tests prove this endpoint's 404 'Recipe not found'.","outcome":"fixed","why":null},{"id":"CR-02","sev":"misleading","what":"The hover states the test sends no headers, but it does: its auth headers come from a fixture. A reader then expects C237 to hit the 401, not the 400 or 409 it asserts.","outcome":"fixed","why":null},{"id":"CR-03","sev":"misleading","what":"The face says 'proves' on chips that prove 'one of them, not which'. The same chip's hover says it is 'counted in: tests · proven', while the metadata defines proven as 'a test whose status fits several endings proves none of them'. On GET /recipes C823 appears 28 times in one cell with the same face.","outcome":"fixed","why":null},{"id":"CR-08","sev":"misleading","what":"The checks a test passes are listed by the error each one could have caused, each with a ✓. '✓ 401 invalid token' and '✓ 422 JSON decode error' read as 'got 401', 'got 422'. The two rate limits read the same line twice.","outcome":"fixed","why":null},{"id":"CR-43","sev":"minor","what":"'steps' means two things on one page.","outcome":"fixed","why":null},{"id":"N3-01","sev":"misleading","what":"Seven tests of other functions are shown as proving this endpoint's 404 'Recipe not found'.","outcome":"fixed","why":null},{"id":"N3-02","sev":"misleading","what":"The hovers say the test sends no headers, but it sends Authorization.","outcome":"fixed","why":null},{"id":"N3-13","sev":"misleading","what":"The counts leave out the checks that sit inside calls.","outcome":"partly","why":"checks inside calls now counted under their call; concurrent_cook_cap_for_tier order and the allergen raise remain (feed)"},{"id":"N3-14","sev":"misleading","what":"The bench's verdict contradicts BY MOMENT and the metadata.","outcome":"fixed","why":null},{"id":"N3-15","sev":"misleading","what":"Two cases that test the endpoint are described as set-up only.","outcome":"fixed","why":null},{"id":"N3-17","sev":"misleading","what":"Each request names the one 400 it can reach, but the page draws it as proving all 16.","outcome":"fixed","why":null},{"id":"S4-23","sev":"minor","what":"Step markers '1' and '2' are typed in code, the other steps use symbols, and the step number sits in front of a count ('2 checks it passes · 3'). The list above also numbers requests 1..n, so '1' means two different things.","outcome":"fixed","why":null},{"id":"S4-32","sev":"minor","what":"A test wears the page's test glyph on the bench and no glyph at all in BY MOMENT's Proof row, and the Proof legend does not say the station draws no node for a test (D-052's 'says so').","outcome":"fixed","why":null}],"shots":[{"f":"389-d066-bench-column-test.png","w":471,"h":978,"cap":"column: test"},{"f":"393-d066-test-column-on-c267.png","w":471,"h":978,"cap":"shows the test C267"},{"f":"394-d066-test-c267-open-its-chain.png","w":471,"h":1372,"cap":"click: the block of the test C267"},{"f":"395-d066-test-c267-the-chain-wheeled-to-its-end.png","w":449,"h":518,"cap":"wheeled inside the open block, to its end"},{"f":"396-d066-test-column-on-c250.png","w":471,"h":1349,"cap":"shows the test C250"}]},{"id":"L-09","round":1,"name":"what a gate is, and its function","words":"\"For this one we have many columns with items that have no icon. And I would like to know why. For example, at the edge we have the sensitive and global. Sensitive says sensitive gates and decisions, rate limit, that by. Line 117, 20 per 60 seconds, keyed something the checks that stop a request and the force that decide sending. What is this? It's a function. What it is. So if we have different gates and decisions, we should show the function method. Of the place where they are being called, the item. There should be associated to an item, ideally an affection with a function role. It's okay if the functions gets repeated throughout the different gates and decisions. That's expected.\"","readAs":"\"the forks that decide something\" · \"ideally a function, with a function role\"","first":"For this one we have many columns with items that have no icon.","rest":"And I would like to know why. For example, at the edge we have the sensitive and global. Sensitive says sensitive gates and decisions, rate limit, that by. Line 117, 20 per 60 seconds, keyed something the checks that stop a request and the force that decide sending. What is this? It's a function. What it is. So if we have different gates and decisions, we should show the function method. Of the place where they are being called, the item. There should be associated to an item, ideally an affection with a function role. It's okay if the functions gets repeated throughout the different gates and decisions. That's expected.","where":"BY MOMENT · Gates and decisions · at the edge · `sensitive` and `global` — and the other G&D cells","couldNot":"what kind of thing a gate chip is (it wears no glyph) and which function it lives in.","fix":"Every gate and switch names the function (or middleware) it runs in, a station element with its glyph and role; a gate wears the page's own icon per kind (my pick, dashed).","fixRecord":"BUILT — every gate and switch names the function (or middleware) it runs in, a station element with its glyph and role (`_ae_els.gates` · all-endpoints.tpl.html `gdHost`/`moCell`); a gate wears the page's own icon per kind (my pick, dashed).","status":"built (D-069); the gate icons ruled — an icon per kind (D-081)","kind":"built","pattern":"P3","patternName":"An element drawn without its identity","verdicts":[{"lens":0,"verdict":"answered","remains":"Gates name their host (glyph + role) and wear icons: sensitive/global now read 'rate limiter · runs in RateLimitMiddleware'. The legend lists a gate's kind name in KINDS with no icon, and its icon in LABELS under a second, different definition."},{"lens":1,"verdict":"partly","remains":"Every gate names its function, but the function heads' hovers say only 'build_auth_context · function' and 'RateLimitMiddleware · middleware'."},{"lens":2,"verdict":"partly","remains":"The hosts are right except the TokenVerifier switch: 'runs in build_auth_context · at context.py:97', but line 97 is in get_auth_context (the verify call is at :77)."}],"findings":[{"id":"F14","sev":"costly","what":"A reader cannot match a gate's icon to its kind: kind names and kind icons are in two sections with two different definitions.","outcome":"fixed","why":null},{"id":"N3-10","sev":"misleading","what":"The chip and its hover disagree, and the host and line do not match.","outcome":"fixed","why":null}],"shots":[{"f":"332-d066-the-gates-row.png","w":1864,"h":441,"cap":"as it opens · the gates: function, gates under it"},{"f":"333-d066-open-the-gates-row-options.png","w":120,"h":521,"cap":"click: Gates and decisions: this row's options"},{"f ,"patternName":"One end of a relation","verdicts":[{"lens":0,"verdict":"partly","remains":"function → condition → effect is drawn. Four things still read wrong or vague. (1) Raises one call down say 'the answer it becomes is not known' although the handler's except in the same row answers them. (2) The InvalidTokenError catch claims it 'commits, at context.py:79'; that commit never runs on that path. (3) The rate-limit switch just says 'decides the 429'. (4) TokenVerifier's face says 'can end at 401' but its hover says 'decides the 401'."},{"lens":1,"verdict":"partly","remains":"The chain function → condition → effect is built. Conditions are raw code, and the hovers use code negations ('only when not (existing is not None)'). Answers show source text (str(exc) and 16 f-strings on GET /recipes). Raises say 'the answer it becomes is not known' next to the catch that answers them."},{"lens":2,"verdict":"partly","remains":"'HTTPBearer → 401 ×2' credits the invalid-token 401 to HTTPBearer. The except InvalidTokenError hover says 'commits, at context.py:79', but no path through that catch commits. The TokenVerifier hover says 'decides the 401' while its chip says 'can end at'. The guards 'taste → 400' and 'taste_max → 400' name the enclosing if, not the real condition (the value is not an integer)."}],"findings":[{"id":"F04","sev":"misleading","what":"Raises are labelled 'the answer it becomes is not known' or 'the ending it becomes is not recorded', while the handler's except that answers them is drawn in the same row. The guard's face even says → 404.","outcome":"fixed","why":null},{"id":"F07","sev":"misleading","what":"The reader is told a rejected token commits something to the database.","outcome":"fixed","why":null},{"id":"F22","sev":"costly","what":"The switches do not say what each setting does to the request.","outcome":"fixed","why":null},{"id":"CR-09","sev":"misleading","what":"A raise is labelled 'the answer it becomes is not known' while the catch for that s  gate look is decided on the all-endpoints bench (D-083)","kind":"built","pattern":"P3","patternName":"An element drawn without its identity","verdicts":[{"lens":0,"verdict":"answered","remains":"Where-it-decides labels (app-wide · at login · inside a call · in the handler) are built as an option, and the bench's nine-role filter is built. Yours to pick."},{"lens":1,"verdict":"answered","remains":"The role labels ('inside a call', 'in the handler', 'app-wide', 'at login') are drawn. They are explained only in the legend and the row options."},{"lens":2,"verdict":"partly","remains":"On the bench's GATE OR DECISION column, 'except InvalidTokenError' is counted twice (login check and catch). So 'all 21' should be 20, 'all 38' should be 37, and 'all 6' should be 5 on the simple GET."}],"findings":[{"id":"N3-07","sev":"misleading","what":"One try/except is counted as two gates.","outcome":"fixed","why":null},{"id":"S4-01","sev":"misleading","what":"Every catch is labelled 'catch that translates', including catches that swallow the error or let it pass. A reader believes the error becomes an ending when it does not.","outcome":"fixed","why":null},{"id":"S4-02","sev":"misleading","what":"The part's definition says it shows the level the gate decides at, but it shows the gate's kind. BY MOMENT uses 'role' for the level (app-wide · at login · in the handler · inside a call), so one word names two different axes.","outcome":"fixed","why":null},{"id":"S4-19","sev":"costly","what":"The endpoint's own check has five names and a deciding fork has four, so a reader cannot tell they are the same thing across surfaces.","outcome":"fixed","why":null}],"shots":[{"f":"332-d066-the-gates-row.png","w":1864,"h":441,"cap":"as it opens · the gates: function, gates under it"},{"f":"333-d066-open-the-gates-row-options.png","w":120,"h":521,"cap":"click: Gates and decisions: this row's options"},{"f":"342-d066-gate-roles-r1-what-it-does.png","w":1864,"h":846,"cap":"click: what it does · gate roles: what it does"},{"f":"343-d066-gate-roles-r3-what-it-guards.png","w":1864,"h":846,"cap":"click: what it guards · gate roles: what it guards"},{"f":"344-d066-gate-roles-off.png","w":1864,"h":846,"cap":"click: no label · gate roles: no label"},{"f":"345-d066-grl-back-to-where.png","w":110,"h":104,"cap":"click: where it decides · gate roles: where it decides"},{"f":"350-d066-close-the-gates-row-options.png","w":120,"h":84,"cap":"click: Gates and decisions: this row's options"},{"f":"390-d066-bench-column-gate.png","w":471,"h":1016,"cap":"column: gate or decision"},{"f":"401-d066-gate-column-role-field-rule.png","w":471,"h":1016,"cap":"click: field rule 4"},{"f":"402-d066-gate-column-every-role-again.png","w":449,"h":147,"cap":"click: all 21"}]},{"id":"L-12","round":1,"name":"which function touches which table","words":"\"Data effects the same thing for gates and decisions. We are doing things on tables basically. That's what we want to highlight here. And also we are mentioning some functions. So what would be a nice representation here would be put functions on the— in a block. In different blocks the functions on the left. And in the right the tables. And have sort of a mind map that gives you the relationship between the functions and the tables. Where the connectors will describe the kind of operation. Like right might be red, red might be green, and red and right might be orange or something like that. I think that somehow we have already encoded that kind of information. … In data effects we want to say, okay, we are affecting these tables, but how? With what function? Okay.\"","readAs":"\"write might be red, read might be green, read and write orange\"","first":"Data effects the same thing for gates and decisions.","rest":"We are doing things on tables basically. That's what we want to highlight here. And also we are mentioning some functions. So what would be a nice representation here would be put functions on the— in a block. In different blocks the functions on the left. And in the right the tables. And have sort of a mind map that gives you the relationship between the functions and the tables. Where the connectors will describe the kind of operation. Like right might be red, red might be green, and red and right might be orange or something like that. I think that somehow we have already encoded that kind of information. … In data effects we want to say, okay, we are affecting these tables, but how? With what function? Okay.","where":"BY MOMENT · Data effects","couldNot":"which function does which operation on which table — the row lists tables with R/W beside a few functions, never the link between them.","fix":"Data effects' options slot: one map for the endpoint under the row (my pick): functions left, tables right, the moments as bands, green reads, orange writes, a tick a flush, a rule a commit naming who commits, the race on its link · a small map per cell · chips.","fixRecord":"BUILT — Data effects' options slot: one map for the endpoint under the row (my pick): functions left, tables right, the moments as bands, green reads, orange writes, a tick a flush, a rule a commit naming who commits, the race on its link · a small map per cell · chips.","status":"built — ruled: a small map per moment (D-081); the R/W colour built (D-069)","kind":"built","pattern":"P4","patternName":"One end of a relation","verdicts":[{"lens":0,"verdict":"answered","remains":"The function→table map is built (option; my pick is the default): green reads, orange writes, commit rules, the race on its link. Table chips still say 'only when a condition there holds' and never name the condition."},{"lens":1,"verdict":"partly","remains":"The map is built, but the chips stay in the cells, so every read and write is drawn twice with no note. The map's 'saving' band holds only its label. On GET /recipes a Python set.add is drawn as a save step and counted 'left unsaved 7' on a GET whose head says 'writes 0'."},{"lens":2,"verdict":"partly","remains":"The links, ticks and commit rules are true. But only the idempotency race is drawn. The users race at ownership.py:50 is missing, even though the feed records it and the bench's users table names it. On GET /recipes, a Python set.add is drawn as a save step, and that inflates the data-fns count (should be 13) and the fate count ('left unsaved 7' should be 0)."}],"findings":[{"id":"F21","sev":"costly","what":"'only when a condition there holds' never names the condition. For the allergen tables the condition is not even 'there'.","outcome":"left","why":"the feed records only that a step is conditional, not the condition's text; naming it would be a guess"},{"id":"CR-04","sev":"misleading","what":"A Python set's .add() is drawn as a database save step on a GET endpoint and counted as a write left unsaved. The row head and pinned row say 'writes 0' while the card says 'left unsaved 7', so the page contradicts itself.","outcome":"fixed","why":null},{"id":"CR-31","sev":"costly","what":"Every read and write is drawn twice, as chips in the cells and as lines in the map, and nothing says they are the same facts. The map's 'saving' band holds only its label, with the commit rule below it.","outcome":"fixed","why":null},{"id":"N3-06","sev":"misleading","what":"A Python set add is drawn as a database write.","outcome":"fixed","why":null},{"id":"N3-18","sev":"misleading","what":"A second uncaught race on every login path is not drawn.","outcome":"fixed","why":null},{"id":"S4-21","sev":"costly","what":"The same race is described three incompatible ways: as a retry, as a second request, and as 'first requests sent at once'. The bench line types its status and was bent to get past the number-word sweep.","outcome":"fixed","why":null},{"id":"S4-29","sev":"costly","what":"You asked for writes in red. The agent drew them orange, and no option offers your red, so a choice made alone against your words is not switchable (D-025.2).","outcome":"fixed","why":null}],"shots":[{"f":" ilt: the FUNCTION column of the examples bench on the lab's function look — a strip of the tables it touches; a click lists its raises (and what each becomes here), tables, calls and what it does. Its use in BY MOMENT waits on EX-5.","status":"built (D-071); its look is decided on the all-endpoints bench (D-083)","kind":"built","pattern":"P3","patternName":"An element drawn without its identity","verdicts":[{"lens":0,"verdict":"partly","remains":"Function blocks exist only on the bench (option). The block's 'WHAT IT DOES' is category words ('decides an ending · reads or writes data'). The four functions of L-14 plus load_resolution_snapshot are not in the bench's function list (25 there, 28 in the row). In BY MOMENT, 8 function hovers have no checks or gives line at all."},{"lens":1,"verdict":"partly","remains":"The bench function block says 'faces the web · decides an ending · reads or writes data' (generic). BY MOMENT's function hovers use feed verbs ('read: households · memberships', 'add: users')."},{"lens":2,"verdict":"partly","remains":"The bench says start_session 'ends a database transaction', but it only flushes; the commit belongs to post_start_session, and the bench does not say so. The bench's 'all 25' functions leaves out load_resolution_snapshot, get_idempotency_key, violations_for and derive_restrictions, which BY MOMENT draws. load_resolution_snapshot's hover says it is 'called at cooking.py:150'."}],"findings":[{"id":"F20","sev":"costly","what":"A reader cannot tell what these functions do; the hover has only who calls it and how deep.","outcome":"fixed","why":null},{"id":"CR-29","sev":"costly","what":"The function's 'what it does' is generic words that fit any handler, and the face mark 'CALL' is unexplained.","outcome":"fixed","why":null},{"id":"N3-19","sev":"misleading","what":"The bench credits the commit to the wrong function.","outcome":"fixed","why":null},{"id":"N3-24","sev":"minor","what":"The call site is wrong, and the bench's list is inco

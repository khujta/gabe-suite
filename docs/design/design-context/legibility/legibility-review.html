 the place on the page.","fix":"While a voice plays, the contents bar freezes at the top of the screen and carries the player: play and pause, stop, the previous and next section, the sections with the one being read lit, and the speed. A skip (previous, next, or a section) moves the reading to that section's summary and scrolls the page there, and the summary being read is highlighted; stop ends the reading and the bar lets go. My proposals, drawn dashed: \"follow the reading\" (when the reading moves on by itself the page follows it; on unless you turn it off) and \"the bar stays at the top\" (only while a voice plays is your reading and the default; always is the alternative). Both are kept in this browser and ride the copy text. The page reads the voice you saved in the voice lab (voice, speed, pitch, volume, the pauses, whether section names are read) and falls back to the browser's voice, saying so in the bar's hover, where the saved voice is a Piper one.","fixRecord":"built: while a voice plays, the contents bar freezes at the top of the screen and carries the player: play and pause, stop, the previous and next section, the sections with the one being read lit, and the speed. A skip (previous, next, or a section) moves the reading to that section's summary and scrolls the page there, and the summary being read is highlighted; stop ends the reading and the bar lets go. My proposals, drawn dashed: \"follow the reading\" (when the reading moves on by itself the page follows it; on unless you turn it off) and \"the bar stays at the top\" (only while a voice plays is your reading and the default; always is the alternative). Both are kept in this browser and ride the copy text. The page reads the voice you saved in the voice lab (voice, speed, pitch, volume, the pauses, whether section names are read) and falls back to the browser's voice, saying so in the bar's hover, where the saved voice is a Piper one.","status":"built (D-074)","kind":"built","pattern":null,"patternName":null,"verdicts":[],"findings":[],"shots":[]}],"itemNames":{"L-01":"a definition repeated on every hover","L-02":"one chip, a third of it in each hover","L-03":"the 429 endings that read alike","L-04":"where a row's legend stands","L-05":"stages over the moments","L-06":"the endpoint metadata out of the table","L-07":"Overview and risk out of the table","L-08":"what a test does and touches","L-09":"what a gate is, and its function","L-10":"a gate's function, condition and effect","L-11":"roles for gates","L-12":"which function touches which table","L-13":"functions in more detail, in blocks","L-14":"functions with no icon or role","L-15":"what the fetcher fetches","L-16":"why the 403 and the 404 trigger","L-17":"what in-flight state affects","L-18":"what Standard or specialist represents","L-19":"a gap analysis against the lab's parts","L-20":"the pinned row's columns in BY MOMENT","L-21":"room for a column's contents","L-22":"a hover that says what this item is","L-23":"a bench to decide one element's look","L-24":"wider tables with each row on one line","L-25":"icons in place of words","L-26":"a summary to copy for reading aloud","L-27":"a player bar that stays in view"},"questions":[{"key":"icon","q":"Why do these items have no icon?","short":"“why no icon?”","subject":"page","items":["L-09","L-14"],"about":null,"lines":["Before this round, an item wore an icon only when the Gabe Universe draws a node of its kind. It draws functions, tables, schemas, hooks and middleware. It draws no rate limit, check, fork or catch, so those were bare words.","Now each gate names the function or the middleware it runs in, with that element's icon and role. The gate itself wears an icon of this page's own, one per kind; which icons is one of your calls (gate icons).","A function always wears the function icon now, even when no role is known for it.","Items without an icon in BY MOMENT on POST /cooking/sessions: 63 before this round, 32 after round 1b. In the Gates row: 13, then 0. In Functions: 6, then 0.","What the measure still finds without one: Data effects 17 · Client 3 · In-flight state 12."],"verdict":{"lens":0,"verdict":"partly","remains":"Gates: answered; they wear icons, and the legend says the station draws no node for them. Functions without a role (violations_for, derive_restrictions, get_idempotency_key): the page never says why."},"findings":[],"shots":[{"f":"350-d066-hover-ratelimitmiddleware.png","w":520,"h":268,"cap":"pointing at RateLimitMiddleware"},{"f":"365-d066-hover-resolutionsnapshot-violations-for.png","w":520,"h":201,"cap":"pointing at ResolutionSnapshot.violations_for"}]},{"key":"fn","q":"What is this? A function?","short":"“a function?”","subject":"code","items":["L-09"],"about":"sensitive and global, at the edge","lines":["No. They are 2 counters, the sensitive counter and the global counter: objects of the class SlidingWindowLimiter (in the code: _sensitive and _global). The server builds them once, when it starts (middleware/rate_limit.py: line 103 for the sensitive counter, line 100 for the global counter).","They belong to RateLimitMiddleware, a middleware: code every request passes through before any endpoint runs. Its method RateLimitMiddleware.dispatch asks each counter if this client's IP is over its limit.","The sensitive counter: the 7 path prefixes on its sensitive list, this one among them (23 endpoints). At most 20 requests in 60 seconds. Checked at line 117, first.","The global counter: every path but /healthz (79 endpoints). At most 120 requests in 60 seconds. Checked at line 121, after the sensitive counter.","Over a limit, the answer is 429 “Rate limit exceeded. Try again shortly.” and the endpoint never runs. Both counters run only when rate limiting is switched on, or in production (settings.rate_limit_enabled or settings.is_production)."],"verdict":{"lens":0,"verdict":"answered","remains":"'sensitive · rate limiter — runs in RateLimitMiddleware' under the RateLimitMiddleware head. Every gate names its host."},"findings":[],"shots":[{"f":"350-d066-hover-ratelimitmiddleware.png","w":520,"h":268,"cap":"pointing at RateLimitMiddleware"},{"f":"351-d066-hover-the-sensitive-limit.png","w":520,"h":493,"cap":"pointing at rate limit sensitive 20/60s → 429 app-wide"}]},{"key":"fetch","q":"What is fetching, and from where?","short":"“what is fetching?”","subject":"code","items":["L-15"],"about":"the client hook after the answer","lines":["The hook that sends this request is useStartCooking, a mutation. It sends POST /api/v1/cooking/sessions.","When the answer is a success (onSuccess), it refreshes the saved answers under the key [\"cooking\"] (cooking/useCookingSessions.ts:99). A refresh throws those answers away, so a screen that shows them fetches them again.","2 hooks keep a saved answer under that key, so this is what is fetched: useActiveCooking sends GET /api/v1/cooking/active · useRemindersDue sends GET /api/v1/cooking/reminders/due.","This request writes cooking_sessions · cooking_stage_reminders. useActiveCooking reads cooking_photos · cooking_sessions · cooking_step_progress · recipes; of those, this request writes cooking_sessions. useRemindersDue reads cooking_stage_reminders; of those, this request writes cooking_stage_reminders."],"verdict":{"lens":0,"verdict":"answered","remains":"The refresh chip names useActiveCooking → GET /cooking/active and useRemindersDue → GET /cooking/reminders/due, each reply and its tables. The sending hook is still labelled 'fetcher'."},"findings":[],"shots":[{"f":"366-d066-hover-the-refresh-chip.png","w":518,"h":514,"cap":"pointing at useStartCooking fetcher on success · refresh [\"cooking\"]"}]},{"key":"why","q":"Why do the 403 and the 404 trigger? In which context?","short":"“why do they trigger?”","subject":"code","items":["L-16"],"about":"Client · after the answer","lines":["Each ending has a cause in the server and a branch on the screen.","403 “Recipe contains your allergen restrictions”: the handler's except AllergenConflictError at api/cooking.py:159 answers it.","assert_recipe_allergen_safe raises it at services/recipes.py:234, 2 calls below the handler, when the recipe holds one of the user's allergens (in the code: derived & set(user_allergens)).","On the screen, describeStartCookingError reads 403 at cooking/cookingSessionModel.ts:381 and returns the text key “cooking.error.start_allergen”. The error reaches it from cooking/useCookingLoopActions.ts (lines 303, 386), in RecipeBrowseContainer.","404 “Recipe not found”: the handler's except SessionNotFoundError at api/cooking.py:155 answers it. SessionNotFoundError is raised in 2 places, so this ending has 2 causes.","start_session raises it at services/cooking.py:129, one call below the handler, when a session with this repeat key already exists and belongs to another member (in the code: existing is not None and existing.user_id != user_id).","start_session raises it at services/cooking.py:140, one call below the handler, when no active recipe has that id (in the code: recipe is None).","On the screen, describeStartCookingError reads 404 at cooking/cookingSessionModel.ts:384 and returns the text key “cooking.error.start_not_found”. The error reaches it from cooking/useCookingLoopActions.ts (lines 303, 386), in RecipeBrowseContainer."],"verdict":{"lens":0,"verdict":"partly","remains":"Client side: the hover gives the server ending that reaches each branch. Server side: the 403's raiser and its condition (assert_recipe_allergen_safe, `derived & set(user_allergens)`, only when the user has allergens) appear nowhere, and its raise is labelled 'answer not known'. The 404's second cause (replaying another member's key, services/cooking.py:129) shows as 'ending not recorded'."},"findings":[{"id":"F05","what":"Your question 'why does the 403 trigger?' has no answer anywhere: no raiser, no condition, and not the fact that it runs only when the user has allergens.","outcome":"partly","why":"the 403 names its raiser and the if it sits in; \"checked only when the user has allergens\" is not in the feed; no new gate chip"},{"id":"F06","what":"The 404 has two causes; the page tells a reader only one.","outcome":"fixed","why":null}],"shots":[{"f":"367-d066-hover-the-reads-403-line.png","w":498,"h":282,"cap":"pointing at reads 403 → “cooking.error.start_allergen”"}]},{"key":"std","q":"What are we representing in standard or specialist?","short":"“standard or specialist?”","subject":"page","items":["L-18"],"about":null,"lines":["The row answers one question: is this endpoint built like the others, and what is unusual about it?","An endpoint is made of pieces: its method, each status it can answer, reading a body, its login, its rate limit, its catches, its switches, a repeat key. Each piece is counted across the app's 80 endpoints. The rule: the norm = at least 9 endpoints in 10 carry it · rare = at most 1 in 10 · only here = this endpoint alone · common = everything between; a count, never a grade.","POST /cooking/sessions has 21 pieces: 10 the norm, 8 common, 3 rare, 0 only here. It lacks 0 of the norms.","Its rare pieces are what is unusual: claims its key with get-or-create (3 of 80) · reads a repeat key (6 of 80) · can answer 403 (6 of 80).","Its switches (binding and flag) are not unusual: the same binding on 79 of 80 endpoints, the same flag on 79 of 80 endpoints. A switch is set by the server's settings and changes a way the request can go. So by my pick a switch stands in Gates and decisions beside what it switches, and a rare piece becomes a label on the item it names."],"verdict":{"lens":0,"verdict":"partly","remains":"The answer ('Is this endpoint built like the others, and what is unusual about it?') is in the Gates head hover. Nothing there says it belongs to Standard or specialist, and the 'standard' half (switches shared by 79 of 80 endpoints) is never drawn."},"findings":[],"shots":[{"f":"349-d066-hover-the-gates-row-head.png","w":520,"h":1028,"cap":"pointing at Gates and decisions"}]},{"key":"inflight","q":"What does in-flight state affect?","short":"“what does in-flight state affect?”","subject":"code","items":["L-17"],"about":null,"lines":["An in-flight value is something the code keeps outside a local variable, so a later moment can use what an earlier moment put there. It is not a flag stored in the database.","This request carries 10: 3 go with the answer, 7 are kept by the server between requests.","idempotency_key, from IdempotencyMiddleware, is read at api/cooking.py:126. When it is missing, the answer is 400 “Idempotency-Key required for cooking session” (api/cooking.py:128). Then start_session claims it with get-or-create on cooking_sessions, unique on household_id + idempotency_key; a request that races another with the same key ends uncaught (500).","session (AsyncSession), from get_session, is read at api/cooking.py:137, 148, 151, 167, 171. At api/cooking.py:167 the save goes through it.","ctx (AuthContext), from get_auth_context, is read at api/cooking.py:125, 139, 148, 151, 171. At api/cooking.py:125 it decides 409 “setup required”.","Kept by the server: whether rate limiting is on (rate_limit_active) · how many proxies to trust when it reads the client's IP (trusted_proxy_hops) · the sensitive counter (_sensitive) · the sensitive limit per minute (rate_limit_sensitive_per_minute) · the window in seconds (rate_limit_window_seconds) · the global counter (_global) · the global limit per minute (rate_limit_per_minute). Of these, the sensitive counter, the sensitive limit per minute, the window in seconds, the global counter and the global limit per minute are read where the 429 endings are checked (middleware/rate_limit.py:117, 121)."],"verdict":{"lens":0,"verdict":"answered","remains":"The lifelines put, on each value's line, the endings its reads can decide (429 ×2, 400, 409), the claim on cooking_sessions and the commit. The rate limiter's 429 read is the one twin left."},"findings":[],"shots":[{"f":"372-d066-hover-a-read-dot.png","w":349,"h":129,"cap":"pointing at 409"}]},{"key":"roles","q":"Why do these functions have no role?","short":"“why no role?”","subject":"map","items":["L-14"],"about":"This answer is about the map, not the code, so it lives here and not on the page (D-017).","lines":["A function's role comes from the Gabe Universe, and the Universe draws only what the code map reads. The code map reads 10 folders of apps/api: agents · api · auth · events · guardrails · integrations · models · recipes/pipeline · schemas · services.","ResolutionSnapshot.violations_for: lives in reference/resolution.py; the code map does not read the folder reference/.","derive_restrictions: lives in reference/resolution.py; the code map does not read the folder reference/.","get_idempotency_key: lives in middleware/idempotency.py; the code map does not read the folder middleware/.","Folders the forms feed reaches that the code map does not read: i18n · middleware · net · reference · scripts.","Where no source knows a role, the page now uses the station's own rule on the feed: accessor when a function reads or writes a table in its own body, gate by the station's name rule. Otherwise a function wears its icon and its name, and its hover says what it does.","The fix is to widen what gustify's code map reads. That is a change in gustify, and it waits: work stays in the suite for now."],"verdict":null,"findings":[{"id":"F19","what":"The functions you named still have no role and no call depth, their caller is misstated, the why is not on the page, and you cannot open them on the bench.","outcome":"partly","why":"caller and depth fixed; why these have no role is about the map (D-017), answered on this review page instead"}],"shots":[{"f":"365-d066-hover-resolutionsnapshot-violations-for.png","w":520,"h":201,"cap":"pointing at ResolutionSnapshot.violations_for"}]}],"gap":{"topRating":3,"newSections":["Endings","Proof","Gates and decisions","Data effects","Functions","Structures","Client","In- ffects"],["delivery: one answer or a stream","carried","Endings"]],"widening":[["the hook that fetches","Client"],["the screen","Client"],["routes → router → App above the screen",null],["the curated workflow step around it","the endpoint metadata"],["usage and fan-in","the endpoint metadata"],["the reply has other users","Structures"]],"orphaned":[["the ordered chain per ending","drawn only as BY MOMENT's axis"],["events published","drawn nowhere (would lose its home with Standard or specialist)"],["tasks dispatched","drawn nowhere (would lose its home with Standard or specialist)"],["outside services called","lands in the endpoint metadata — it is an effect that can fail and cost, so Data effects fits better"],["coverage per condition","lands in the endpoint metadata — the per-ending marks belong in Proof"]],"alsoFound":["The lab's own Security part says 'none — a retry runs the work again' for this endpoint's idempotency, which is wrong: it looks for a table named idempotency_keys instead of reading the feed's repeat block.","The lab's Security part has numbers from POST /setup/complete typed into its sentences (the corpus proves five, 3 unique constraints, 11 writes …), false on every other endpoint."],"nRows":41,"nNone":6,"secMissing":2,"secOrphan":2,"orphanFates":"Stages and order becomes the time axis, and Standard or specialist leaves the table if you pick split or merge for it"},"audit":{"id":"A1","name":"The legibility audit: measure-legibility.mjs moved into the suite","what":"One script opens a generated page in a browser and counts each kind of defect this round found. Today it is a prototype in this folder, run by hand on all-endpoints. Landed, it takes any page, and the check proposals marked part of A1 become its counts.","lands":"skills/gabe-artifact/tools/legibility-audit.mjs, moved from docs/design/design-context/legibility/measure-legibility.mjs, and a new battery, tests/legibility-audit/run.sh, that proves each count can fire and stay silent","gate":"It reports; it stops nothing.","battery":"suite-doctor gains one more battery that opens a browser, so its run grows.","against":"It reads one page at one width; a defect that shows on another endpoint or at another width stays unseen. Its first run on all-endpoints is a long list of work, not a pass.","lines":"The prototype is 149 lines today.","parts":["P3.1","P1.1","P6.1","P2.1","P7.1","P10.1"],"pick":"land"},"patterns":[{"id":"P4","name":"One end of a relation","line":"A condition without the function that checks it, a refresh without what it fetches, a branch shown as a file and a line, tables without the function that touches them.","whyModel":"The data record joined both ends: a data chip carried the table AND the function. The page drew one end; the model reads the keys, not the face.","whyHuman":"A person reads the face. Half a relation is a question: checked where? fetched from what? written by whom?","items":["L-08","L-10","L-12","L-15","L-16","L-17"],"nFind":12,"nOpen":0,"nRem":0,"stillThere":4,"because":"You raised it: L-08 · L-10 · L-12 · L-15 · L-16 · L-17.","out":{"fixed":8,"partly":2,"left":2,"his":0},"checks":[],"suite":[{"cid":"P4.1","kind":"check","target":"each page generator, as a build check (gen-all-endpoints.py, gen-legibility-review.mjs)","what":"An element whose record joins two things draws both ends, or its hover names the other end.","lands":"a check in the build of each generator, beside its words sweep","gate":"It stops the build.","against":"The generator must say which records join two things; a join it does not list stays unchecked.","partOf":null,"waits":[],"flags":"No measure counts it yet.","pick":"land"},{"cid":"P4.2","kind":"words","target":"skills/gabe-lens (plain)","what":"A role word needs its object: a fetcher OF what, a check IN which function, a branch ON which ending.","lands":"skills/gabe-lens/references/lens-spec.md, one rule in the plain mode","gate":"Words only: nothing runs.","against":"Words only; no check s

would like to know why we haven't done that. Or in the get idempotency key, in the checks column also having the same thing.","where":"BY MOMENT · Functions · subscription_tier_for +2 and checks","couldNot":"whether those names are functions at all.","fix":"A function always wears the function glyph; its role from the station, the lab's walk, else the station's own rule on the feed (accessor · gate); no role: glyph and name, the hover says what it does; the why is answered in D-069, not on the page.","fixRecord":"BUILT — a function always wears the function glyph; its role from the station, the lab's walk, else the station's own rule on the feed (accessor · gate); no role: glyph and name, the hover says what it does; the why is answered in D-069, not on the page.","status":"built (D-069)","kind":"built","pattern":"P3","patternName":"An element drawn without its identity","verdicts":[{"lens":0,"verdict":"partly","remains":"They now wear the glyph, but still no role and no call depth. violations_for, derive_restrictions and load_resolution_snapshot say 'called at cooking.py:150' although assert_recipe_allergen_safe calls them. Why they have no role is answered only in D-069, not on the page."},{"lens":1,"verdict":"answered","remains":"Every function wears the glyph. 13+ names break mid-word."}],"findings":[{"id":"F19","sev":"costly","what":"The functions you named still have no role and no call depth, their caller is misstated, the why is not on the page, and you cannot open them on the bench.","outcome":"partly","why":"caller and depth fixed; why these have no role is about the map (D-017), answered on this review page instead"},{"id":"S4-15","sev":"costly","what":"The same kind of element is drawn two ways: these middleware chips wear no station glyph, while RateLimitMiddleware in Gates and decisions wears the station's middleware glyph (D-052). IdempotencyMiddleware also breaks mid-word.","outcome":"fixed","why":null},{"id":"S4-31","sev":"minor","what":"Station ele r it is an endpoint a functions a table or schema for what is being used and what is the effect of on that\"","readAs":null,"first":"we were basically missing okay we have too many hovers too many repetitive hovers describing things that were static not dynamic the idea is to show a little bit of content of the static things on the dynamic explanation of the items that that that that will be a very good summarization of the hovering um description of something in general in this kind of panels that whatever dynamic information we have that should give in enough static context to be understandable when we hover in top of the item that will be it and understandable on this content would be understand the input process and output like okay initial conditions what are we checking then how are we checking that and then what are we producing whatever it is an endpoint a functions a table or schema for what is being used and what is the effect of on that","rest":"","where":"every hover of the page","couldNot":"the item — hovers describe its KIND and leave out what this one checks, how, and what it produces.","fix":"Every BY MOMENT item's hover is before · checks · gives from the feed; labelled lines (my pick, dashed) or one sentence; a column's words sit on its head only. The code map's items are one hover each (their name, kind and labels), not yet in the three parts.","fixRecord":"BUILT — every BY MOMENT item's hover is before · checks · gives from the feed (`_ae_io.io_of`, the one builder later kinds extend); labelled lines (my pick, dashed) or one sentence (mo.opt.ipo); a column's words sit on its head only. The code map's items are one hover each (their name, kind and labels), not yet in the three parts.","status":"built (D-067); ruled — labelled lines (D-081); the one hover format follows the frontend lab's cards (L-33)","kind":"built","pattern":"P1","patternName":"The hover describes the kind, not the item","verdicts":[{"lens":0,"verdict":"partly","remains":"Chip ho nt something very similar to that where we can drag and drop the different elements that we show inside uh show show them or not size color and so on and that for every one of the elements that we we want to represent on this table","where":"a new section between ONE ENDPOINT and BY MOMENT","couldNot":"how a table, a schema, a test, a function or an ending should look — there is no place to decide one element's look on its own.","fix":"Section EXAMPLES between ONE ENDPOINT and BY MOMENT — eight columns in your order, each a title, a scope switch, role chips and a select, the block, then parts (drag · not drawn) · size · colour · back to the default · copy.","fixRecord":"built: section EXAMPLES (`sec-ex`) between ONE ENDPOINT and BY MOMENT — eight columns in your order, each a title, a scope switch, role chips and a select, the block, then parts (drag · not drawn) · size · colour · back to the default · copy.","status":"built (D-071)","kind":"built","pattern":"P9","patternName":"No bench to decide one element's look","verdicts":[{"lens":0,"verdict":"answered","remains":"The bench is built: 8 columns in your order, selector, role filter, block, parts/size/colour, reset, copy. At 1920 the element names inside the blocks are cut off ('sensiti…', 'useStartCoo…', 'Rate limit exceeded…'). The ending selector has twin entries. Four functions are missing from the function list."},{"lens":1,"verdict":"partly","remains":"The bench is built. Text is cut in every column. A bare number means fields, lines, ways, tests, reactions or readers depending on the column, with no label. It uses different words from BY MOMENT for the same kinds, shows raw code and assert expressions, and its copy lines are config syntax with 'block block' and 'D-027'."},{"lens":2,"verdict":"partly","remains":"The ending, table, schema, in-flight and hook counts are true. Three are not: TEST 'from the service side 8' should be 1, gate 'all 21' should be 20, and FUNCTION 'all 25' leaves out 4 functions this st one.","where":"the review page · every table · first seen on \"What round 1b left\", its first table's status column","couldNot":"a row at a glance — short values (a status, a count) wrap onto a second line in a column narrower than they need, while the page leaves width unused at the sides.","fix":"The page's column stays centred and takes the screen (up to 1800 px, or 96% of a narrower one); every table spans it; a short value (a status, a count, an id, a kind, a verdict) sits in its own column on one line and never wraps, so a row reads as one line wherever its values are short; the long-prose columns take the width that is left; the status of a row in What round 1b left is two marks on one line; below phone width the page reflows. Measured at 1920 and at 1600 px.","fixRecord":"built: the page's column stays centred and takes the screen (up to 1800 px, or 96% of a narrower one); every table spans it; a short value (a status, a count, an id, a kind, a verdict) sits in its own column on one line and never wraps, so a row reads as one line wherever its values are short; the long-prose columns take the width that is left; the status of a row in What round 1b left is two marks on one line; below phone width the page reflows. Measured at 1920 and at 1600 px.","status":"built (D-072)","kind":"built","pattern":null,"patternName":null,"verdicts":[],"findings":[],"shots":[]},{"id":"L-25","round":2,"name":"icons in place of words","words":"\"Can we also use more encoding using icons and summarize things?\"","readAs":null,"first":"Can we also use more encoding using icons and summarize things?","rest":"","where":"the review page · every section","couldNot":"where a section stands without reading it all — states and kinds are written out as words, and nothing sums a section up before its tables.","fix":"Every state wears an icon and a colour (fixed, partly fixed, left, open, yours to rule, my pick, yours, ruled, built, waiting on your pick, question answered, logged, and the kinds of an open row); each pattern wears its own icon wherever it appears (cards, chips, tables); the words stand once in a legend near the top and in each icon's hover; a table cell shows the icon and its number; a stacked bar shows fixed, partly, left and yours to rule per item, pattern and question; an overview table opens each of Your items, the patterns, Your calls, Your questions and What round 1b left; each section opens with what it sums up to (the spoken summary, L-26).","fixRecord":"built: every state wears an icon and a colour (fixed, partly fixed, left, open, yours to rule, my pick, yours, ruled, built, waiting on your pick, question answered, logged, and the kinds of an open row); each pattern wears its own icon wherever it appears (cards, chips, tables); the words stand once in a legend near the top and in each icon's hover; a table cell shows the icon and its number; a stacked bar shows fixed, partly, left and yours to rule per item, pattern and question; an overview table opens each of Your items, the patterns, Your calls, Your questions and What round 1b left; each section opens with what it sums up to (the spoken summary, L-26).","status":"built (D-072)","kind":"built","pattern":null,"patternName":null,"verdicts":[],"findings":[],"shots":[]},{"id":"L-26","round":2,"name":"a summary to copy for reading aloud","words":"\"At the beginning of each set of tables, I would like a summary that I can copy and paste and read out loud in a chat that I have dedicated to reading out loud your messages.\"","readAs":null,"first":"At the beginning of each set of tables, I would like a summary that I can copy and paste and read out loud in a chat that I have dedicated to reading out loud your messages.","rest":"","where":"the review page · the start of every section","couldNot":"the page by ear — there was no text written to be read aloud: ids, file paths and symbols read badly when spoken.","fix":"Each section opens with a spoken summary of 3 to 6 sentences in plain words (no ids, paths or symbols; an item or a pattern by its name), generated from the data, with a copy-to-read-aloud button whose text is the summary shown; one button at the top copies every summary in page order, each headed by its section's name. My proposal, dashed: a listen button beside each copy button reads the summary with the browser's own voice, at a speed you pick and the browser remembers; it hides where the browser has no speech.","fixRecord":"built: each section opens with a spoken summary of 3 to 6 sentences in plain words (no ids, paths or symbols; an item or a pattern by its name), generated from the data, with a copy-to-read-aloud button whose text is the summary shown; one button at the top copies every summary in page order, each headed by its section's name. My proposal, dashed: a listen button beside each copy button reads the summary with the browser's own voice, at a speed you pick and the browser remembers; it hides where the browser has no speech.","status":"built (D-072)","kind":"built","pattern":null,"patternName":null,"verdicts":[],"findings":[],"shots":[]},{"id":"L-27","round":2,"name":"a player bar that stays in view","words":"\"when we put a voice, I would like it so that when I scroll down, the header navigation bar gets frozen on the top section. That way, I can stop or skip to a later section of the transcript, and it will also take me to that section on the page.\"","readAs":null,"first":"when we put a voice, I would like it so that when I scroll down, the header navigation bar gets frozen on the top section.","rest":"That way, I can stop or skip to a later section of the transcript, and it will also take me to that section on the page.","where":"the review page · the listen buttons (D-072) and the contents strip at the top","couldNot":"where the voice was, or how to move it — once the page scrolled, the controls stayed behind, and the reading had no tie to the place on the page.","fix":"While a voice plays, the contents where","L-34":"header and saving pictures that show the difference","L-35":"what each option would show once it is picked","L-36":"a simpler bench: icons, a copy button, a width per column","L-37":"a widened column you can drag","L-38":"a wide table that slides with Shift and the wheel","L-39":"a bench section for each element's layout","L-40":"where the choices waiting on you are gathered"},"questions":[{"key":"icon","q":"Why do these items have no icon?","short":"“why no icon?”","subject":"page","items":["L-09","L-14"],"about":null,"lines":["Before this round, an item wore an icon only when the Gabe Universe draws a node of its kind. It draws functions, tables, schemas, hooks and middleware. It draws no rate limit, check, fork or catch, so those were bare words.","Now each gate names the function or the middleware it runs in, with that element's icon and role. The gate itself wears an icon of this page's own, one per kind; which icons is one of your calls (gate icons).","A function always wears the function icon now, even when no role is known for it.","Items without an icon in BY MOMENT on POST /cooking/sessions: 63 before this round, 32 after round 1b. In the Gates row: 13, then 0. In Functions: 6, then 0.","What the measure still finds without one: Data effects 17 · Client 3 · In-flight state 12."],"verdict":{"lens":0,"verdict":"partly","remains":"Gates: answered; they wear icons, and the legend says the station draws no node for them. Functions without a role (violations_for, derive_restrictions, get_idempotency_key): the page never says why."},"findings":[],"shots":[{"f":"352-d066-hover-ratelimitmiddleware.png","w":520,"h":254,"cap":"pointing at RateLimitMiddleware"},{"f":"367-d066-hover-resolutionsnapshot-violations-for.png","w":518,"h":169,"cap":"pointing at ResolutionSnapshot.violations_for"}]},{"key":"fn","q":"What is this? A function?","short":"“a function?”","subject":"code","items":["L-09"],"about":"sensitive and global, at the edge","lines":["No. They are 2 counters, the sensitive counter and the global counter: objects of the class SlidingWindowLimiter (in the code: _sensitive and _global). The server builds them once, when it starts (middleware/rate_limit.py: line 103 for the sensitive counter, line 100 for the global counter).","They belong to RateLimitMiddleware, a middleware: code every request passes through before any endpoint runs. Its method RateLimitMiddleware.dispatch asks each counter if this client's IP is over its limit.","The sensitive counter: the 7 path prefixes on its sensitive list, this one among them (23 endpoints). At most 20 requests in 60 seconds. Checked at line 117, first.","The global counter: every path but /healthz (79 endpoints). At most 120 requests in 60 seconds. Checked at line 121, after the sensitive counter.","Over a limit, the answer is 429 “Rate limit exceeded. Try again shortly.” and the endpoint never runs. Both counters run only when rate limiting is switched on, or in production (settings.rate_limit_enabled or settings.is_production)."],"verdict":{"lens":0,"verdict":"answered","remains":"'sensitive · rate limiter — runs in RateLimitMiddleware' under the RateLimitMiddleware head. Every gate names its host."},"findings":[],"shots":[{"f":"352-d066-hover-ratelimitmiddleware.png","w":520,"h":254,"cap":"pointing at RateLimitMiddleware"},{"f":"353-d066-hover-the-sensitive-limit.png","w":520,"h":460,"cap":"pointing at rate limit sensitive 20/60s → 429 app-wide"}]},{"key":"fetch","q":"What is fetching, and from where?","short":"“what is fetching?”","subject":"code","items":["L-15"],"about":"the client hook after the answer","lines":["The hook that sends this request is useStartCooking, a mutation. It sends POST /api/v1/cooking/sessions.","When the answer is a success (onSuccess), it refreshes the saved answers under the key [\"cooking\"] (cooking/useCookingSessions.ts:99). A refresh throws those answers away, so a screen that shows them fetches them again.","2 hooks keep a saved answer under that key, so this is what is fetched: useActiveCooking sends GET /api/v1/cooking/active · useRemindersDue sends GET /api/v1/cooking/reminders/due.","This request writes cooking_sessions · cooking_stage_reminders. useActiveCooking reads cooking_photos · cooking_sessions · cooking_step_progress · recipes; of those, this request writes cooking_sessions. useRemindersDue reads cooking_stage_reminders; of those, this request writes cooking_stage_reminders."],"verdict":{"lens":0,"verdict":"answered","remains":"The refresh chip names useActiveCooking → GET /cooking/active and useRemindersDue → GET /cooking/reminders/due, each reply and its tables. The sending hook is still labelled 'fetcher'."},"findings":[],"shots":[{"f":"368-d066-hover-the-refresh-chip.png","w":518,"h":514,"cap":"pointing at useStartCooking fetcher on success · refresh [\"cooking\"]"}]},{"key":"why","q":"Why do the 403 and the 404 trigger? In which context?","short":"“why do they trigger?”","subject":"code","items":["L-16"],"about":"Client · after the answer","lines":["Each ending has a cause in the server and a branch on the screen.","403 “Recipe contains your allergen restrictions”: the handler's except AllergenConflictError at api/cooking.py:159 answers it.","assert_recipe_allergen_safe raises it at services/recipes.py:234, 2 calls below the handler, when the recipe holds one of the user's allergens (in the code: derived & set(user_allergens)).","On the screen, describeStartCookingError reads 403 at cooking/cookingSessionModel.ts:381 and returns the text key “cooking.error.start_allergen”. The error reaches it from cooking/useCookingLoopActions.ts (lines 303, 386), in RecipeBrowseContainer.","404 “Recipe not found”: the handler's except SessionNotFoundError at api/cooking.py:155 answers it. SessionNotFoundError is raised in 2 places, so this ending has 2 causes.","start_session raises it at services/cooking.py:129, one call below the handler, when a session with this repeat key already exists and belongs to another member (in the code: existing is not None and existing.user_id != user_id).","start_session raises it at services/cooking.py:140, one call below the handler, when no active recipe has that id (in the code: recipe is None).","On the screen, describeStartCookingError reads 404 at cooking/cookingSessionModel.ts:384 and returns the text key “cooking.error.start_not_found”. The error reaches it from cooking/useCookingLoopActions.ts (lines 303, 386), in RecipeBrowseContainer."],"verdict":{"lens":0,"verdict":"partly","remains":"Client side: the hover gives the server ending that reaches each branch. Server side: the 403's raiser and its condition (assert_recipe_allergen_safe, `derived & set(user_allergens)`, only when the user has allergens) appear nowhere, and its raise is labelled 'answer not known'. The 404's second cause (replaying another member's key, services/cooking.py:129) shows as 'ending not recorded'."},"findings":[{"id":"F05","what":"Your question 'why does the 403 trigger?' has no answer anywhere: no raiser, no condition, and not the fact that it runs only when the user has allergens.","outcome":"partly","why":"the 403 names its raiser and the if it sits in; \"checked only when the user has allergens\" is not in the feed; no new gate chip"},{"id":"F06","what":"The 404 has two causes; the page tells a reader only one.","outcome":"fixed","why":null}],"shots":[{"f":"369-d066-hover-the-reads-403-line.png","w":498,"h":282,"cap":"pointing at reads 403 → “cooking.error.start_allergen”"}]},{"key":"std","q":"What are we representing in standard or specialist?","short":"“standard or specialist?”","subject":"page","items":["L-18"],"about":null,"lines":["The row answers one question: is this endpoint built like the others, and what is unusual about it?","An endpoint is made of pieces: its method, each status it can answer, reading a body, its login, its rate limit, its catches, its switches, a repeat key. Each piece is counted across the app's 80 endpoints. The rule: the norm = at least 9 endpoints in 10 carry it · rare = at most 1 in 10 · only here = this endpoint alone · common = everything between; a count, never a grade.","POST /cooking/sessions has 21 pieces: 10 the norm, 8 common, 3 rare, 0 only here. It lacks 0 of the norms.","Its rare pieces are what is unusual: claims its key with get-or-create (3 of 80) · reads a repeat key (6 of 80) · can answer 403 (6 of 80).","Its switches (binding and flag) are not unusual: the same binding on 79 of 80 endpoints, the same flag on 79 of 80 endpoints. A switch is set by the server's settings and changes a way the request can go. So by my pick a switch stands in Gates and decisions beside what it switches, and a rare piece becomes a label on the item it names."],"verdict":{"lens":0,"verdict":"partly","remains":"The answer ('Is this endpoint built like the others, and what is unusual about it?') is in the Gates head hover. Nothing there says it belongs to Standard or specialist, and the 'standard' half (switches shared by 79 of 80 endpoints) is never drawn."},"findings":[],"shots":[{"f":"351-d066-hover-the-gates-row-head.png","w":520,"h":987,"cap":"pointing at Gates and decisions"}]},{"key":"inflight","q":"What does in-flight state affect?","short":"“what does in-flight state affect?”","subject":"code","items":["L-17"],"about":null,"lines":["An in-flight value is something the code keeps outside a local variable, so a later moment can use what an earlier moment put there. It is not a flag stored in the database.","This request carries 10: 3 go with the answer, 7 are kept by the server between requests.","idempotency_key, from IdempotencyMiddleware, is read at api/cooking.py:126. When it is missing, the answer is 400 “Idempotency-Key required for cooking session” (api/cooking.py:128). Then start_session claims it with get-or-create on cooking_sessions, unique on household_id + idempotency_key; a request that races another with the same key ends uncaught (500).","session (AsyncSession), from get_session, is read at api/cooking.py:137, 148, 151, 167, 171. At api/cooking.py:167 the save goes through it.","ctx (AuthContext), from get_auth_context, is read at api/cooking.py:125, 139, 148, 151, 171. At api/cooking.py:125 it decides 409 “setup required”.","Kept by the server: whether rate limiting is on (rate_limit_active) · how many proxies to trust when it reads the client's IP (trusted_proxy_hops) · the sensitive counter (_sensitive) · the sensitive limit per minute (rate_limit_sensitive_per_minute) · the window in seconds (rate_limit_window_seconds) · the global counter (_global) · the global limit per minute (rate_limit_per_minute). Of these, the sensitive counter, the sensitive limit per minute, the window in seconds, the global counter and the global limit per minute are read where the 429 endings are checked (middleware/rate_limit.py:117, 121)."],"verdict":{"lens":0,"verdict":"answered","remains":"The lifelines put, on each value's line, the endings its reads can decide (429 ×2, 400, 409), the claim on cooking_sessions and the commit. The rate limiter's 429 read is the one twin left."},"findings":[],"shots":[{"f":"374-d066-hover-a-read-dot.png","w":349,"h":129,"cap":"pointing at 409"}]},{"key":"roles","q":"Why do these functions have no role?","short":"“why no role?”","subject":"map","items":["L-14"],"about":"This answer is about the map, not the code, so it lives here and not on the page (D-017).","lines":["A function's role comes from the Gabe Universe, and the Universe draws only what the code map reads. The code map reads 10 folders of apps/api: agents · api · auth · events · guardrails · integrations · models · recipes/pipeline · schemas · services.","ResolutionSnapshot.violations_for: lives in reference/resolution.py; the code map does not read the folder reference/.","derive_restrictions: lives in reference/resolution.py; the code map does not read the folder reference/.","get_idempotency_key: lives in middleware/idempotency.py; the code map does not read the folder middleware/.","Folders the forms feed reaches that the code map does not read: i18n · middleware · net · reference · scripts.","Where no source knows a role, the page now uses the station's own rule on the feed: accessor when a function reads or writes a table in its own body, gate by the station's name rule. Otherwise a function wears its icon and its name, and its hover says what it does.","The fix is to widen what gustify's code map reads. That is a change in gustify, and it waits: work stays in the suite for now."],"verdict":null,"findings":[{"id":"F19","what":"The functions you named still have no role and no call depth, their caller is misstated, the why is not on the page, and you cannot open them on the bench.","outcome":"partly","why":"caller and depth fixed; why these have no role is about the map (D-017), answered on this review page instead"}],"shots":[{"f":"367-d066-hover-resolutionsnapshot-violations-for.png","w":518,"h":169,"cap":"pointing at ResolutionSnapshot.violations_for"}]}],"gap":{"topRating":3,"newSections":["Endings","Proof","Gates and decisions","Data effects","Functions","Structures","Client","In-flight state"],"undecided":["Standard or specialist"],"toMetadata":["Overview and risk"],"asAxis":["Stages and order"],"ruledPairing":"prisms.md, 2026-09-19: data → Data effects · schemas → Structures · functions → Functions · tests → Proof · widening → Client · security → Gates and decisions ('a gate is one kind of fork').","parts":[{"part":"data","n":10,"r3":4,"none":2,"to":[["Data effects",4],["hidden (about the map, D-017)",1],["Proof",1],["Gates and decisions",1],["Functions",1]],"rows":[["tables touched",3,"Data effects"],["operation per table",3,"Data effects"],["fate of the writes",3,"Data effects"],["provisions (a row the login adds)",2,"Data effects"],["how a table was found",1,"hidden (about the map, D-017)"],["the moment a table is touched",2,null],["expected slots at this stage",2,nul ange it and it waits for you to say what to change, and nothing is written until you do.","parts":["To learn how many hovers repeat a line or how many names break, you ran a prototype by hand on one page, the page for the request that starts a cooking session. It is not in the suite, so no other page is measured and nothing says when you last ran it.","It is like bolting a quality inspector's hand-held gauge to the assembly line as a fixed inspection station, so every part passes it and not only the ones somebody remembers to bring.","The prototype of one hundred forty nine lines moves into the artifact skill, a new battery proves each count can fire and stay silent, and the suite check gains a longer run that opens a browser.","The measure stays a script you run by hand on one page, and the checks the other proposals share have no home.","You can land it, leave it for now, or ask for a change.","You already ruled it, as land it."],"opts":{"land":"land it","notyet":"not yet","change":"change it"},"plain":"One script that opens any page in a browser and counts the defects this round found — today a prototype, and once landed a tool of the suite.","si":2},{"key":"P4.1","id":"P4.1","sec":"pat","gk":"P4","gn":"One end of a relation","gp":"P4","name":"both ends of a link","tag":"check","ex":"No measure counts it yet, so it would have caught what you raised about “what a test does and touches”, and no row of this pattern is open now.","exSay":"No measure counts it yet, so it would have caught what you raised about what a test does and touches, and no row of this pattern is open now.","imp":{"land":"Adds a check to the build of each page generator, next to its word check. It stops the build.","notyet":"Changes nothing in the suite, and no row of this pattern is open now.","change":"Waits for you to say what to change, and nothing is written until you do."},"impSay":"Pick land it and it stops the build; pick not yet and it changes nothing in the suite, and no row of this pattern is open now; pick change it and it waits for you to say what to change, and nothing is written until you do.","parts":["You read a condition on the request that starts a cooking session and cannot tell which function checks it, because the page drew one end of the link and nothing in its build made it draw the other. Each half link is a question you have to go and answer yourself.","It is like a booking form for a train ticket that refuses to print until both the departure and the arrival boxes are filled.","A check in the build of each page generator, one pass per generator, and each generator must first say which records join a pair of things.","Pages keep drawing half a link, and you keep asking checked where, or fetched from what.","You can land it, leave it for now, or ask for a change.","You already ruled it, as land it."],"opts":{"land":"land it","notyet":"not yet","change":"change it"},"plain":"A build check that stops a page from showing half of a link — a function without its condition, a refresh without what it fetches.","si":2},{"key":"P4.2","id":"P4.2","sec":"pat","gk":"P4","gn":"One end of a relation","gp":"P4","name":"a role names its object","tag":"words","ex":"Written down, the rule would have governed what you raised about “what a test does and touches”, and no row of this pattern is open now.","exSay":"Written down, the rule would have governed what you raised about what a test does and touches, and no row of this pattern is open now.","imp":{"land":"Writes one rule into the plain mode of the lens. Words only: nothing runs.","notyet":"Changes nothing in the suite, and no row of this pattern is open now.","change":"Waits for you to say what to change, and nothing is written until you do."},"impSay":"Pick land it and it is words only, so nothing runs; pick not yet and it changes nothing in the suite, and no row of this pattern is open now; pick change it and it waits for you to say what to change, and nothing is written until you do.","parts":["You read a role word on a label, fetcher or check, and ask of what and in which function. The word names the role and leaves out what it acts on, and no rule asks for it.","It is like a checklist line that says inspect with no object, which the crew member ticks and nobody knows what was inspected.","One rule in the plain mode of the lens, written in words with no check behind it, and each role word grows by an object, so a label gets longer.","Role words keep arriving without their object, and you keep asking fetcher of what.","You can land it, leave it for now, or ask for a change.","You already ruled it, as land it."],"opts":{"land":"land it","notyet":"not yet","change":"change it"},"plain":"A writing rule that a role word names its object — a fetcher of what, a check in which function.","si":2},{"key":"P3.1","id":"P3.1","sec":"pat","gk":"P3","gn":"An element drawn without its identity","gp":"P3","name":"bare items without an icon","tag":"check","ex":"Measured on the endpoints page, the count of items without an icon reads 32 now and read 63 at the start, and it would have caught what you raised about “what a gate is, and its function”. Left open: R-08 — the values a test meets are bare names, without BY MOMENT's kind icons.","exSay":"Measured on the endpoints page, the count of items without an icon reads thirty two now and read sixty three at the start, and it would have caught what you raised about what a gate is, and its function.","imp":{"land":"Adds a count of bare items to the audit, with a case that fires and a case that stays silent. It reports; it stops nothing.","notyet":"Changes nothing in the suite, so what round 1b left open in this pattern, 2 open rows, still has nothing standing behind it.","change":"Waits for you to say what to change, and nothing is written until you do."},"impSay":"Pick land it and it reports and stops nothing; pick not yet and it changes nothing in the suite, so what the last round left open in this pattern, two open rows, still has nothing standing behind it; pick change it and it waits for you to say what to change, and nothing is written until you do.","parts":["You scan a row on the request that starts a cooking session and some items wear no icon, so you cannot tell what kind of thing they are. The count of items without an icon was sixty three at the start and is thirty two now.","It is like a hospital that issues wristbands, where every patient wears one and an inspector counts the bare wrists on the ward each morning.","A pass over the audit script to count bare items, with a test case that fires and one that stays silent, and the count waits on your ruling about gate icons.","New items keep arriving as bare words, and you keep asking what each one is.","You can land it, leave it for now, or ask for a change.","You already ruled it, as land it."],"opts":{"land":"land it","notyet":"not yet","change":"change it"},"plain":"A count of items that show a bare word where an icon belongs — it reports, and your gate-icon pick decides what it counts.","si":2},{"key":"P3.2","id":"P3.2","sec":"pat","gk":"P3","gn":"An element drawn without its identity","gp":"P3","name":"a page mark for every kind","tag":"reference","ex":"Written down, the rule would have governed what you raised about “what a gate is, and its function”, and round 1b left 2 open rows of this pattern. Left open: R-08 — the values a test meets are bare names, without BY MOMENT's kind icons.","exSay":"Written down, the rule would have governed what you raised about what a gate is, and its function, and the last round left two open rows of this pattern.","imp":{"land":"Writes one rule into the artifact rules. Words only: nothing runs.","notyet":"Changes nothing in the suite, so what round 1b left open in this pattern, 2 open rows, still has nothing standing behind it.","change":"Waits for you to say what to change, and nothing is written until you do."},"impSay":"Pick land it and it is words only, so nothing runs; pick not yet and it changes nothing in the suite, so what the last round left open in this pattern, two open rows, still has nothing standing behind it; pick change it and it waits for you to say what to change, and nothing is written until you do.","parts":["A kind that the Gabe Universe, the map of the code, does not draw arrives on the page as a bare word, and you have to ask what it is. No rule says it must wear a mark of the page's own.","It is like a warehouse that tags every kind of crate with its own sticker before it goes on the shelf, so nobody has to open a crate to learn what it holds.","One rule in the artifact rules, written in words, and the key grows by one entry for each new kind.","Each kind the Gabe Universe does not draw keeps arriving as a bare word.","You can land it, leave it for now, or ask for a change.","You already ruled it, as change it."],"opts":{"land":"land it","notyet":"not yet","change":"change it"},"plain":"A written rule that a kind the station does not draw wears a mark of the page's own, never a plain word.","si":2},{"key":"P1.1","id":"P1.1","sec":"pat","gk":"P1","gn":"The hover describes the kind, not the item","gp":"P1","name":"repeated and nested hovers","tag":"check","ex":"Measured on the endpoints page, the count of hovers inside a hover reads 581 now and read 985 at the start, and it would have caught what you raised about “a definition repeated on every hover”. Left open: R-02 — every strip segment says 'Click to light these rows, again to clear.'","exSay":"Measured on the endpoints page, the count of hovers inside a hover reads five hundred eighty one now and read nine hundred eighty five at the start, and it would have caught what you raised about a definition repeated on every hover.","imp":{"land":"Adds counts to the audit for hovers inside a hover, for a line many hovers repeat, and for twins in one cell. It reports; it stops nothing.","notyet":"Changes nothing in the suite, so what round 1b left open in this pattern, 1 open row, still has nothing standing behind it.","change":"Waits for you to say what to change, and nothing is written until you do."},"impSay":"Pick land it and it reports and stops nothing; pick not yet and it changes nothing in the suite, so what the last round left open in this pattern, one open row, still has nothing standing behind it; pick change it and it waits for you to say what to change, and nothing is written until you do.","parts":["An agent builds a new page and you find the same line repeated in its hovers by pointing at items one at a time. At the start four thousand two hundred sixteen hovers carried a repeated line, and nothing counted them until the measure ran.","It is like a quality inspector at the end of an assembly line who counts the defects in each batch, instead of waiting for a customer to complain.","A pass over the audit script to add counts for a hover inside a hover, a repeated line and twins in one cell, each with a test case that fires and one that stays silent.","The next page repeats its hovers again and nobody counts it, so you find it by hand, the way you found it on this page.","You can land it, leave it for now, or ask for a change.","You already ruled it, as land it."],"opts":{"land":"land it","notyet":"not yet","change":"change it"},"plain":"A count that tells you where hovers pile up or say the same thing twice — it reports and stops nothing.","si":2},{"key":"P1.2","id":"P1.2","sec":"pat","gk":"P1","gn":"The hover describes the kind, not the item","gp":"P1","name":"a hover opens with the item","tag":"words","ex":"Written down, the rule would have governed what you raised about “a definition repeated on every hover”, and round 1b left 1 open row of this pattern. Left open: R-02 — every strip segment says 'Click to light these rows, again to clear.'","exSay":"Written down, the rule would have governed what you raised about a definition repeated on every hover, and the last round left one open row of this pattern.","imp":{"land":"Write :"Measured on the endpoints page, the count of words broken mid-word reads zero now and read nine at the start, and it would have caught what you raised about stages over the moments.","imp":{"land":"Adds these checks to the artifact render gate, which runs before a publish, with a case for each. It fails the render gate, which runs before a publish.","notyet":"Changes nothing in the suite, so what round 1b left open in this pattern, 2 open rows, still has nothing standing behind it.","change":"Waits for you to say what to change, and nothing is written until you do."},"impSay":"Pick land it and it fails the render gate that runs before a publish; pick not yet and it changes nothing in the suite, so what the last round left open in this pattern, two open rows, still has nothing standing behind it; pick change it and it waits for you to say what to change, and nothing is written until you do.","parts":["You read names on the request that starts a cooking session that break in the middle of a word, or text that stops with dots, and you cannot read the whole name. At the start nine words broke in the middle.","It is like the proofreader at a print shop who checks every page for a word cut at the edge before the run is released.","A pass over the gate that runs before a publish, to add the checks with a test case for each, so the run you wait for before every publish grows a little.","Words keep breaking and text keeps getting cut on each new surface, and you find them by eye.","You can land it, leave it for now, or ask for a change.","You already ruled it, as not yet."],"opts":{"land":"land it","notyet":"not yet","change":"change it"},"plain":"A check in the render gate that catches words broken in the middle and text cut off — a page that fails it is held back from publishing.","si":2},{"key":"P5.2","id":"P5.2","sec":"pat","gk":"P5","gn":"Structure hidden in a mark, or mixed into an axis","gp":"P5","name":"a mark carries its key","tag":"reference","ex":"Written down, ive rate limit on the request that starts a cooking session and want what comes before it, what it checks and what it gives. The hover hands you the facts in a shape you have to unpack first.","It is like a pharmacy bottle's label, which can print what to take it with, what not to exceed and what it does on separate lines, or run them into one sentence.","One click of yours, since both shapes are built, and the lines make a taller hover while the sentence makes a shorter one.","The hovers keep their mixed shape, and you keep unpacking the same facts on every item.","You choose between labelled lines or one sentence.","You already ruled it, as labelled lines."],"opts":{"lines":"labelled lines","sent":"one sentence"},"plain":"The small box that opens when you point at an item — it lists what comes before, what it checks and what it gives, or says it all in one line.","si":3},{"key":"mo.hdr","id":"mo.hdr","sec":"calls","gk":"table","gn":"The BY MOMENT table","gp":null,"name":"the header","tag":null,"ex":"On POST /cooking/sessions the header shows the stages from the edge to the answer, and a bracket over the handler's ways to end, among them the failures SessionNotFoundError, AllergenConflictError and ConcurrentCookCapError, says a request takes only one of them.","exSay":"On the request that starts a cooking session the header shows the stages from the edge to the answer, and a bracket over the handler's ways to end, among them the failures session not found error, allergen conflict error and concurrent cook cap error, says a request takes only one of them.","imp":{"band":"Draws the stages over the moments and nothing more, so only the bracket says which moments are alternatives.","road":"Adds a line under the stages that says whether the moments below come in turn or are ways a request can go, so the header is one line taller."},"impSay":"Pick stages over moments and it draws the stages over the moments and nothing more, so only the bracket says which moments are alternatives; pick stages with the roads and the moments and it adds a line under the stages that says whether the moments below come in turn or are ways a request can go, so the header is one line taller.","parts":["You read the stage names over the columns on the request that starts a cooking session and cannot tell which columns are steps taken in turn and which are ways a request can go instead. Some columns wear the stage mark and some do not, and nothing says why.","It is like a railway timetable, where one train's stops come in order and connections are other trains you could take, and only a heading says which is which.","One click of yours, since both headers are built, and the road line makes the header one line taller.","Alternative columns keep looking like later steps, and you keep stopping to ask which is which.","You choose between stages over moments or stages with the roads and the moments.","You already ruled it, as stages over moments."],"opts":{"band":"stages over moments","road":"stages with the roads and the moments"},"plain":"The strip of stage names above the table — with or without a line saying whether the moments below come one after another or are ways a request can go.","si":3},{"key":"mo.save","id":"mo.save","sec":"calls","gk":"table","gn":"The BY MOMENT table","gp":null,"name":"saving","tag":null,"ex":"On POST /cooking/sessions the commit in post_start_session is the handler's own save, and it comes after start_session has written the session.","exSay":"On the request that starts a cooking session the commit in post start session is the handler's own save, and it comes after start session has written the session.","imp":{"eff":"Puts the save under EFFECTS, with the other writes the handler leaves behind, after the handler's other moments.","hand":"Keeps the save under HANDLER, with the handler's own code, and draws EFFECTS as an empty outline beside it."},"impSay":"Pick saving under EFFECTS and it puts the save under EFFECTS, with the other writes the handler leaves behind, after the handler's other moments; pick saving under HANDLER and it keeps the save under HANDLER, with the handler's own code, and draws EFFECTS as an empty outline beside it.","parts":["On the request that starts a cooking session the handler writes the session and then saves it, and the save stands among the handler's other steps. You cannot tell whether saving is the handler's own work or a leftover the request leaves behind.","It is like the last step of a bank transfer, where the teller presses confirm, which can be listed with the counter work or with the entry left in the ledger.","One click of yours, since both are built, and either the save moves into the column of what is left behind or it stays with the handler and that column becomes an empty outline.","The save keeps standing where you cannot tell whether it belongs to the handler or to what the handler leaves behind.","You choose between saving under EFFECTS or saving under HANDLER.","You already ruled it, as saving under EFFECTS."],"opts":{"eff":"saving under EFFECTS","hand":"saving under HANDLER"},"plain":"The moment the handler saves its work — it stands among what the handler leaves behind, or beside the handler's own code.","si":3},{"key":"mo.meta","id":"mo.meta","sec":"calls","gk":"table","gn":"The BY MOMENT table","gp":null,"name":"the metadata","tag":null,"ex":"On POST /cooking/sessions the metadata holds 4 findings about its refusals, such as the 409 answer that more than one refusal shares.","exSay":"On the request that starts a cooking session the metadata holds four findings about its refusals, such as the conflict answer that more than one refusal shares.","imp":{"after":"Keeps the table first on the screen, with the metadata under it.","before":"Puts the metadata above the table, under the bar, so the table starts lower on the screen."},"impSay":"Pick metadata after the table and it keeps the table first on the screen, with the metadata under it; pick metadata before the table and it puts the metadata above the table, under the bar, so the table starts lower on the screen.","parts":["On the request that starts a cooking session the table that lays a request out step by step once carried a column that held no step, only facts about the request itself, and it read as one more step. Pulled out of the table, those facts still have to stand somewhere, above it or below it.","It is like the waybill on a parcel, which can sit on the front for the carrier to read first or in the paperwork behind it, with the same goods inside either way.","One click of yours, since both places are built, and above the table the facts are read first and the table starts lower on the screen.","Nothing breaks, because the facts stay under the table, but you keep meeting them last, after the whole table.","You choose between metadata after the table or metadata before the table.","You already ruled it, as metadata after the table."],"opts":{"after":"metadata after the table","before":"metadata before the table"},"plain":"The facts about the endpoint itself — they sit under the table or above it.","si":3},{"key":"mo.wid","id":"mo.wid","sec":"calls","gk":"table","gn":"The BY MOMENT table","gp":null,"name":"a head's click","tag":null,"ex":"On POST /cooking/sessions the edge moment holds RateLimitMiddleware, and a click on its head widens the column until that name stands whole, or until every chip in it fits on one line.","exSay":"On the request that starts a cooking session the edge moment holds rate limit middleware, and a click on its head widens the column until that name stands whole, or until every chip in it fits on one line.","imp":{"names":"Stops widening once no name breaks in the middle of a word, though a long chip may still wrap at a space.","line":"Keeps widening until every item sits on one line, so the column is wider and the table scrolls sideways sooner."},"impSay":"Pick names whole and it stops widening once no name breaks in the middle of a word, though a long chip may still wrap at a space; pick every item on one line and it keeps widening until every item sits on one line, so the column is wider and the table scrolls sideways sooner.","parts":["You click a column's head on the request that starts a cooking session to give it room, and the names inside either stop breaking in the middle of a word or every label lands on one line. In a column too narrow you read names that wrap letter by letter.","It is like a tailor letting out a seam, where you can stop as soon as the shirt stops pinching or keep going until every fold hangs straight, which takes much more cloth.","One click of yours, since both are built, and widening until every item sits on one line makes the column wider, so the table scrolls sideways sooner.","The click keeps widening a column only until no name breaks, and a long label may still wrap at a space.","You choose between names whole or every item on one line.","You already ruled it, as every item on one line."],"opts":{"names":"names whole","line":"every item on one line"},"plain":"What a click on a column's heading does — it widens the column until no name breaks, or until every item sits on one line.","si":3},{"key":"mo.fit","id":"mo.fit","sec":"calls","gk":"table","gn":"The BY MOMENT table","gp":null,"name":"fit","tag":null,"ex":"On POST /cooking/sessions the moments run past the edge of the box and the handler's last except moments are cut off, so fit has something to narrow or wrap.","exSay":"On the request that starts a cooking session the moments run past the edge of the box and the handler's last except moments are cut off, so fit has something to narrow or wrap.","imp":{"min":"Narrows the thinnest moments to strips that count their items, so more of the table fits, and a click on a strip widens it.","bands":"Wraps the moments into bands, one under the other, so nothing scrolls sideways and the table gets taller."},"impSay":"Pick narrow the rest and it narrows the thinnest moments to strips that count their items, so more of the table fits, and a click on a strip widens it; pick wrap into bands and it wraps the moments into bands, one under the other, so nothing scrolls sideways and the table gets taller.","parts":["On the request that starts a cooking session the columns run past the edge of the box and the last ones are cut off, so you scroll sideways to read them. The fit button has to narrow or wrap something, and each way gives up something you used to read.","It is like a suitcase that will not close, where you can squash the thin things into a corner or split the load into a second bag.","One click of yours, since both are built, and narrowing leaves strips you widen by clicking while wrapping makes the table taller.","The table keeps running past its box on thirty six of eighty endpoints, and fit keeps doing what it does today.","You choose between narrow the rest or wrap into bands.","You already ruled it, as wrap into bands."],"opts":{"min":"narrow the rest","bands":"wrap into bands"},"plain":"The fit button that squeezes a wide table into its box — it can shrink the thin columns to a strip, or wrap the table into bands.","si":3},{"key":"mo.stk","id":"mo.stk","sec":"calls","gk":"table","gn":"The BY MOMENT table","gp":null,"name":"the heads, scrolled","tag":null,"ex":"On POST /cooking/sessions the table is tall, so scrolled down you read cells far below the heads, and the heads either ride along under the pinned row or stay behind at the top.","exSay":"On the request that starts a cooking session the table is tall, so scrolled down you read cells far below the heads, and the heads either ride along under the pinned row or stay behind at the top.","imp":{"ride":"Keeps the stage band and the moment heads in view under the pinned row while the table scrolls past.","stay":"Leaves the heads at the table's top, so scrolled down you see only the pinned row's heads."},"impSay":"Pick ride under the pinned row and it keeps the stage band and the moment heads in view under the pinned row while the table scrolls past; pick stay at the top and it leaves the heads at the table's top, so scrolled down you see only the pinned row's heads.","parts":["You scroll down the request that starts a cooking session and read cells far below their column heads, and the heads still in view belong to the row pinned at the top, not to this table. You read a step under the wrong head.","It is like the sign at the end of a long library aisle, which you can no longer see once you walk down the shelves, unless a copy of it rides along beside you.","One click of yours, since both are built, and heads that ride along keep the stage band in view under the pinned row, at the cost of a strip of screen height.","Scrolled down, you keep reading cells under the pinned row's heads instead of this table's.","You choose between ride under the pinned row or stay at the top.","You already ruled it, as ride under the pinned row."],"opts":{"ride":"ride under the pinned row","stay":"stay at the top"},"plain":"The headings above the table when you scroll down — they can follow you down the screen or stay at the top.","si":3},{"key":"mo.gdl","id":"mo.gdl","sec":"calls","gk":"row","gn":"Each row","gp":null,"name":"the gates","tag":"Gates and decisions","ex":"On POST /cooking/sessions the function start_session holds 3 checks and 2 forks, and the look decides whether its name repeats on each gate, stands once as a head over them, or sits in a column beside them.","exSay":"On the request that starts a cooking session the function start session holds three checks and two forks, and the look decides whether its name repeats on each gate, stands once as a head over them, or sits in a column beside them.","imp":{"chain":"Draws each gate as one chip with its function, condition and effect, so the function's name repeats on every gate.","head":"Draws the function once as a head with its gates listed under it, so the row is shorter.","cols":"Draws each gate as a row of function, condition and effect side by side, so the effects line up."},"impSay":"Pick one chain per gate and it draws each gate as one chip with its function, condition and effect, so the function's name repeats on every gate; pick the function with its gates under it and it draws the function once as a head with its gates listed under it, so the row is shorter; pick a row of parts side by side and it draws each gate as a row of function, condition and effect side by side, so the effects line up.","parts":["On the request that starts a cooking session one function holds three checks and two forks, and the small labels either repeat the function's name or hide it. You cannot tell which function a condition belongs to, or what its result does.","It is like a pre-flight checklist, where the name of whoever does a check can repeat on every line, stand once at the top, or sit in a column beside the check.","One click of yours, since every look is built, and the repeated name makes each label long, the head makes the row short, and the columns line the effects up.","Check labels keep leaving you to guess which function evaluates the condition and what its result does.","You choose between one chain per gate, the function with its gates under it or a row of parts side by side.","You already ruled it, as the function with its gates under it."],"opts":{"chain":"one chain per gate","head":"the function with its gates under it","cols":"a row of parts side by side"},"plain":"The shape of a gate — one chip each, a function with its gates listed under it, or a row of side-by-side parts.","si":3},{"key":"mo.gef","id":"mo.gef","sec":"calls","gk":"row","gn":"Each row","gp":null,"name":"the effect","tag":"Gates and decisions","ex":"On POST /cooking/sessions the sensitive rate limit ends in a 429 refusal, and the look shows that status in its own colour with the edge stage lit, or as a band in the colour of the edge stage.","exSay":"On the request that starts a cooking session the sensitive rate limit ends in a too-many-requests refusal, and the look shows that status in its own colour with the edge stage lit, or as a band in the colour of the edge stage.","imp":{"end":"Colours the effect by the ending's status and lights the stage it leaves from on a small spine.","stage":"Colours the effect by the stage it leaves from, which adds a stage palette to the page."},"impSay":"Pick the ending colour with the stage lit and it colours the effect by the ending's status and lights the stage it leaves from on a small spine; pick a colour per stage and it colours the effect by the stage it leaves from, which adds a stage palette to the page.","parts":["On the request that starts a cooking session the sensitive rate limit ends in a too-many-requests refusal, and its label is coloured by one rule or another. You read the colour and do not know whether it names the answer or the stage the request had reached.","It is like an assembly line that paints a rejected part, where the paint can say how the part ended, accepted or rejected, or at which station it was stopped.","One click of yours, since both are built, and a colour for each stage adds a stage palette to the page, a new set of colours to learn.","A check's colour keeps meaning whatever the last builder meant by it, and you keep asking which.","You choose between the ending colour with the stage lit or a colour per stage.","You already ruled it, as the ending colour with the stage lit."],"opts":{"end":"the ending colour with the stage lit","stage":"a colour per stage"},"plain":"The colour on the end of a gate — the colour of the answer it gives, or the colour of the stage it leaves from.","si":3},{"key":"mo.gic","id":"mo.gic","sec":"calls","gk":"row","gn":"Each row","gp":null,"name":"gate icons","tag":"Gates and decisions","ex":"On POST /cooking/sessions the gates are of 5 kinds, rate limits, checks, forks, catches and switches, and the look decides whether each kind wears an icon of its own.","exSay":"On the request that starts a cooking session the gates are of five kinds, rate limits, checks, forks, catches and switches, and the look decides whether each kind wears an icon of its own.","imp":{"each":"Gives each of the 5 kinds an icon of its own, so a rate limit and a check differ at a glance.","one":"Gives every gate the same icon, so only the label at its end tells the kinds apart.","none":"Draws gates with no icon, as before."},"impSay":"Pick an icon per kind and it gives each of the five kinds an icon of its own, so a rate limit and a check differ at a glance; pick one gate icon and it gives every gate the same icon, so only the label at its end tells the kinds apart; pick no icon and it draws gates with no icon, as before.","parts":["On the request that starts a cooking session the places that check something and decide what happens next are of five kinds, rate limits, checks, forks, catches and switches, and their labels look alike. You scan the row and cannot tell which kind you are pointing at without opening it.","It is like the lanes at airport check-in, where each lane can wear its own sign, all lanes can wear the same sign, or none can wear one and you ask the person at the front.","One click of yours, since every look is built, and an icon for each of the five kinds is five marks to learn, said once in the key.","The labels keep looking alike, and you keep opening them to tell the kinds apart.","You choose between an icon per kind, one gate icon or no icon.","You already ruled it, as an icon per kind."],"opts":{"each":"an icon per kind","one":"one gate icon","none":"no icon"},"plain":"The little picture on each gate — one for every kind of gate, the same one for all, or none.","si":3},{"key":"mo.grl","id":"mo.grl","sec":"calls","gk":"row","gn":"Each row","gp":null,"name":"gate roles","tag":"Gates and decisions","ex":"On POST /cooking/sessions the label at the end of the sensitive rate limit would read app-wide, or refuses, or nothing, and a check like the missing recipe one would read not found only if you choose what it guards.","exSay":"On the request that starts a cooking session the label at the end of the sensitive rate limit would read app-wide, or refuses, or nothing, and a check like the missing recipe one would read not found only if you choose what it guards.","imp":{"where":"Labels each gate by where it decides, app-wide, at login, in a dependency, in the handler or inside a call.","what":"Labels each gate by what it does, refuses, translates, routes, passes on or swallows.","guards":"Labels a check by what its refusal means, such as bad input or not found, and leaves other gates without a label.","off":"Takes the role label off every gate."},"impSay":"Pick where it decides and it labels each gate by where it decides, app-wide, at login, in a dependency, in the handler or inside a call; pick what it does and it labels each gate by what it does, refuses, translates, routes, passes on or swallows; pick what it guards and it labels a check by what its refusal means, such as bad input or not found, and leaves other gates without a label; pick no label and it takes the role label off every gate.","parts":["On the request that starts a cooking session a label for a check says which function it lives in but not at which level it decides, at login, in a dependency, in the handler or inside a call. You see it and cannot tell how much of the request it can stop.","It is like a hospital triage tag, which can say where the patient was found, what was done or what the patient may do next, and a nurse acts on each differently.","One click of yours, since every look is built, and each label adds a word to every check and to the key, while a label of what it guards names only the checks.","A check keeps showing only its function, so you cannot say how much of the request it can stop.","You choose between where it decides, what it does, what it guards or no label.","You already ruled it, as where it decides."],"opts":{"where":"where it decides","what":"what it does","guards":"what it guards","off":"no label"},"plain":"The short label at a gate's end — it says where the gate decides, what it does or what it guards, or nothing at all.","si":3},{"key":"mo.fnm","id":"mo.fnm","sec":"calls","gk":"row","gn":"Each row","gp":null,"name":"function marks","tag":"Functions","ex":"On POST /cooking/sessions the function start_session would show the 404 and 409 answers its own code decides, and R or W for each table it reads or writes, or only its name and role.","exSay":"On the request that starts a cooking session the function start session would show the not-found and conflict answers its own code decides, and R or W for each table it reads or writes, or only its name and role.","imp":{"on":"Shows the statuses a function decides and R or W for each table it touches, so a chip is taller and says more.","off":"Shows only a function's name and role, so the row is lighter."},"impSay":"Pick what it decides and touches and it shows the statuses a function decides and R or W for each table it touches, so a chip is taller and says more; pick name and role only and it shows only a function's name and role, so the row is lighter.","parts":["On the request that starts a cooking session the function that does the work decides a not-found and a conflict answer and touches tables, but its label shows only a name and a role. You cannot tell what it does without opening the code.","It is like a recipe card for one step, which with only the step's name and the cook's title cannot say what it takes from the pantry and puts back unless the card lists it.","One click of yours, since both are built, and each function label grows taller with its answers and its read and write marks, so the row is heavier to read.","Function labels keep naming only a name and a role, and you keep opening the code to find what they touch.","You choose between what it decides and touches or name and role only.","You already ruled it, as what it decides and touches."],"opts":{"on":"what it decides and touches","off":"name and role only"},"plain":"The marks on a function's chip — they show the answers it decides and the tables it touches, or only its name and role.","si":3},{"key":"mo.std","id":"mo.std","sec":"calls","gk":"row","gn":"Each row","gp":null,"name":"standard or specialist","tag":"Gates and decisions · Standard or specialist","ex":"On POST /cooking/sessions a setting that turns a check on or off is the norm, on 79 of 80 endpoints, while reading a repeat key is rare, on 6, and the look decides where those kinds of piece stand.","exSay":"On the request that starts a cooking session a setting that turns a check on or off is the norm, on seventy nine of eighty endpoints, while reading a repeat key is rare, on six, and the look decides where those kinds of piece stand.","imp":{"split":"Moves a switch beside what it switches and turns a rare piece into a label on the item it names, and the row leaves the table.","merge":"Moves every item of the row into Gates and decisions as it is, and the row leaves the table.","keep":"Keeps the row in lanes, one for what the server's settings switch and one for what is rare here."},"impSay":"Pick split into the gates and it moves a switch beside what it switches and turns a rare piece into a label on the item it names, and the row leaves the table; pick merge into the gates and it moves every item of the row into Gates and decisions as it is, and the row leaves the table; pick keep the row and it keeps the row in lanes, one for what the server's settings switch and one for what is rare here.","parts":["On the request that starts a cooking session one row lists a setting that switches a check on or off, found on seventy nine of eighty endpoints, beside pieces only a few endpoints have. You read the row and cannot tell whether it stands for a norm or an exception.","It is like a restaurant with house rules every dish follows and a board of specials only a few dishes have, and you can pin each rule beside its step or keep the board apart.","One click of yours, since every look is built, and splitting or merging takes the row out of the table while keeping it leaves the row in lanes.","The row keeps mixing a norm with a rarity under one name, and you keep asking what it stands for.","You choose between split into the gates, merge into the gates or keep the row.","You already ruled it, as split into the gates."],"opts":{"split":"split into the gates","merge":"merge into the gates","keep":"keep the row"},"plain":"The row that shows what every endpoint has and what only this one has — it can split into the gates, merge into them, or stay a row.","si":3},{"key":"mo.dfx","id":"mo.dfx","sec":"calls","gk":"row","gn":"Each row","gp":null,"name":"data effects","tag":"Data effects","ex":"On POST /cooking/sessions the data row touches 14 tables and the handler's own code writes 2 of them, and the look decides whether you read that as chips, as a small map in each moment, or as one map for the whole endpoint.","exSay":"On the request that starts a cooking session the data row touches fourteen tables and the handler's own code writes two of them, and the look decides whether you read that as chips, as a small map in each moment, or as one map for the whole endpoint.","imp":{"chips":"Draws one chip per read or write at its moment, with the table and R or W, and keeps the function in its hover.","cell":"Draws a small map inside each moment's cell, from its functions to the tables they touch.","one":"Draws one map under the row for the whole endpoint, in the order data is first touched, and the cells only count."},"impSay":"Pick chips and it draws one chip per read or write at its moment, with the table and R or W, and keeps the function in its hover; pick a small map per moment and it draws a small map inside each moment's cell, from its functions to the tables they touch; pick one map for the endpoint and it draws one map under the row for the whole endpoint, in the order data is first touched, and the cells only count.","parts":["On the request that starts a cooking session the data row touches fourteen tables and the handler's own code writes two of them, but it lists the tables with a read or write mark and never says which function does which. You cannot follow a function to the table it changes.","It is like a transit system, where a list of stations says where you can go but not how, until someone draws a map of each district or one map of the whole trip.","One click of yours, since every look is built, and a map in each step makes every cell taller while one map for the endpoint leaves the cells to count only.","The row keeps listing tables with no line from the function that touches them, and you keep tracing that link in your head.","You choose between chips, a small map per moment or one map for the endpoint.","You already ruled it, as a small map per moment."],"opts":{"chips":"chips","cell":"a small map per moment","one":"one map for the endpoint"},"plain":"How the data row shows which function touches which table — as chips, as a small map in each moment, or as one map for the endpoint.","si":3},{"key":"mo.dxc","id":"mo.dxc","sec":"calls","gk":"row","gn":"Each row","gp":null,"name":"write colour","tag":"Data effects","ex":"On POST /cooking/sessions start_session reads the session and then writes it, so its link draws both colours, and the look decides whether a write is orange or red.","exSay":"On the request that starts a cooking session start session reads the session and then writes it, so its link draws both colours, and the look decides whether a write is orange or red.","imp":{"page":"Keeps the page's colours, reads green, writes orange and both amber, beside the station's red for a function that touches the store.","his":"Switches to your words' colours, writes red, reads green and both orange, so red is also the accessor label's colour beside a function."},"impSay":"Pick the page's colours and it keeps the page's colours, reads green, writes orange and both amber, beside the station's red for a function that touches the store; pick your words' colours and it switches to your words' colours, writes red, reads green and both orange, so red is also the accessor label's colour beside a function.","parts":["On the request that starts a cooking session the function that does the work reads the session and then writes it, and you asked for writes in red. The page draws them orange, and the Gabe Universe, the map of the code, already uses red for another mark beside a function.","It is like the colour-coded tags on airport luggage, where red already means fragile, so when red also marks priority bags the handler has to read each tag to know which red it is.","One click of yours, since both are built, and your colours make red mean both a write and that other mark beside a function.","Writes keep their own orange, a colour for writes that you did not choose.","You choose between the page's colours or your words' colours.","You already ruled it, as the page's colours."],"opts":{"page":"the page's colours","his":"your words' colours"},"plain":"The colours for reading and writing data — the page's own, or the ones you named, with red for a write.","si":3},{"key":"mo.jyb","id":"mo.jyb","sec":"calls","gk":"row","gn":"Each row","gp":null,"name":"a test's earlier requests","tag":"Proof","ex":"On POST /cooking/sessions 4 tests send requests before they call it, up to 2 each, and the look decides whether those earlier requests get a moment of their own in the Proof row or sit in its head.","exSay":"On the request that starts a cooking session four tests send requests before they call it, up to two each, and the look decides whether those earlier requests get a moment of their own in the Proof row or sit in its head.","imp":{"prior":"Gives the earlier requests a moment of their own before the request is sent, apart from the server starting.","head":"Moves them into the Proof row's head, out of the moments, since a test's earlier requests are no time of this request."},"impSay":"Pick their own moment and it gives the earlier requests a moment of their own before the request is sent, apart from the server starting; pick in Proof's head and it moves them into the Proof row's head, out of the moments, since a test's earlier requests are no time of this request.","parts":["On the request that starts a cooking session four tests send requests before they call it, up to two each, and the proof row mixes those earlier requests in with the steps of this one. A test's past reads as part of this request's time.","It is like a recipe that says marinate overnight, where the marinade can get a line before the cooking starts or be folded into the dish's title, since it is no time of the cooking.","One click of yours, since both are built, and a step of their own adds a column before the request while the heading option adds only a line in the head.","Earlier requests keep standing among the steps, and you keep reading a test's past as part of the request's time.","You choose between their own moment or in Proof's head.","You already ruled it, as their own moment."],"opts":{"prior":"their own moment","head":"in Proof's head"},"plain":"Where a test's earlier requests stand in the proof row — as a moment of their own, or up in the row's heading.","si":3},{"key":"mo.ifl","id":"mo.ifl","sec":"calls","gk":"row","gn":"Each row","gp":null,"name":"in-flight values","tag":"In-flight state","ex":"On POST /cooking/sessions 10 values are alive while the request runs, 3 that go with the answer, such as idempotency_key, and 7 that the server keeps, such as the rate limit counters, and the look decides how their reads show.","exSay":"On the request that starts a cooking session ten values are alive while the request runs, three that go with the answer, such as idempotency key, and seven that the server keeps, such as the rate limit counters, and the look decides how their reads show.","imp":{"chips":"Draws one chip per value at the moment it is set, and nothing for its reads.","lane":"Draws one lane per value across the moments, with a dot where it is read and a cross at the answer, and folds values set and read alike into one lane.","echo":"Keeps the chip where the value is set and adds a small echo at each moment that reads it, with what that read can decide."},"impSay":"Pick chips where set and it draws one chip per value at the moment it is set, and nothing for its reads; pick a lifeline each and it draws one lane per value across the moments, with a dot where it is read and a cross at the answer, and folds values set and read alike into one lane; pick echoes where read and it keeps the chip where the value is set and adds a small echo at each moment that reads it, with what that read can decide.","parts":["On the request that starts a cooking session ten values are alive while the request runs, three that go with the answer and seven that the server keeps. A label at the step where a value is set shows nothing about where it is read or what that read decides.","It is like tracking a parcel, where you can show only where it was sent, its whole journey with a dot at every scan, or an echo at each stop that read the label.","One click of yours, since every look is built, and a lifeline for each value makes the row taller while echoes add a small mark at every step that reads it.","A value keeps showing only where it is set, and you keep guessing what it affects.","You choose between chips where set, a lifeline each or echoes where read.","You already ruled it, as a lifeline each."],"opts":{"chips":"chips where set","lane":"a lifeline each","echo":"echoes where read"},"plain":"How a value that lives while the request runs is drawn — as a chip where it is set, as a lifeline across the moments, or as echoes where it is read.","si":3},{"key":"mo.secmv","id":"mo.secmv","sec":"calls","gk":"row","gn":"Each row","gp":null,"name":"security facts that live elsewhere","tag":"Security","ex":"On POST /cooking/sessions the Security row holds 3 middleware in the order they run, 2 check switches, 2 allowed origins and 2 secrets, and the look decides whether the 22 facts that live in other rows, such as the login check and the rate limit, show there as 12 short marks or move in.","exSay":"On the request that starts a cooking session the Security row holds three middleware in the order they run, two check switches, two allowed origins and two secrets, and the look decides whether the twenty two facts that live in other rows, such as the login check and the rate limit, show there as twelve short marks or move in.","imp":{"marks":"Draws 12 short marks in Security, each naming a fact and the row that holds it, and leaves all 22 facts in their own rows, in full.","moved":"Moves all 22 facts into Security, in full, and the 4 rows they came from no longer draw them, so Security grows taller and those rows shorter."},"impSay":"Pick marks to their home row and it draws twelve short marks in Security, each naming a fact and the row that holds it, and leaves all twenty two facts in their own rows, in full; pick moved into Security and it moves all twenty two facts into Security, in full, and the four rows they came from no longer draw them, so Security grows taller and those rows shorter.","parts":["On the request that starts a cooking session the Security row holds three middleware, two check switches, two allowed origins and two secrets, but twenty two other security facts, such as the login check and the rate limit, stand in other rows. To see all that guards the request you read the Security row and then walk to those rows.","It is like the security checkpoint in an airport, where the rules of check-in and boarding can be pointed to by a sign at the checkpoint, or moved there so every rule is read at one stop.","One click of yours, since both are mit middleware twice, as its numbered chip in the run order and as the head of the card that holds its switch, which is how the row drew it before.","parts":["On the request that starts a cooking session the Security row draws rate limit middleware twice at the edge, once as middleware number two in the run order and again as the head of the card that holds its switch. You read the same name twice and have to work out that it is one thing.","It is like a checklist that names a step in its numbered list and then names the same step again as the heading of a box under it that holds the tools it uses, so a single step reads as a pair.","One click of yours, since both are built, and merging puts the switch inside its numbered chip while apart leaves the chip and the card as they stood.","Merged stays my pick and never a ruling, so the page keeps drawing the middleware once until you say otherwise.","You choose between switch inside its middleware or chip and card apart.","My pick is switch inside its middleware, and it is not a ruling."],"opts":{"merged":"switch inside its middleware","apart":"chip and card apart"},"plain":"Whether a middleware that holds a switch stands once, with its switch inside its numbered chip, or twice, as a chip and again as the head of the switch's card.","si":3},{"key":"ex.lay","id":"ex.lay","sec":"calls","gk":"bench","gn":"The bench","gp":null,"name":"the columns","tag":null,"ex":"On the bench, the 8 kinds (ending, table, schema, function, test, gate, client hook and in-flight value) show their columns for POST /cooking/sessions, and the look decides whether they stand in one row, wrap, or split into an upper and a lower row.","exSay":"On the bench, the eight kinds, ending, table, schema, function, test, gate, client hook and in-flight value, show their columns for the request that starts a cooking session, and the look decides whether they stand in one row, wrap, or split into an upper and a lower row.","imp":{"row":"Puts all 8 columns side

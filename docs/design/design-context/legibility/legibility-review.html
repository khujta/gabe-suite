<title>Legibility Review</title>

<style>
  /* ── font roster (H3) — the script keeps these in sync ─────────────── */
  :root { --af-stack: ui-monospace, monospace; --af-size: 15px; --af-track: -0.025em; }

  /* ── title face (H3) — ONLY the section title pills pin a face: a modern
        condensed grotesque, set in caps. DIN lineage, so it reads as console
        lettering rather than book type, and it holds a long title in a pill
        without wrapping. Locally resolvable in order — Bahnschrift ships with
        Windows 10+, DIN Alternate with macOS — so nothing routes through a
        blocked webfont. Every OTHER title on the page stays in the body face:
        one distinctive treatment, or the distinction is worthless. */
  :root {
    --af-title: "Bahnschrift", "DIN Alternate", "Roboto Condensed",
                "Arial Narrow", ui-sans-serif, system-ui, sans-serif;
  }

  /* ── the legibility floor (H6) — the smallest text on a page is the text
        most often unreadable. Secondary content sizes off THESE steps, never
        below them: at the 15px base they compute to 13.8 / 12.8 / 12.3px.
        They are calc() off the roster base, NOT bare `em`, because `em`
        stacks: a .855em head inside a .92em table lands at 11.8px while both
        authored values look safe. An absolute step cannot compound. */
  :root {
    --fs-sm:  calc(var(--af-size) * 0.92);
    --fs-xs:  calc(var(--af-size) * 0.855);
    --fs-min: calc(var(--af-size) * 0.82);
  }

  /* ══ skins (H5) — chrome only: ground, ink, rules, accent, geometry.
        Sources: Catalog = docs/site/center/assets/a3.css · Blueprint = skin F ·
        Mission Console = skin B (output/mockups/center-skins.css). B and F are
        spec'd light-only; their dark arms are derived so the viewer's theme
        toggle still answers. Chart series and status colours are NEVER themed. */

  /* ── Catalog · cool developer portal (default) ── */
  :root, :root[data-skin="catalog"] {
    --ground:#f6f7f9; --card:#ffffff; --raised:#fbfcfd;
    --ink:#141a24; --ink-soft:#3d4756; --muted:#7a8595;
    --rule:#e7e9ee; --rule-soft:#eef0f4;
    --accent:#4f46e5; --accent-soft:#eef0fe; --strong:#101726;
    --radius:10px; --rail:5px;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 4px 14px rgba(16,24,40,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]), :root[data-skin="catalog"]:not([data-theme="light"]) {
      --ground:#101726; --card:#1b2436; --raised:#212b40;
      --ink:#e7ebf3; --ink-soft:#c7cfdd; --muted:#79839a;
      --rule:#2c3648; --rule-soft:#232d3f;
      --accent:#8b83f5; --accent-soft:#23214a; --strong:#c7cfdd;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"], :root[data-skin="catalog"][data-theme="dark"] {
    --ground:#101726; --card:#1b2436; --raised:#212b40;
    --ink:#e7ebf3; --ink-soft:#c7cfdd; --muted:#79839a;
    --rule:#2c3648; --rule-soft:#232d3f;
    --accent:#8b83f5; --accent-soft:#23214a; --strong:#c7cfdd;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.9);
  }
  :root[data-skin="catalog"][data-theme="light"] {
    --ground:#f6f7f9; --card:#ffffff; --raised:#fbfcfd;
    --ink:#141a24; --ink-soft:#3d4756; --muted:#7a8595;
    --rule:#e7e9ee; --rule-soft:#eef0f4; --accent:#4f46e5; --accent-soft:#eef0fe;
    --strong:#101726;
  }

  /* ── Blueprint · skin F, blue ink ── */
  :root[data-skin="blueprint"] {
    --ground:#f6f8fc; --card:#fdfeff; --raised:#f1f5fd;
    --ink:#16233b; --ink-soft:#41547a; --muted:#8494b5;
    --rule:#c3d0f0; --rule-soft:#dde5f8;
    --accent:#1d4ed8; --accent-soft:#e4ecfe; --strong:#16233b;
    --radius:6px; --rail:5px; --shadow:none;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-skin="blueprint"]:not([data-theme="light"]) {
      --ground:#0b1220; --card:#101a2e; --raised:#142138;
      --ink:#dce6fa; --ink-soft:#a8bce4; --muted:#7286b0;
      --rule:#23375f; --rule-soft:#1a2942;
      --accent:#6f9bff; --accent-soft:#16264a; --strong:#a8bce4; --shadow:none;
    }
  }
  :root[data-skin="blueprint"][data-theme="dark"] {
    --ground:#0b1220; --card:#101a2e; --raised:#142138;
    --ink:#dce6fa; --ink-soft:#a8bce4; --muted:#7286b0;
    --rule:#23375f; --rule-soft:#1a2942;
    --accent:#6f9bff; --accent-soft:#16264a; --strong:#a8bce4; --shadow:none;
  }
  :root[data-skin="blueprint"][data-theme="light"] {
    --ground:#f6f8fc; --card:#fdfeff; --raised:#f1f5fd;
    --ink:#16233b; --ink-soft:#41547a; --muted:#8494b5;
    --rule:#c3d0f0; --rule-soft:#dde5f8; --accent:#1d4ed8; --accent-soft:#e4ecfe;
    --strong:#16233b;
  }

  /* ── Mission Console · skin B, teal ops console ── */
  :root[data-skin="mission"] {
    --ground:#eef1f4; --card:#ffffff; --raised:#f6f8fa;
    --ink:#1a2b36; --ink-soft:#4a6272; --muted:#7d92a0;
    --rule:#c8d4dc; --rule-soft:#e2e9ee;
    --accent:#0e7c8c; --accent-soft:#e0f1f4; --strong:#1a2b36;
    --radius:4px; --rail:5px; --shadow:none;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-skin="mission"]:not([data-theme="light"]) {
      --ground:#0e161c; --card:#16222b; --raised:#1b2934;
      --ink:#e3edf3; --ink-soft:#b3c6d2; --muted:#7d92a0;
      --rule:#27394a; --rule-soft:#1e2c39;
      --accent:#2ba7bb; --accent-soft:#0f3038; --strong:#b3c6d2; --shadow:none;
    }
  }
  :root[data-skin="mission"][data-theme="dark"] {
    --ground:#0e161c; --card:#16222b; --raised:#1b2934;
    --ink:#e3edf3; --ink-soft:#b3c6d2; --muted:#7d92a0;
    --rule:#27394a; --rule-soft:#1e2c39;
    --accent:#2ba7bb; --accent-soft:#0f3038; --strong:#b3c6d2; --shadow:none;
  }
  :root[data-skin="mission"][data-theme="light"] {
    --ground:#eef1f4; --card:#ffffff; --raised:#f6f8fa;
    --ink:#1a2b36; --ink-soft:#4a6272; --muted:#7d92a0;
    --rule:#c8d4dc; --rule-soft:#e2e9ee; --accent:#0e7c8c; --accent-soft:#e0f1f4;
    --strong:#1a2b36;
  }

  /* ══ section blocks — page furniture, deliberately OUTSIDE the series and
        status palettes so a section header can never be mistaken for data. */
  :root {
    --sec1:#2b3a55; --sec2:#2f4858; --sec3:#1f5453; --sec4:#2e5339;
    --sec5:#5a4a2b; --sec6:#5c3340; --sec7:#4a3560; --sec8:#33415c;
    --sec9:#6b3f2e;
    --sec-ink:#f7f8fa;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sec1:#9fb4d6; --sec2:#a3bfcd; --sec3:#8fc9c4; --sec4:#a8cfa6;
      --sec5:#d8c48d; --sec6:#d9a3b0; --sec7:#bda8dd; --sec8:#a6b6d9;
      --sec9:#e3ab8f;
      --sec-ink:#111722;
    }
  }
  :root[data-theme="dark"] {
    --sec1:#9fb4d6; --sec2:#a3bfcd; --sec3:#8fc9c4; --sec4:#a8cfa6;
    --sec5:#d8c48d; --sec6:#d9a3b0; --sec7:#bda8dd; --sec8:#a6b6d9;
    --sec9:#e3ab8f;
    --sec-ink:#111722;
  }
  :root[data-theme="light"] {
    --sec1:#2b3a55; --sec2:#2f4858; --sec3:#1f5453; --sec4:#2e5339;
    --sec5:#5a4a2b; --sec6:#5c3340; --sec7:#4a3560; --sec8:#33415c;
    --sec9:#6b3f2e;
    --sec-ink:#f7f8fa;
  }

  /* ── chart series + status — never themed, validated (dataviz skill) ── */
  :root {
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; }
  }
  :root[data-theme="dark"] { --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; }

  /* ══ the page: content anchored LEFT, never centred (H1) ═══════════ */
  body {
    background: var(--ground); color: var(--ink);
    font-family: var(--af-stack); font-size: var(--af-size); letter-spacing: var(--af-track);
    line-height: 1.55; text-align: left; -webkit-font-smoothing: antialiased;
  }
  /* ── scrollbars wear the skin ────────────────────────────────────────
     A native scrollbar is the one piece of chrome the page does not own by
     default, and it shows: a grey OS bar with stepper arrows sitting inside a
     dark panel reads as a rendering fault, not as a control. Both engines are
     addressed (Firefox takes the two `scrollbar-*` properties, WebKit/Blink the
     pseudo-elements), the thumb is mixed from the skin's own accent so it moves
     with the theme, and the stepper arrows are removed — a scroll bar is a
     position indicator, not a set of buttons anyone clicks. */
  :root {
    --sb-thumb: color-mix(in srgb, var(--accent) 42%, var(--rule));
    scrollbar-width: thin;
    scrollbar-color: var(--sb-thumb) var(--rule-soft);
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--rule-soft); border-radius: 999px; }
  ::-webkit-scrollbar-thumb {
    background: var(--sb-thumb); border-radius: 999px;
    border: 2px solid transparent; background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); background-clip: padding-box; }
  ::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
  ::-webkit-scrollbar-corner { background: transparent; }

  .artifact-page {
    max-width: 74rem;
    margin: 0 auto 0 clamp(16px, 4vw, 56px);   /* left-anchored, never `margin: 0 auto` */
    padding: 32px 24px 48px;
    display: flex; flex-direction: column; gap: 30px;
    text-align: left;
  }
  .artifact-page > :first-child { padding-right: 56px; }   /* clear of the fixed cog */
  :is(a, button, select, input, textarea, summary):focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px;
  }
  p { margin: 0; }

  /* ══ the two devices (H5) — every skin, every section ══════════════ */
  .sec { display: flex; flex-direction: column; gap: 14px; }
  .sec-head { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--rule); padding-bottom: 8px; }
  .sec-head .n { margin-left: auto; font-size: var(--fs-min); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  /* Title = normal-size text in a PILL that hugs it, led by an icon.
     Prominence is the background and the icon, never the type: no uppercase,
     no tracking, no size bump. The pill's padding stays tight — a wide slab
     reads as a banner and competes with the content it introduces. */
  .sec-head h2 {
    margin: 0; background: var(--sec, var(--strong)); color: var(--sec-ink, var(--ground));
    padding: 2px 11px 2px 9px; border-radius: 999px;
    font-family: var(--af-title);
    font-size: 1em; font-weight: 600; letter-spacing: .045em; text-transform: uppercase;
    line-height: 1.34;
    display: inline-flex; align-items: center; gap: 7px;
  }
  /* Every title carries an icon (H6). Lucide geometry, inlined — the CSP
     blocks icon CDNs, and an icon font would fall back silently. */
  .sec-head h2 svg {
    width: 1.02em; height: 1.02em; flex: 0 0 auto;
    fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .sec[data-sec="1"] { --sec: var(--sec1); } .sec[data-sec="2"] { --sec: var(--sec2); }
  .sec[data-sec="3"] { --sec: var(--sec3); } .sec[data-sec="4"] { --sec: var(--sec4); }
  .sec[data-sec="5"] { --sec: var(--sec5); } .sec[data-sec="6"] { --sec: var(--sec6); }
  .sec[data-sec="7"] { --sec: var(--sec7); } .sec[data-sec="8"] { --sec: var(--sec8); }
  .sec[data-sec="9"] { --sec: var(--sec9); }

  .panel {
    background: var(--card); border: 1px solid var(--rule);
    border-radius: var(--radius, 10px); padding: 15px;
    display: flex; flex-direction: column; gap: 12px;
  }
  /* :root prefix so the rail beats the `border:` shorthand above at equal
     specificity — without it the rail silently renders at 1px. */
  :root .panel { border-left: var(--rail) solid var(--accent); }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; align-items: start; }

  /* ══ cog + options panel (H2 — the only floating affordance) ═══════ */
  .af-chrome { position: fixed; top: 14px; right: 14px; z-index: 200; }
  .af-cog {
    display: grid; place-items: center; width: 38px; height: 38px;
    background: var(--card); color: var(--muted);
    border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow);
    cursor: pointer; transition: color .15s ease, border-color .15s ease, transform .25s ease;
  }
  .af-cog:hover { color: var(--accent); border-color: var(--accent); }
  .af-cog[aria-expanded="true"] { color: var(--accent); border-color: var(--accent); transform: rotate(45deg); }
  .af-cog svg { width: 18px; height: 18px; display: block; }
  .af-panel {
    position: absolute; top: 46px; right: 0; width: 262px;
    background: var(--card); border: 1px solid var(--rule); border-radius: 12px;
    box-shadow: var(--shadow); padding: 14px;
    display: none; flex-direction: column; gap: 11px; max-height: 82vh; overflow-y: auto;
  }
  .af-panel[data-open="true"] { display: flex; }
  .af-group { display: flex; flex-direction: column; gap: 7px; }
  .af-legend { font-size: .72em; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .af-opt {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    width: 100%; text-align: left; cursor: pointer; font-family: inherit;
    background: var(--raised); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 8px; padding: 8px 11px;
  }
  .af-opt:hover { border-color: var(--accent); }
  .af-opt[aria-checked="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .af-opt .af-name { font-size: 14px; line-height: 1.2; }
  .af-opt .af-spec { font-size: 12px; color: var(--muted); letter-spacing: 0; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .af-opt[aria-checked="true"] .af-spec { color: var(--accent); }
  .af-foot { font-size: 12px; color: var(--muted); margin: 0; letter-spacing: 0; }
  .af-divider { height: 1px; background: var(--rule-soft); }

  /* motion primitives — global pause is wired to this attribute */
  :root[data-motion="off"] *, :root[data-motion="off"] *::before { animation-play-state: paused !important; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
<style>
  /* ══ the page's own rules — the kit block above is pasted verbatim by gen-legibility-review.mjs ══
     No motion (the kit's Motion group is dropped), no hovers (every word is on the face), the 12px floor: every size below is
     one of the kit's --fs-* steps, which are absolute (computed from the roster's base), so nesting never shrinks them. */
  .artifact-page { margin: 0 auto; max-width: min(96vw, 1800px); box-sizing: border-box; }   /* operator rule: an artifact's column is centred; L-24: and it takes the screen's width, so a table has room for a row on one line */
  :root { --ok: #2f9e44; --warn: #e8890c; --bad: #e03131; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ok: #69db7c; --warn: #f0a23a; --bad: #ff6b6b; } }
  :root[data-theme="dark"] { --ok: #69db7c; --warn: #f0a23a; --bad: #ff6b6b; }
  .eyebrow { font-size: var(--fs-min); letter-spacing: .18em; text-transform: uppercase; color: var(--accent); margin: 0; }
  h1 { font-size: 2em; line-height: 1.15; margin: 8px 0 0; text-wrap: balance; }
  h3 { margin: 0; font-size: 1.05em; text-wrap: balance; }
  h4 { margin: 0; font-size: 1em; }
  .lede { color: var(--ink-soft); max-width: 110ch; margin: 12px 0 0; }
  .cap { font-size: var(--fs-sm); color: var(--ink-soft); margin: 0; max-width: 112ch; }
  .take { font-size: var(--fs-sm); color: var(--ink); margin: 2px 0 0; border-left: 3px solid var(--accent); padding: 4px 0 4px 11px; max-width: 112ch; }
  .sec-head { flex-wrap: wrap; }
  .sec-head .n { flex: 0 1 auto; min-width: 0; font-variant-numeric: tabular-nums; }
  .body { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .lab { font-size: var(--fs-min); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 14px; align-items: start; }

  .key { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; font-size: var(--fs-sm); color: var(--ink-soft); margin-top: 14px; }
  .key span { display: inline-flex; align-items: center; gap: 7px; }
  .key .btn { pointer-events: none; }

  .btn { font: inherit; font-size: var(--fs-sm); letter-spacing: inherit; cursor: pointer; border-radius: 8px; padding: 5px 11px; border: 1px solid var(--rule); background: var(--raised); color: var(--ink); text-align: left; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn[data-mine="true"] { border: 1.5px dashed var(--accent); color: var(--accent); }                       /* dashed = my pick */
  .btn[aria-pressed="true"] { border: 1.5px solid var(--accent); background: var(--accent); color: var(--ground); }   /* filled = yours */
  .btn.pri { background: var(--accent); border-color: var(--accent); color: var(--ground); }
  .btn.nb { background: transparent; color: var(--ink-soft); font-size: var(--fs-xs); padding: 3px 9px; }
  .btn.nb[data-has="true"] { border-color: var(--accent); color: var(--accent); }
  .state { font-size: var(--fs-min); color: var(--muted); letter-spacing: .04em; }
  [data-state="yours"] > .verdict .state, [data-state="yours"] .state.top { color: var(--accent); }
  .verdict { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .note { font: inherit; letter-spacing: inherit; font-size: var(--fs-sm); color: var(--ink); background: var(--raised); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; width: 100%; box-sizing: border-box; resize: vertical; min-height: 2.6em; }
  .note[hidden] { display: none; }

  .chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .chip { font-size: var(--fs-min); color: var(--ink); border: 1px solid var(--rule); border-radius: 10px; padding: 0 9px; line-height: 1.7; background: var(--card); max-width: 100%; box-sizing: border-box; }   /* wraps at a space, never inside a word */
  .chip.acc { border-color: var(--accent); color: var(--accent); }
  .chip[data-o="fixed"], .chip[data-v="answered"], .chip[data-o="closed"] { border-color: var(--ok); color: var(--ok); }
  .chip[data-o="partly"], .chip[data-v="partly"] { border-color: var(--warn); color: var(--warn); }
  .chip[data-o="left"], .chip[data-v="not"], .chip[data-o="open"] { border-color: var(--bad); color: var(--bad); }
  .chip[data-o="his"] { border-color: var(--accent); color: var(--ground); background: var(--accent); }
  .chip.ic, a.chip.ref.ic { display: inline-flex; align-items: center; gap: 5px; }
  .chip.ic .mk { gap: 3px; }

  /* the marks (L-25): an inline-svg icon, its word in the hover and for a reader, colour for the state. The legend says each word once. */
  .ico { width: 1.15em; height: 1.15em; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .mk { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-soft); white-space: nowrap; vertical-align: middle; }
  .mk .ico { width: 1.25em; height: 1.25em; }
  .mk .n { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 650; }
  .mk[data-o="fixed"], .mk[data-o="down"], .mk[data-o="ruled"], .mk[data-o="question"] { color: var(--ok); }
  .mk[data-o="partly"], .mk[data-o="option"] { color: var(--warn); }
  .mk[data-o="left"], .mk[data-o="open"], .mk[data-o="up"] { color: var(--bad); }
  .mk[data-o="his"], .mk[data-o="mine"], .mk[data-o="yours"], .mk[data-o="land"], .mk[data-o="built"], .mk.pm { color: var(--accent); }
  .mk[data-o="logged"], .mk[data-o="deferred"], .mk[data-o="notyet"], .mk[data-o="same"], .mk.zero { color: var(--muted); }
  .mk.zero .n { color: var(--muted); font-weight: 400; }
  .marks { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; font-size: 1.1em; }
  .marks .mk .ico { width: 1.6em; height: 1.6em; }
  .chips.nw { flex-wrap: nowrap; }
  /* a stacked bar: one segment per outcome, widths by count (L-25) */
  .stk { display: inline-flex; width: 7.5rem; height: 12px; border-radius: 4px; overflow: hidden; border: 1px solid var(--rule); background: var(--rule-soft); vertical-align: middle; flex: 0 0 auto; }
  .stk.wide { display: flex; width: 100%; height: 18px; border-radius: 6px; }

    b.type = "button"; b.className = "af-opt";
    b.setAttribute("role", "radio"); b.setAttribute("data-id", item.id); b.setAttribute("aria-checked", "false");
    var n = document.createElement("span");
    n.className = "af-name"; n.textContent = item.label;
    if (item.stack) n.style.fontFamily = item.stack;      /* preview its own face */
    var s = document.createElement("span");
    s.className = "af-spec"; s.textContent = spec;
    b.appendChild(n); b.appendChild(s);
    b.addEventListener("click", function () { onPick(item.id); });
    host.appendChild(b);
  }
  function mark(host, id) {
    host.querySelectorAll(".af-opt").forEach(function (o) {
      o.setAttribute("aria-checked", String(o.getAttribute("data-id") === id));
    });
  }

  function applyFont(id) {
    var f = FONTS.filter(function (x) { return x.id === id; })[0] || FONTS[0];
    root.style.setProperty("--af-stack", f.stack);
    root.style.setProperty("--af-size", f.size + "px");
    root.style.setProperty("--af-track", f.track + "em");
    write(FKEY, f.id); mark(fhost, f.id);
    foot.textContent = f.size + "px · " + f.track + "em";
  }
  function applySkin(id) {
    root.setAttribute("data-skin", id);
    write(SKEY, id); mark(shost, id);
  }
  function setMotion(on) {
    MOTION.on = on;
    root.setAttribute("data-motion", on ? "on" : "off");
    /* Rebuild BEFORE pausing. A rebuild replaces the SVG, and a
       pauseAnimations() called on the old element does nothing for the new
       one — which is why four SMIL patterns kept running through "Paused"
       even after the rebuild hook landed. Order: rebuild, then freeze. */
    if (window.__rebuildMotion) window.__rebuildMotion();
    document.querySelectorAll("svg").forEach(function (s) {
      if (s.pauseAnimations && s.unpauseAnimations) { on ? s.unpauseAnimations() : s.pauseAnimations(); }
    });
    if (mhost) mark(mhost, on ? "on" : "off");
  }

  FONTS.forEach(function (f) { opt(fhost, f, f.size + " / " + f.track, applyFont); });
  SKINS.forEach(function (s) { opt(shost, s, s.note, applySkin); });
  if (mhost) [{ id: "on", label: "Playing" }, { id: "off", label: "Paused" }].forEach(function (m) {
    opt(mhost, m, m.id === "on" ? "loops + replays" : "frozen", function (id) { setMotion(id === "on"); });
  });

  function open(next) { panel.setAttribute("data-open", String(next)); cog.setAttribute("aria-expanded", String(next)); }
  cog.addEventListener("click", function (e) { e.stopPropagation(); open(panel.getAttribute("data-open") !== "true"); });
  panel.addEventListener("click", function (e) { e.stopPropagation(); });
  document.addEventListener("click", function () { if (panel.getAttribute("data-open") === "true") open(false); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && panel.getAttribute("data-open") === "true") { open(false); cog.focus(); }
  });

  applyFont(read(FKEY, FONTS, "mono"));
  applySkin(read(SKEY, SKINS, "catalog"));
  setMotion(!window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  window.__setSkin = applySkin;
  window.__setMotion = setMotion;
})();

Where the security facts go","what":"From the gap analysis (L-19): the page has no Security section, and 2 facts are missing from both the lab and the page.","motion":"With G1, a Security control is built over the rows, the middleware and the switches move into Gates and decisions, and the missing facts are read from the feed's settings. With G2, a ninth row of its own. With G3, nothing new.","opts":[{"v":"G1","name":"G1 · No ninth row: a Security control over the rows","plain":"Home the security facts in Gates and decisions (the middleware and the two switches move there), and add one control that lights every security element across the rows — the login check, the 401 and 429 endings, the limiters, the users row the login adds, a function that reads a secret. It lights what you ruled as security for each stage. Two facts are read from the feed's settings to fill the gaps: the secrets read on the path, and the CORS allowed origins. Its cost: one control to build; the three app-wide middleware and the two switches move into Gates and decisions, so that row grows by those five items on this endpoint; two facts are newly read from the feed's settings."},{"v":"G2","name":"G2 · A ninth row, Security","plain":"A row of its own; it would repeat or tear out the 401 and 429 endings, the in-flight limiters and the users row from their own rows."},{"v":"G3","name":"G3 · Nothing new: everything into Gates and decisions","plain":"The ruled pairing as it stands, without a Security control; the two missing facts stay missing."}],"pick":"G1","facts":[],"shots":[],"alsoIn":"gap"},{"id":"R-11","title":"Open BY MOMENT fitted when it is wider than its box","what":"Names now stay whole, so on many endpoints BY MOMENT is wider than its box and scrolls sideways. Opening it fitted changes a default, so it was left to you.","motion":"The table's opening state changes on the endpoints that overflow, and only there. Your fit look decides what the fitted table looks like.","opts":[{"v":"fit","name":"open fitted when it is wider than the box","plain":"The table opens as if you had pressed fit to the box, only on the endpoints where it would scroll sideways. Your fit look decides what fitting does."},{"v":"scroll","name":"open as now","plain":"Names stay whole and the table scrolls sideways; fit to the box stays one click away."}],"pick":"fit","facts":[{"id":"R-11","text":"with every name kept whole, 36 of 80 endpoints scroll sideways (19 before); opening fitted would change a default, so it is left to you"},{"id":"CR-40","text":"opening the table fitted is a change of default — reported, not made; 36 of 80 endpoints scroll sideways now that names stay whole"}],"shots":[{"f":"319-d066-fit-to-the-box.png","w":1864,"h":464,"cap":"click: fit to the box · fit: narrow the rest"}],"alsoIn":null},{"id":"EX-5","title":"The bench's looks in BY MOMENT's chips","what":"A kind's look ruled on the bench could become how BY MOMENT draws its chips, one hover per chip. It has a trigger: you rule a kind's look.","motion":"Nothing is built until the trigger. With build it now, BY MOMENT gains one more cell option.","opts":[{"v":"wait","name":"wait for the trigger","plain":"When you rule a kind's look on the bench, it becomes the look the bench opens with, and a BY MOMENT option “blocks from the bench” is built, to decide by seeing."},{"v":"now","name":"build it now","plain":"The option is built on the bench's looks as they stand, my picks, before any look is ruled."}],"pick":"wait","facts":[],"shots":[{"f":"386-d066-bench-column-fn.png","w":280,"h":716,"cap":"the bench today: a function drawn as a block"},{"f":"360-d066-the-functions-row-with-marks.png","w":1864,"h":959,"cap":"BY MOMENT today: the same functions as chips; with EX-5 a chip could take the block's look"}],"alsoIn":null}],"items":[{"id":"L-01","round":1,"name":"a definition repeated on every hover","words":"\"I can hover 3 different things. I can hover the label refusal, that says \"kind of ending,\" an ending where the app's own code says no, color as a table draws it, icon as the endpoint, lab draws it. That is kind of irrelevant on this content. Why? Because it repeats in so many places. We can put it, like, a legend somewhere, and that would be better than repeated that hover every— in every place, and having 3 different hover descriptions for one item. So that. Is something that we should keep in mind when we have some— something that repeats always with the same text, that is not something that we should put as a hover. Instead, it should be something con— consolidated section, like a legend for a table.\"","readAs":null,"first":"I can hover 3 different things.","rest":"I can hover the label refusal, that says \"kind of ending,\" an ending where the app's own code says no, color as a table draws it, icon as the endpoint, lab draws it. That is kind of irrelevant on this content. Why? Because it repeats in so many places. We can put it, like, a legend somewhere, and that would be better than repeated that hover every— in every place, and having 3 different hover descriptions for one item. So that. Is something that we should keep in mind when we have some— something that repeats always with the same text, that is not something that we should put as a hover. Instead, it should be something con— consolidated section, like a legend for a table.","where":"BY MOMENT · Endings · \"at the edge\" · the `refusal` label on each 429 ending","couldNot":"anything about THIS ending — the label's hover is the kind's definition (identical on every refusal) plus how the page chose its colour and icon, a fact about the page, not the code.","fix":"BY MOMENT chips are one hover each; a kind's definition (and how the page drew it, D-017) left every item hover and stands once in the row's legend.","fixRecord":"BUILT — BY MOMENT chips are one hover each; a kind's definition (and how the page drew it, D-017) left every item hover and stands once in the row's legend (`_ae_io.py` · all-endpoints.tpl.html `legHtml`/`oneTip`).","status":"built (D-067)","kind":"built","pattern":"P1","patternName":"The hover describes the kind, not the item","verdicts":[{"lens":0,"verdict":"partly","remains":"The Endings chips are fixed. The same kind of repetition is still elsewhere: all 20 ENDPOINT METADATA hovers end with one identical paragraph about the page. Every gate host's role label still repeats the role's definition ('orchestrates — calls other functions…'). The Gates legend says 'My proposal: the station draws no node for this' five times."},{"lens":1,"verdict":"partly","remains":"Item hovers no longer carry a kind's definition, but every ENDPOINT METADATA fact's hover ends with the same 3-line paragraph (about 25 times). The six alarm chips share one hover, and so do the seven 'arranges' chips."},{"lens":3,"verdict":"partly","remains":"BY MOMENT chips are fixed. The new metadata block puts one static tail on 25 of 27 hovers. Bench controls repeat the same hover 8–24 times, and BY MOMENT's × does 15 times."}],"findings":[{"id":"F10","sev":"costly","what":"Every metadata hover ends with the same paragraph, and it describes the page, not the endpoint.","outcome":"fixed","why":null},{"id":"CR-21","sev":"costly","what":"Every metadata fact's hover ends with the same paragraph, which describes the page, not the fact. The six alarm chips share one hover that says what an alarm is, not what this alarm found. The seven 'arranges' chips share one hover.","outcome":"fixed","why":null},{"id":"S4-11","sev":"minor","what":"Five legend lines say where the page got the gate icon ('My proposal: the station draws no node for this.'). This is the page talking about itself, which D-067 (5) forbids. It is the one sec-mo pageTalk hit.","outcome":"fixed","why":null},{"id":"S4-14","sev":"minor","what":"A second hover system is still on the page, and part of it is map jargon or one line repeated 11 times.","outcome":"fixed","why":null},{"id":"S4-33","sev":"minor","what":"The same control hover repeats in every column and on every head: the static-text-as-hover pattern you named in L-01, now on the new controls.","outcome":"fixed","why":null}],"shots":[{"f":"295-d066-hover-an-ending-by-its-label.png","w":520,"h":298,"cap":"pointing at refusal · the hovers: labelled lines"},{"f":"297-d066-hover-the-ending-one-sentence.png","w":520,"h":188,"cap":"pointing at refusal · the hovers: one sentence"}]},{"id":"L-02","round":1,"name":"one chip, a third of it in each hover","words":"\"the final is the container that contains both the label and the 4, 29 square. That says 4, 29 endings. Rate limit exceeded, try again shortly. And for the second one, says exactly the same thing. So I don't know which— what is the difference. And I don't know— and I guess that we should consolidate in just one hover this whole icon. Okay. And— and the idea is that the hover ha— between icon— between items contains the different information because they are different items.\"","readAs":null,"first":"the final is the container that contains both the label and the 4, 29 square.","rest":"That says 4, 29 endings. Rate limit exceeded, try again shortly. And for the second one, says exactly the same thing. So I don't know which— what is the difference. And I don't know— and I guess that we should consolidate in just one hover this whole icon. Okay. And— and the idea is that the hover ha— between icon— between items contains the different information because they are different items.","where":"BY MOMENT · Endings · at the edge · one ending chip = three hover targets (label · code square · container)","couldNot":"which of three partial cards describes the item; each tells a third of it.","fix":"The label, the status square, the glyph and the role label inside a chip no longer hover apart; the chip's one hover carries the item's own facts in before · checks · gives.","fixRecord":"BUILT — the label, the status square, the glyph and the role label inside a chip no longer hover apart (`one dings that read alike","words":"\"Then if I hover in the 4, 29, I can see a client error status. Not declare, status. Sense, retry after. And that's okay. I suppose that that's a description of what is actually happening. There, and why. And that— that might be good. But the thing is that in the 2, 4, 29 sections that we have on this row, in endings, on— at the edge, both 4, 29 say. The same, exactly the same, seems like, yeah. So I don't see the difference between one and the other.\"","readAs":"\"not declared · status · sends Retry-After\"","first":"Then if I hover in the 4, 29, I can see a client error status.","rest":"Not declare, status. Sense, retry after. And that's okay. I suppose that that's a description of what is actually happening. There, and why. And that— that might be good. But the thing is that in the 2, 4, 29 sections that we have on this row, in endings, on— at the edge, both 4, 29 say. The same, exactly the same, seems like, yeah. So I don't see the difference between one and the other.","where":"BY MOMENT · Endings · at the edge · the two 429 endings","couldNot":"what makes the two 429s two endings — the hovers never name what differs between them.","fix":"Each 429 leads with its own limit: sensitive (7 routes, 23 endpoints, rate_limit.py:117, 20 per 60 s) · global (all but /healthz, 79 endpoints, :121, 120 per 60 s); the generator stops on two items at one moment whose hovers read the same.","fixRecord":"BUILT — each 429 leads with its own limit: sensitive (7 routes, 23 endpoints, rate_limit.py:117, 20 per 60 s) · global (all but /healthz, 79 endpoints, :121, 120 per 60 s); the generator stops on two items at one moment whose hovers read the same.","status":"built (D-067)","kind":"built","pattern":"P1","patternName":"The hover describes the kind, not the item","verdicts":[{"lens":0,"verdict":"answered","remains":"Your two 429s now lead with sensitive 20/60s versus global 120/60s. The twins come back elsewhere: the in-flight lane read at the edge says '429 Rate limit exceeded… · 429 Rate limit exceeded…', and the bench ENDING selector lists '429 · Rate limit exceeded. Try again shortly.' twice."},{"lens":1,"verdict":"partly","remains":"The hovers now differ, but the faces are still twins. POST shows 'refusal 429' twice and a '429 429' dot on the lifeline; its path bar shows 429, 429, 401, 401. The bench select and the test chain list two identical 429 lines. GET /recipes shows 7 identical 'refusal 400' chips and 28 identical 'C823 proves 400' chips in one cell."},{"lens":2,"verdict":"answered","remains":"The two 429s now differ by their own limit (7 path prefixes, 23 endpoints, 20/60 s; every request but /healthz, 79 endpoints, 120/60 s), and all of it matches the feed and rate_limit.py. Left: '7 routes' are really 7 path prefixes, and the 'counts at :117/:121' lines are the 429 return lines (the count itself is at :116/:120). The bench chain still shows the two 429 rows with the same words."},{"lens":3,"verdict":"partly","remains":"The chips are fixed. The six metadata alarm chips have byte-identical hovers. The rate-limiter lifeline dot shows '429 429' with the same words twice."}],"findings":[{"id":"F11","sev":"costly","what":"Six different alarms share one identical hover, so a reader cannot tell what any of them found.","outcome":"partly","why":"each alarm says what it found here; clicking an alarm does not yet light the chips it reads"},{"id":"F26","sev":"costly","what":"The two 429s you complained about can still not be told apart outside the Endings and Gates rows.","outcome":"fixed","why":null},{"id":"CR-16","sev":"costly","what":"Items in one cell with identical faces. The page stops on twin hovers but not on twin faces, so a reader must hover each chip to tell them apart.","outcome":"fixed","why":null},{"id":"CR-36","sev":"minor","what":"The limiter's key is raw f-string code, and the header value is elided.","outcome":"fixed","why":null},{"id":"N3-22","sev":"minor","what":"The hover gives the line that returns the 429 as the line that counts, and calls 7 path prefixes 'routes'.","outcome":"fixed","why":null},{"id":"S4-09","sev":"costly","what":"All six alarms show one identical hover, so a reader cannot tell what any alarm means for this endpoint. 25 of 27 metadata hovers also end with the same paragraph about the section.","outcome":"fixed","why":null},{"id":"S4-10","sev":"costly","what":"The dot shows '429 429', and its hover repeats the same words twice. The two 429s (sensitive and global) that L-03 separated look identical again on the new lifeline.","outcome":"fixed","why":null}],"shots":[{"f":"299-d066-hover-the-first-429.png","w":520,"h":460,"cap":"pointing at refusal 429 sensitive"},{"f":"300-d066-hover-the-second-429.png","w":520,"h":424,"cap":"pointing at refusal 429 global"}]},{"id":"L-04","round":1,"name":"where a row's legend stands","words":"\"We have framework, error 4, 22. Again, the same structure, framework can be— when we hover in top of framework, says framework kind of ending, and ending the framework produces why and continues. So we can put that in a legend, external legend, or— or in the endings. Actually, in the row endings, at the beginning we can have when we hover in top of the ending, we can show the different labels that we manage show. Same thing, we have 3 different hovers, which should consolidate. In just one, with a specific information for this one. And that happens throughout all the endings in that row. But besides that, that row is very clear.\"","readAs":"\"an ending the framework produces while it reads the body\" · \"the different labels that we show\"","first":"We have framework, error 4, 22.","rest":"Again, the same structure, framework can be— when we hover in top of framework, says framework kind of ending, and ending the framework produces why and continues. So we can put that in a legend, external legend, or— or in the endings. Actually, in the row endings, at the beginning we can have when we hover in top of the ending, we can show the different labels that we manage show. Same thing, we have 3 different hovers, which should consolidate. In just one, with a specific information for this one. And that happens throughout all the endings in that row. But besides that, that row is very clear.","where":"BY MOMENT · Endings · reads the body · the framework 422 — and every ending in the row","couldNot":"same as L-01 and L-02, on every ending of the row.","fix":"Pointing at a row's name (\"Endings\") shows its legend: the kinds and labels it draws, cloned, with what each means and how many are here (your placement, ruled); the legend above the table, one line per row, is the other option.","fixRecord":"BUILT — pointing at a row's name (\"Endings\") shows its legend: the kinds and labels it draws, cloned, with what each means and how many are here (your placement, ruled); the legend above the table, one line per row, is the other option (mo.opt.leg).","status":"built (D-067); the external legend — option, yours to pick (D-067)","kind":"built","pattern":"P1","patternName":"The hover describes the kind, not the item","verdicts":[{"lens":0,"verdict":"answered","remains":"The legend sits on the row name as you asked. In its LABELS list, one sample chip stands for a whole class but carries that class's count: '[429] … 10 here' when there are two 429s."},{"lens":1,"verdict":"partly","remains":"The legend is on the row name. A status entry stands for a whole class ('429 … 14 here', where two 429s exist). Labels 'Model', 'Hook (FE)' and 'API endpoint' carry no meaning, and the hollow R is not explained."}],"findings":[{"id":"F13","sev":"misleading","what":"The sample chip stands for a whole class of statuses but carries the class's count, so a reader reads 'ten 429s'.","outcome":"fixed","why":null},{"id":"CR-11","sev":"misleading","what":"A status label stands for its whole class and counts the class. A reader believes there are 14 429s in the Gates row.","outcome":"fixed","why":null} e handler section we might have different branches, in the input or gate section we might have different branches, at different moments and that's okay. But we need to have visibility of that.","where":"BY MOMENT · the column headers","couldNot":"why some columns wear the mark and others do not, which moments belong to which core stage, and that some columns are branches of one stage.","fix":"A band of stages over the moments (INPUT 1 of 2 · 2 of 2 around GATE, the save under EFFECTS, the moments outside the request in a cell of their own, each stage counting the endings that leave it); the excepts of one try and where it goes on under one bracket, \"one of 4\"; the stage mark left the heads.","fixRecord":"BUILT — a band of stages over the moments (INPUT 1 of 2 · 2 of 2 around GATE, the save under EFFECTS, the moments outside the request in a cell of their own, each stage counting the endings that leave it); the excepts of one try and where it goes on under one bracket, \"one of 4\", proven per path by gen-all-endpoints.py; the stage mark left the heads (all-endpoints.tpl.html `moRuns`/`moForks`).","status":"built (D-068); the header's form and the stage saving stands in — option, yours to pick (D-068)","kind":"built","pattern":"P5","patternName":"Structure hidden in a mark, or mixed into an axis","verdicts":[{"lens":0,"verdict":"answered","remains":"The stage band and the 'one of 4' bracket are there. 'INPUT 1 of 2' has a bare count pill '2' next to it, so two numbers sit side by side with no unit. The column head 'subscription_tier_for +2' names a function, but its moment is 'the work'."},{"lens":1,"verdict":"partly","remains":"The band is built. The count beside each stage says nothing on its face, and 'INPUT 1 of 2' sits next to a bare '2'. 'one of 4' has no noun. Moments carry different names in the heads, the hovers and the map ('subscription_tier_for +2' vs 'the work'; 'commit' vs 'saving' vs 'way 4: saving'). GET /recipes has three heads named 'checks', and ructure hidden in a mark, or mixed into an axis","verdicts":[{"lens":0,"verdict":"answered","remains":"The 'no moment' column is gone. The metadata cards sit after the table."},{"lens":1,"verdict":"answered","remains":"The column left the table. The metadata hovers repeat one paragraph that talks about the page."}],"findings":[],"shots":[{"f":"309-d066-the-endpoint-metadata-after-the-table.png","w":1872,"h":834,"cap":"as it opens · the metadata: metadata after the table"},{"f":"310-d066-metadata-before-the-table.png","w":1872,"h":902,"cap":"click: metadata before the table · the metadata: metadata before the table"},{"f":"311-d066-metadata-back-after-the-table.png","w":120,"h":72,"cap":"click: metadata after the table · the metadata: metadata after the table"}]},{"id":"L-07","round":1,"name":"Overview and risk out of the table","words":"\"Same thing for \"overview\" and \"risk\". That is also metadata information. So this is metadata for the whole API endpoint, and that will go in a different section in our navigation bar on the Gabe universe.\" — and later: \"overview. We already said that it will be consolidated in a metadata information section for the whole API endpoint or element that we are selecting\"","readAs":null,"first":"Same thing for \"overview\" and \"risk\".","rest":"That is also metadata information. So this is metadata for the whole API endpoint, and that will go in a different section in our navigation bar on the Gabe universe.\" — and later: \"overview. We already said that it will be consolidated in a metadata information section for the whole API endpoint or element that we are selecting","where":"BY MOMENT · the rows Overview and Risk","couldNot":"same as L-06 — rows of timeless facts inside the timeline.","fix":"The Overview and risk row left the table; its facts are the metadata's first card, the proof's two counts one under the other, each saying what it counts (proven 2/14 · named 4/11, rank 3–6 of 80).","fixRecord":"BUILT — the Overview and risk row left the table; its facts are the metadata's first card, the proof's two counts one under the other, each saying what it counts (proven 2/14 · named 4/11, rank 3–6 of 80).","status":"built (D-068)","kind":"built","pattern":"P5","patternName":"Structure hidden in a mark, or mixed into an axis","verdicts":[{"lens":0,"verdict":"answered","remains":"Overview and risk is out of the table. 'conflict · large surface' explains only 'large surface'. The six alarm chips share one identical hover."},{"lens":1,"verdict":"partly","remains":"'rank 3–6 of 80' does not say which end is good. 'conflict · large surface' uses the word the gate roles use for a 409. The 'lacks' head hover carries the definition of 'pieces'."},{"lens":2,"verdict":"partly","remains":"'named 4/11 of its refusals' divides by the produced rows, which include the 500 and leave out the body-parse endings. True figures: 5/12 on POST, 19/20 on GET /recipes, 1/4 on GET /cooking/active. On POST, 'behind 18' is lit on a different set of 24 functions. On GET /recipes, the Proof card calls C859 and C867 set-up-only cases, but both test the endpoint."}],"findings":[{"id":"F31","sev":"minor","what":"Half the label is never explained.","outcome":"fixed","why":null},{"id":"CR-12","sev":"misleading","what":"The hover on 'lacks' gives the definition of 'pieces'.","outcome":"fixed","why":null},{"id":"CR-13","sev":"misleading","what":"The overview flag's word 'conflict' is the same word the gate roles use for a 409. A reader takes it for an HTTP conflict.","outcome":"fixed","why":null},{"id":"CR-23","sev":"costly","what":"The rank has no direction and no scale: a reader cannot tell whether 3–6 is good or bad, or why it is a range.","outcome":"fixed","why":null},{"id":"N3-04","sev":"misleading","what":"The denominator is not the endpoint's refusals.","outcome":"fixed","why":null},{"id":"N3-05","sev":"misleading","what":"The count and the set it lights are different sets of functions.","outcome":"fixed","why":null}],"shots":[{"f":"309-d066-the-endpoint-metadata-after-the-table.png","w":1872,"h":834,"cap":"as it opens · the metadata: metadata after the table"},{"f":"310-d066-metadata-before-the-table.png","w":1872,"h":902,"cap":"click: metadata before the table · the metadata: metadata before the table"},{"f":"311-d066-metadata-back-after-the-table.png","w":120,"h":72,"cap":"click: metadata after the table · the metadata: metadata after the table"}]},{"id":"L-08","round":1,"name":"what a test does and touches","words":"\"proof is a different monster because it encodes a lot of information. A lot. Information. So ideally we should find— we will iterate in a way to show better how we represent the tests, like. Say I would like to see, okay, like the data structures, the functions, the models, use, or different components using that that are around our API endpoint used in that. The gates and decisions also, that's very important. In-flight states. That might be affected by the test. So we will do a similar work done we did in the. In the. Endpoint lab, where we figured out a way to represent the tables. In blocks. But this will be for tests. Because right now it's very difficult to grasp what is happening on each test and journey, and how it relates to our API endpoint. If we hover on top of it, we have some information there, but it's not enough. I mean, it's enough in the sense of having the context, but it doesn't— Communicate well the meaning of what is happening inside the tests and what is being affected and what is being tested.\"","readAs":null,"first":"proof is a different monster because it encodes a lot of information.","rest":"A lot. Information. So ideally we should find— we will iterate in a way to show better how we represent the tests, like. Say I would like to see, okay, like the data structures, the functions, the models, use, or different components using that that are around our API endpoint used in that. The gates and decisions also, that's very important. In-flight states. That might be affected by the test. So we will do a similar work done we did in the. In the. Endpoint lab, where we figured out a way to represent the tables. In blocks. But this will be for tests. Because right now it's very difficult to grasp what is happening on each test and journey, and how it relates to our API endpoint. If we hover on top of it, we have some information there, but it's not enough. I mean, it's enough in the sense of having the context, but it doesn't— Communicate well the meaning of what is happening inside the tests and what is being affected and what is being tested.","where":"BY MOMENT · Proof · the proof chips (`C221 proves 404` …), the journey chips (`C250 4 steps after` …), the arranging tests","couldNot":"what a test does, what it touches (structures, functions, models, gates, in-flight state) and what it proves.","fix":"The TEST column of the examples bench — a strip of its requests, and a click that opens the ordered chain (request → checks passed → branch → functions → tables, saved or not → ending) with what the test does not tell.","fixRecord":"built: the TEST column of the examples bench (`sec-ex`) — a strip of its requests, and a click that opens the ordered chain (request → checks passed → branch → functions → tables, saved or not → ending) with what the test does not tell.","status":"option — yours to pick (D-071)","kind":"option","pattern":"P4","patternName":"One end of a relation","verdicts":[{"lens":0,"verdict":"partly","remains":"The bench TEST column is built, but it is an option. On the page, 7 of the 8 'proves 404' chips are tests of other functions (cancel_session, set timer, step progress). C237 is said to send 'no headers' when it sends auth_headers. Its bench chain offers a body-parse 400 although the test's JSON body is written out in the test, and says 'the body it sends' is not known. The 'arranges' chips give no test name."},{"lens":1,"verdict":"partly","remains":"The bench chain exists, but it lists the checks passed by their error endings with a ✓. Eight service-side tests of other functions read 'Cxxx proves 404' and count toward 'proven'. C237 says 'sends no headers' although it passes auth_headers. The bench shows raw assert code."},{"lens":2,"verdict":"partly","remains":"7 of the 8 service-side 404 proofs test other functions. 'sends no headers' is shown where the feed simply did not read the headers (C237, C283). 'beyond' ignores body assertions. The C267/C250 'checks it passes' lists leave out the checks inside calls. The bench says C250 and C237 'prove' endings that the metadata says they do not prove. On GET /recipes, C574/C316/C811/C813/C823 each show as proving all 16 400s, though each request's query names one."}],"findings":[{"id":"F01","sev":"misleading","what":"A reader believes 8 tests prove this endpoint's 404 'Recipe not found'. 7 of them test other service functions and never touch this endpoint's code.","outcome":"fixed","why":null},{"id":"F02","sev":"misleading","what":"The reader is told the test sends no headers, so it cannot tell how the test gets past the login check.","outcome":"fixed","why":null},{"id":"F03","sev":"misleading","what":"The face says 'proves' on a chip that only fits. The ending it sits on is a JSON parse error that this test cannot produce. The bench says the body is unknown although it is written out in the test.","outcome":"fixed","why":null},{"id":"F12","sev":"costly","what":"The chips show no test name and not what the test sets up, so a reader cannot tell one arranging test from another.","outcome":"fixed","why":null},{"id":"CR-01","sev":"misleading","what":"Eight tests that never call this endpoint or start_session are drawn as 'Cxxx proves 404' on POST /cooking/sessions, and the 404 then counts as proven. A reader believes eight tests prove this endpoint's 404 'Recipe not found'.","outcome":"fixed","why":null},{"id":"CR-02","sev":"misleading","what":"The hover states the test sends no headers, but it does: ecisions, rate limit, that by. Line 117, 20 per 60 seconds, keyed something the checks that stop a request and the force that decide sending. What is this? It's a function. What it is. So if we have different gates and decisions, we should show the function method. Of the place where they are being called, the item. There should be associated to an item, ideally an affection with a function role. It's okay if the functions gets repeated throughout the different gates and decisions. That's expected.","where":"BY MOMENT · Gates and decisions · at the edge · `sensitive` and `global` — and the other G&D cells","couldNot":"what kind of thing a gate chip is (it wears no glyph) and which function it lives in.","fix":"Every gate and switch names the function (or middleware) it runs in, a station element with its glyph and role; a gate wears the page's own icon per kind (my pick, dashed).","fixRecord":"BUILT — every gate and switch names the function (or middleware) it runs in, a station element with its glyph and role (`_ae_els.gates` · all-endpoints.tpl.html `gdHost`/`moCell`); a gate wears the page's own icon per kind (my pick, dashed).","status":"built (D-069); the gate icons — option, yours to pick (D-069)","kind":"built","pattern":"P3","patternName":"An element drawn without its identity","verdicts":[{"lens":0,"verdict":"answered","remains":"Gates name their host (glyph + role) and wear icons: sensitive/global now read 'rate limiter · runs in RateLimitMiddleware'. The legend lists a gate's kind name in KINDS with no icon, and its icon in LABELS under a second, different definition."},{"lens":1,"verdict":"partly","remains":"Every gate names its function, but the function heads' hovers say only 'build_auth_context · function' and 'RateLimitMiddleware · middleware'."},{"lens":2,"verdict":"partly","remains":"The hosts are right except the TokenVerifier switch: 'runs in build_auth_context · at context.py:97', but line 97 is in get_auth_context (the verify call is at :77)."} those with functions. So gates and decisions will probably— we will most likely mutate that to have a change of functions. With the actual gates and decisions, like the flag or the condition that they are evaluating. And then if there is— the effect of that. That might be a validation or something like that. Or an ending, like in the columns checks and subscription. Where we have an ending for 409, 404, and 400. … This operation is happening in this function. And the result of that is an ending or maybe something else. That's okay. Maybe a branching— That's also valid. But again, if we do that, we should encode that with some color or something that we will use for that branch or the stage. In the API endpoint moment.\"","readAs":"\"a chain of functions\"","first":"Then we have some in the column checks.","rest":"We have some return codes like 409, 400, then in the next column subscription tier for we have the 404, 409. We should also associate those because those are endings, right? We should associate those with functions. So gates and decisions will probably— we will most likely mutate that to have a change of functions. With the actual gates and decisions, like the flag or the condition that they are evaluating. And then if there is— the effect of that. That might be a validation or something like that. Or an ending, like in the columns checks and subscription. Where we have an ending for 409, 404, and 400. … This operation is happening in this function. And the result of that is an ending or maybe something else. That's okay. Maybe a branching— That's also valid. But again, if we do that, we should encode that with some color or something that we will use for that branch or the stage. In the API endpoint moment.","where":"BY MOMENT · Gates and decisions · checks (409, 400) · subscription_tier_for +2 (404, 409)","couldNot":"which function evaluates a condition and what its result does — an ending, a validation, a branch.","fix":"Each gate is function → condition → what happens (the ending's status with its stage lit, or \"returns\" · \"passes the error on\" · \"goes on\"); three looks and two effect colours in the Gates row's options slot.","fixRecord":"BUILT — each gate is function → condition → what happens (the ending's status with its stage lit, or \"returns\" · \"passes the error on\" · \"goes on\"); three looks and two effect colours in the Gates row's options slot (`gdChip`, `gdEff`).","status":"option — yours to pick (D-069)","kind":"option","pattern":"P4","patternName":"One end of a relation","verdicts":[{"lens":0,"verdict":"partly","remains":"function → condition → effect is drawn. Four things still read wrong or vague. (1) Raises one call down say 'the answer it becomes is not known' although the handler's except in the same row answers them. (2) The InvalidTokenError catch claims it 'commits, at context.py:79'; that commit never runs on that path. (3) The rate-limit switch just says 'decides the 429'. (4) TokenVerifier's face says 'can end at 401' but its hover says 'decides the 401'."},{"lens":1,"verdict":"partly","remains":"The chain function → condition → effect is built. Conditions are raw code, and the hovers use code negations ('only when not (existing is not None)'). Answers show source text (str(exc) and 16 f-strings on GET /recipes). Raises say 'the answer it becomes is not known' next to the catch that answers them."},{"lens":2,"verdict":"partly","remains":"'HTTPBearer → 401 ×2' credits the invalid-token 401 to HTTPBearer. The except InvalidTokenError hover says 'commits, at context.py:79', but no path through that catch commits. The TokenVerifier hover says 'decides the 401' while its chip says 'can end at'. The guards 'taste → 400' and 'taste_max → 400' name the enclosing if, not the real condition (the value is not an integer)."}],"findings":[{"id":"F04","sev":"misleading","what":"Raises are labelled 'the answer it becomes is not known' or 'the ending it becomes is not recorded', while the handler's except that answers them is drawn in the same row. The guard's face even says → 404.","outcome":"fixed","why":null},{"id":"F07","sev":"misleading","what":"The reader is told a rejected token commits something to the database.","outcome":"fixed","why":null},{"id":"F22","sev":"costly","what":"The switches do not say what each setting does to the request.","outcome":"fixed","why":null},{"id":"CR-09","sev":"misleading","what":"A raise is labelled 'the answer it becomes is not known' while the catch for that same exception class stands in the same row and its hover gives the status.","outcome":"fixed","why":null},{"id":"CR-15","sev":"costly","what":"Conditions are raw Python, and a guard's precondition is a code negation.","outcome":"fixed","why":null},{"id":"CR-37","sev":"costly","what":"The fall-through branch's hover title is named by the function it sits in, not by the branch.","outcome":"partly","why":"fixed in BY MOMENT; the bench still said fall-through until lane F2"},{"id":"N3-08","sev":"misleading","what":"The invalid-token 401 is credited to the HTTPBearer condition and drawn twice in one cell.","outcome":"fixed","why":null},{"id":"N3-09","sev":"misleading","what":"The hover says this catch commits, but no path through it does.","outcome":"fixed","why":null},{"id":"N3-25","sev":"minor","what":"The condition shown is the enclosing if, not what refuses.","outcome":"fixed","why":null}],"shots":[{"f":"330-d066-the-gates-row.png","w":1864,"h":611,"cap":"as it opens · the gates: function, gates under it"},{"f":"331-d066-open-the-gates-row-options.png","w":120,"h":521,"cap":"click: Gates and decisions: this row's options"},{"f":"332-d066-gates-look-a-one-chain-per-gate.png","w":1864,"h":846,"cap":"click: one chain per gate · the gates: one chain per gate"},{"f":"333-d066-gates-look-c-side-by-side.png","w":1864,"h":846,"cap":"click: function · condition · effect · the gates: function · condition · effect"},{"f":"334-d066-gdl-back-to-head.png","w":110,"h":104,"cap":"click: function, gates under it · the gates: function, gates under it"},{"f":"335-d066-effect-e2-a-colour-per-stage.png","w":1864,"h":846,"cap":"click: a colour per stage · the effect: a colour per stage"},{"f":"336-d066-gef-back-to-end.png","w":102,"h":67,"cap":"click: ending's colour, stage lit · the effect: ending's colour, stage lit"},{"f":"348-d066-close-the-gates-row-options.png","w":120,"h":84,"cap":"click: Gates and decisions: this row's options"},{"f":"351-d066-hover-the-sensitive-limit.png","w":520,"h":493,"cap":"pointing at rate limit sensitive 20/60s → 429 app-wide"}]},{"id":"L-11","round":1,"name":"roles for gates","words":"\"by the way, in gates and decisions, in gates and decisions, we might have, okay, we will have the functions associated to the gates and decisions, but can we also put some roles in the gates and decisions themselves? I'm not sure about this I just figured out that since functions already have a role, maybe gates and decisions might have something similar since they validate things on different levels.\"","readAs":null,"first":"by the way, in gates and decisions, in gates and decisions, we might have, okay, we will have the functions associated to the gates and decisions, but can we also put some roles in the gates and decisions themselves?","rest":"I'm not sure about this I just figured out that since functions already have a role, maybe gates and decisions might have something similar since they validate things on different levels.","where":"BY MOMENT · Gates and decisions (the whole row)","couldNot":"at which level a gate decides — the chips carry no subcategory.","fix":"A label at each gate's end from the feed's own categories: where it decides (my pick) · what it does · what a check guards · none, in the Gates row's options slot (D-069); and on the examples bench the GATE OR DECISION column's role filter — nine roles from the feed's own groups, each block naming the function it runs in (glyph + role), its condition and its effect (D-071).","fixRecord":"BUILT — a label at each gate's end from the feed's own categories: where it decides (my pick) · what it does · what a check guards · none, in the Gates row's options slot (`gdRole`, words enc.fam.gdl/gdv/gdc) (D-069); and on the examples bench the GATE OR DECISION column's role filter — nine roles from the feed's own groups, each block naming the function it runs in (glyph + role), its condition and its effect (D-071).","status":"option — yours to pick (D-069, D-071)","kind":"option","pattern":"P3","patternName":"An element drawn without its identity","verdicts":[{"lens":0,"verdict":"answered","remains":"Where-it-decides labels (app-wide · at login · inside a call · in the handler) are built as an option, and the bench's nine-role filter is built. Yours to pick."},{"lens":1,"verdict":"answered","remains":"The role labels ('inside a call', 'in the handler', 'app-wide', 'at login') are drawn. They are explained only in the legend and the row options."},{"lens":2,"verdict":"partly","remains":"On the bench's GATE OR DECISION column, 'except InvalidTokenError' is counted twice (login check and catch). So 'all 21' should be 20, 'all 38' should be 37, and 'all 6' should be 5 on the simple GET."}],"findings":[{"id":"N3-07","sev":"misleading","what":"One try/except is counted as two gates.","outcome":"fixed","why":null},{"id":"S4-01","sev":"misleading","what":"Every catch is labelled 'catch that translates', including catches that swallow the error or let it pass. A reader believes the error becomes an ending when it does not.","outcome":"fixed","why":null},{"id":"S4-02","sev":"misleading","what":"The part's definition says it shows the level the gate decides at, but it shows the gate's kind. BY MOMENT uses 'role' for the level (app-wide · at login · in the handler · inside a call), so one word names two different axes.","outcome":"fixed","why":null},{"id":"S4-19","sev":"costly","what":"The endpoint's own check has five names and a deciding fork has these tables, but how? With what function? Okay.\"","readAs":"\"write might be red, read might be green, read and write orange\"","first":"Data effects the same thing for gates and decisions.","rest":"We are doing things on tables basically. That's what we want to highlight here. And also we are mentioning some functions. So what would be a nice representation here would be put functions on the— in a block. In different blocks the functions on the left. And in the right the tables. And have sort of a mind map that gives you the relationship between the functions and the tables. Where the connectors will describe the kind of operation. Like right might be red, red might be green, and red and right might be orange or something like that. I think that somehow we have already encoded that kind of information. … In data effects we want to say, okay, we are affecting these tables, but how? With what function? Okay.","where":"BY MOMENT · Data effects","couldNot":"which function does which operation on which table — the row lists tables with R/W beside a few functions, never the link between them.","fix":"Data effects' options slot: one map for the endpoint under the row (my pick): functions left, tables right, the moments as bands, green reads, orange writes, a tick a flush, a rule a commit naming who commits, the race on its link · a small map per cell · chips.","fixRecord":"BUILT — Data effects' options slot: one map for the endpoint under the row (my pick): functions left, tables right, the moments as bands, green reads, orange writes, a tick a flush, a rule a commit naming who commits, the race on its link · a small map per cell · chips.","status":"option — yours to pick (D-070); the R/W colour built (D-069)","kind":"option","pattern":"P4","patternName":"One end of a relation","verdicts":[{"lens":0,"verdict":"answered","remains":"The function→table map is built (option; my pick is the default): green reads, orange writes, commit rules, the race on its link. Table chips still say 'only when a condition there holds' and never name the condition."},{"lens":1,"verdict":"partly","remains":"The map is built, but the chips stay in the cells, so every read and write is drawn twice with no note. The map's 'saving' band holds only its label. On GET /recipes a Python set.add is drawn as a save step and counted 'left unsaved 7' on a GET whose head says 'writes 0'."},{"lens":2,"verdict":"partly","remains":"The links, ticks and commit rules are true. But only the idempotency race is drawn. The users race at ownership.py:50 is missing, even though the feed records it and the bench's users table names it. On GET /recipes, a Python set.add is drawn as a save step, and that inflates the data-fns count (should be 13) and the fate count ('left unsaved 7' should be 0)."}],"findings":[{"id":"F21","sev":"costly","what":"'only when a condition there holds' never names the condition. For the allergen tables the condition is not even 'there'.","outcome":"left","why":"the feed records only that a step is conditional, not the condition's text; naming it would be a guess"},{"id":"CR-04","sev":"misleading","what":"A Python set's .add() is drawn as a database save step on a GET endpoint and counted as a write left unsaved. The row head and pinned row say 'writes 0' while the card says 'left unsaved 7', so the page contradicts itself.","outcome":"fixed","why":null},{"id":"CR-31","sev":"costly","what":"Every read and write is drawn twice, as chips in the cells and as lines in the map, and nothing says they are the same facts. The map's 'saving' band holds only its label, with the commit rule below it.","outcome":"fixed","why":null},{"id":"N3-06","sev":"misleading","what":"A Python set add is drawn as a database write.","outcome":"fixed","why":null},{"id":"N3-18","sev":"misleading","what":"A second uncaught race on every login path is not drawn.","outcome":"fixed","why":null},{"id":"S4-21","sev":"costly","what":"The same race is described three incompatible ways: as a retry, as a second request, and as 'first requests sent at once'. The bench line types its status and was bent to get past the number-word sweep.","outcome":"fixed","why":null},{"id":"S4-29","sev":"costly","what":"You asked for writes in red. The agent drew them orange, and no option offers your red, so a choice made alone against your words is not switchable (D-025.2).","outcome":"fixed","why":null}],"shots":[{"f":"352-d066-data-effects-the-map.png","w":1864,"h":762,"cap":"as it opens · data effects: one map for the endpoint"},{"f":"353-d066-open-the-data-row-options.png","w":120,"h":352,"cap":"click: Data effects: this row's options"},{"f":"354-d066-data-effects-a-map-per-moment.png","w":1864,"h":649,"cap":"click: a small map per moment · data effects: a small map per moment"},{"f":"355-d066-data-effects-as-chips.png","w":1864,"h":767,"cap":"click: chips · data effects: chips"},{"f":"356-d066-data-effects-back-to-the-map.png","w":110,"h":118,"cap":"click: one map for the endpoint · data effects: one map for the endpoint"},{"f":"357-d066-write-colour-his-words.png","w":1864,"h":959,"cap":"click: your words' colours · write colour: your words' colours"},{"f":"358-d066-write-colour-back-to-the-page.png","w":110,"h":81,"cap":"click: the page's colours · write colour: the page's colours"},{"f":"359-d066-close-the-data-row-options.png","w":120,"h":70,"cap":"click: Data effects: this row's options"}]},{"id":"L-13","round":1,"name":"functions in more detail, in blocks","words":"\"in functions again, we will have to do kind of the same thing that we did on the endpoint lab for the tables for functions also. I think that we already did it for schemas. So functions should be shown with a little bit more of detail. And in blocks.\"","readAs":null,"first":"in functions again, we will have to do kind of the same thing that we did on the endpoint lab for the tables for functions also.","rest":"I think that we already did it for schemas. So functions should be shown with a little bit more of detail. And in blocks.","where":"BY MOMENT · Functions","couldNot":"what a function does — a chip is its name and role only.","fix":"The FUNCTION column of the examples bench on the lab's function look — a strip of the tables it touches; a click lists its raises (and what each becomes here), tables, calls and what it does. Its use in BY MOMENT waits on EX-5.","fixRecord":"built: the FUNCTION column of the examples bench on the lab's function look — a strip of the tables it touches; a click lists its raises (and what each becomes here), tables, calls and what it does. Its use in BY MOMENT waits on EX-5.","status":"option — yours to pick (D-071)","kind":"option","pattern":"P3","patternName":"An element drawn without its identity","verdicts":[{"lens":0,"verdict":"partly","remains":"Function blocks exist only on the bench (option). The block's 'WHAT IT DOES' is category words ('decides an ending · reads or writes data'). The four functions of L-14 plus load_resolution_snapshot are not in the bench's function list (25 there, 28 in the row). In BY MOMENT, 8 function hovers have no checks or gives line at all."},{"lens":1,"verdict":"partly","remains":"The bench function block says 'faces the web · decides an ending · reads or writes data' (generic). BY MOMENT's function hovers use feed verbs ('read: households · memberships', 'add: users')."},{"lens":2,"verdict":"partly","remains":"The bench says start_session 'ends a database transaction', but it only flushes; the commit belongs to post_start_session, and the bench does not say so. The bench's 'all 25' functions leaves out load_resolution_snapshot, get_idempotency_key, violations_for and derive_restrictions, which BY MOMENT draws. load_resolution_snapshot's hover says it is 'called at cooking.py:150'."}],"findings":[{"id":"F20","sev":"costly","what":"A reader cannot tell what these functions do; the hover has only who calls it and how deep.","outcome":"fixed","why":null},{"id":"CR-29","sev":"costly","what":"The function's 'what it does' is generic words that fit any handler, and the face mark 'CALL' is unexplained.","outcome":"fixed","why":null},{"id":"N3-19","sev":"misleading","what":"The bench credits the commit to the wrong function.","outcome":"fixed","why":null},{"id":"N3-24","sev":"minor","what":"The call site is wrong, and the bench's list is incomplete.","outcome":"partly","why":"the page says \"runs under assert_recipe_allergen_safe\"; the bench list fixed by F2"},{"id":"N3-26","sev":"minor","what":"The page says the ending is unknown although it draws the catch that makes it.","outcome":"fixed","why":null}],"shots":[{"f":"360-d066-the-functions-row-with-marks.png","w":1864,"h":959,"cap":"as it opens · function marks: what it decides and touches"},{"f":"361-d066-open-the-functions-row-options.png","w":120,"h":210,"cap":"click: Functions: this row's options"},{"f":"362-d066-functions-marks-off.png","w":1864,"h":749,"cap":"click: name and role only · function marks: name and role only"},{"f":"363-d066-functions-marks-back-on.png","w":110,"h":81,"cap":"click: what it decides and touches · function marks: what it decides and touches"},{"f":"364-d066-close-the-functions-row-options.png","w":120,"h":54,"cap":"click: Functions: this row's options"},{"f":"386-d066-bench-column-fn.png","w":280,"h":716,"cap":"column: function"}]},{"id":"L-14","round":1,"name":"functions with no icon or role","words":"\"there is some functions that do not have the function icon or their role. For example, in the column for subscription tier for plus two, we have the resolution snapshot that violations for. And we have the derive underscore restrictions. Those two, if they are functions, they should be— they should be given a function, icon, and a role. And I would like to know why we haven't done that. Or in the get idempotency key, in the checks column also having the same thing.\"","readAs":"`ResolutionSnapshot.violations_for` · `derive_restrictions` · `get_idempotency_key`","firs

<meta charset="utf-8">
<title>Voice Lab</title>

<!--__KIT1__-->
<style>
  /* ══ the page's own rules — the kit block above is pasted verbatim by gen-voice-lab.mjs ══
     No motion (the kit's Motion group is dropped), every size is one of the kit's --fs-* steps (the 12px floor), the column is centred
     and takes the screen (operator rule, as the review page). Dashed = my pick, filled = yours (D-025.2). */
  .artifact-page { margin: 0 auto; max-width: min(96vw, 1800px); box-sizing: border-box; }
  html.bar-always .artifact-page { padding-top: 76px; }
  .eyebrow { font-size: var(--fs-min); letter-spacing: .18em; text-transform: uppercase; color: var(--accent); margin: 0; }
  h1 { font-size: 2em; line-height: 1.15; margin: 8px 0 0; text-wrap: balance; }
  h3 { margin: 0; font-size: 1.05em; text-wrap: balance; }
  .lede { color: var(--ink-soft); max-width: 110ch; margin: 12px 0 0; }
  .cap { font-size: var(--fs-sm); color: var(--ink-soft); margin: 0; max-width: 112ch; }
  .take { font-size: var(--fs-sm); color: var(--ink); margin: 2px 0 0; border-left: 3px solid var(--accent); padding: 4px 0 4px 11px; max-width: 112ch; }
  .sec-head { flex-wrap: wrap; }
  .sec-head .st { white-space: normal; }
  .body { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .lab { font-size: var(--fs-min); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .state { font-size: var(--fs-min); color: var(--muted); letter-spacing: .04em; }
  [hidden] { display: none !important; }

  .key { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; font-size: var(--fs-sm); color: var(--ink-soft); margin-top: 14px; }
  .key span { display: inline-flex; align-items: center; gap: 7px; }
  .key .btn { pointer-events: none; }

  .btn { font: inherit; font-size: var(--fs-sm); letter-spacing: inherit; cursor: pointer; border-radius: 8px; padding: 5px 11px; border: 1px solid var(--rule); background: var(--raised); color: var(--ink); text-align: left; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn[disabled] { opacity: .5; cursor: default; }
  .btn[disabled]:hover { border-color: var(--rule); color: var(--ink); }
  .btn[data-mine="true"] { border: 1.5px dashed var(--accent); color: var(--accent); }                       /* dashed = my pick */
  .btn[aria-pressed="true"] { border: 1.5px solid var(--accent); background: var(--accent); color: var(--ground); }   /* filled = yours */
  .btn.pri { background: var(--accent); border-color: var(--accent); color: var(--ground); }
  .btn.nb { background: transparent; color: var(--ink-soft); font-size: var(--fs-min); padding: 2px 9px; border-radius: 10px; }
  .btn.nb[data-mine="true"] { color: var(--accent); }
  .btn.nb[aria-pressed="true"] { background: var(--accent); color: var(--ground); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .btn.ic { display: inline-flex; align-items: center; gap: 7px; }
  .btn.ic .ico { width: 1.1em; height: 1.1em; }
  .btn.tog[data-on="true"] { border: 1.5px solid var(--accent); background: var(--accent-soft); color: var(--accent); }
  .ico { width: 1.15em; height: 1.15em; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .chip { font: inherit; font-size: var(--fs-min); color: var(--ink); border: 1px solid var(--rule); border-radius: 10px; padding: 0 9px; line-height: 1.7; background: var(--card); max-width: 100%; box-sizing: border-box; display: inline-flex; align-items: center; gap: 5px; }
  .chip .ico { width: 1.05em; height: 1.05em; }
  .chip.mine { border: 1.5px dashed var(--accent); color: var(--accent); }
  .chip.his { border: 1.5px solid var(--accent); background: var(--accent); color: var(--ground); }
  button.chip { cursor: pointer; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }

  .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .said { font-size: var(--fs-sm); color: var(--accent); min-height: 1.4em; }
  .sel { font: inherit; font-size: var(--fs-sm); color: var(--ink); background: var(--raised); border: 1px solid var(--rule); border-radius: 8px; padding: 4px 8px; max-width: 100%; box-sizing: border-box; }
  .sel:focus-visible { border-color: var(--accent); }
  .rate { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); color: var(--ink-soft); flex: 1 1 20rem; min-width: 0; max-width: 100%; }
  .rate .sel { flex: 1 1 auto; min-width: 0; width: 100%; }   /* a long sentence in the list never widens the page */
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  .seg { display: inline-flex; gap: 6px; }
  nav.toc { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; font-size: var(--fs-sm); }
  nav.toc a, a.up { color: var(--accent); text-decoration: none; }
  nav.toc a:hover, a.up:hover { text-decoration: underline; }
  a.up { font-size: var(--fs-min); letter-spacing: .04em; }
  [id^="sec-"] { scroll-margin-top: 16px; }

  table.t { border-collapse: collapse; font-size: var(--fs-sm); font-variant-numeric: tabular-nums; width: 100%; }
  table.t th, table.t td { text-align: left; padding: 5px 16px 5px 0; vertical-align: middle; border-bottom: 1px solid var(--rule-soft); color: var(--ink); font-weight: 400; overflow-wrap: break-word; }
  table.t th { color: var(--muted); font-size: var(--fs-min); letter-spacing: .06em; text-transform: uppercase; }
  table.t td.sv, table.t th.sv { white-space: nowrap; overflow-wrap: normal; }
  .tw { overflow-x: auto; max-width: 100%; }

  /* 1 · the text */
  .tcols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 18px; align-items: start; }
  @media (max-width: 1000px) { .tcols { grid-template-columns: minmax(0, 1fr); } .tleft { position: static; } }
  .tleft, .tright { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .tleft { position: sticky; top: 84px; }   /* the box and its buttons stay in view while the long list beside it scrolls */
  .tbox, .out { font: inherit; letter-spacing: inherit; font-size: var(--fs-sm); line-height: 1.5; color: var(--ink); background: var(--raised); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; width: 100%; box-sizing: border-box; resize: vertical; }
  .tbox { min-height: 30rem; }
  .out { min-height: 5em; }
  .vt-view { display: flex; flex-direction: column; gap: 10px; }
  .vt-sec { border: 1px solid var(--rule); border-radius: 8px; background: var(--raised); padding: 9px 12px; display: flex; flex-direction: column; gap: 6px; scroll-margin-top: 96px; }
  .vt-sec[data-on="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--accent); }
  .vt-hd { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
  .vt-h { margin: 0; font-size: 1em; font-weight: 650; color: var(--ink); padding: 0 4px; border-radius: 4px; }
  .vt-h[data-on="true"], .vt-s[data-on="true"] { background: var(--accent); color: var(--ground); }
  .vt-p { margin: 0; line-height: 1.7; color: var(--ink); max-width: 112ch; }
  .vt-s { border-radius: 4px; padding: 0 2px; }
  .vt-hd .btn { margin-left: auto; }

  /* 2 · the browser's voices */
  .vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); gap: 10px; max-height: 32rem; overflow-y: auto; padding: 2px; align-content: start; }
  .vc { border: 1px solid var(--rule); border-radius: 8px; padding: 9px 11px; background: var(--raised); display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .vc[data-cur="true"] { border-color: var(--accent); }
  .vc[data-lit="true"] { background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--accent); }
  .vc-name { font-weight: 650; color: var(--ink); overflow-wrap: anywhere; }
  .vc-act { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .tick { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--ink-soft); cursor: pointer; }
  .tick input, .srow input[type="range"] { accent-color: var(--accent); }
  .set, .cmp { gap: 12px; }
  .sgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr)); gap: 12px 22px; }
  .srow { display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--raised); min-width: 0; }
  .srow-hd { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  .srow-l { font-weight: 650; color: var(--ink); }
  .srow-w { font-size: var(--fs-min); color: var(--ink-soft); margin: 0; }
  .srow-c { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .srow-c input[type="range"] { flex: 1 1 auto; min-width: 0; }
  .srow-c .sel { flex: 1 1 auto; min-width: 0; }
  .srow output { font-size: var(--fs-sm); font-variant-numeric: tabular-nums; color: var(--ink); min-width: 5.5em; text-align: right; }
  .srow-hd .btn { margin-left: auto; }

  /* 3 · local voices */
  .pgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr)); gap: 12px; align-items: start; }
  .pc { gap: 8px; }
  .pc-hd { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .pc-name { font-weight: 650; font-size: 1.05em; color: var(--ink); }
  .pr { display: grid; grid-template-columns: 5.2em minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; }
  .pr audio { width: 100%; min-width: 0; height: 32px; }
  .pr .lab { text-transform: none; letter-spacing: .02em; }
  .pr .len { grid-column: 2; font-size: var(--fs-min); color: var(--muted); margin-top: -2px; }
  .ptext { font-size: var(--fs-sm); color: var(--ink-soft); }
  .ptext > summary { cursor: pointer; color: var(--accent); }
  .say-text { margin: 6px 0 0; max-width: 112ch; line-height: 1.55; color: var(--ink); }

  /* 4 · not here yet */
  .ngrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 30rem), 1fr)); gap: 12px; align-items: start; }
  .nc { gap: 9px; }
  .nc-hd { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .nc-name { font-weight: 650; font-size: 1.1em; color: var(--ink); }
  .nc p { margin: 0; font-size: var(--fs-sm); color: var(--ink); max-width: 80ch; }
  .cmd { display: block; font: inherit; font-size: var(--fs-sm); color: var(--ink); background: var(--raised); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 12px; overflow-x: auto; white-space: pre; }

  /* 6 · the frozen bar (D-074): fixed to the top while a voice reads, clear of the cog at the right */
  .vbar { position: fixed; top: 0; left: 0; right: 0; z-index: 150; background: var(--card); border-bottom: 1px solid var(--rule); padding: 8px 64px 8px 14px; box-sizing: border-box; }
  .vbar-in { max-width: min(96vw, 1800px); margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  .vb-btns { display: flex; gap: 6px; }
  .vb-btns .btn { padding: 5px 9px; }
  .vb-chips { display: flex; flex: 1 1 24rem; min-width: 0; gap: 6px; overflow-x: auto; padding: 2px 0; }
  .vb-chips .chip { white-space: nowrap; flex: 0 0 auto; }
  .vb-chips .chip[data-on="true"] { background: var(--accent); border-color: var(--accent); color: var(--ground); }
  .vb-speed { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--ink-soft); }
  .vb-speed output { color: var(--ink); font-variant-numeric: tabular-nums; min-width: 2.6em; text-align: center; }
  .vb-speed .btn { padding: 3px 7px; }
</style>

<div class="vbar" id="vbar" role="region" hidden>
  <div class="vbar-in">
    <div class="vb-btns">
      <button class="btn pri ic" type="button" id="vb-play"></button>
      <button class="btn ic" type="button" id="vb-stop"></button>
      <button class="btn ic" type="button" id="vb-prev"></button>
      <button class="btn ic" type="button" id="vb-next"></button>
    </div>
    <div class="vb-chips" id="vb-chips" role="group"></div>
    <div class="vb-speed"><span data-t="bar.speed"></span><button class="btn ic" type="button" id="vb-slow"></button><output id="vb-rate"></output><button class="btn ic" type="button" id="vb-fast"></button></div>
    <span class="sr" id="vb-live" aria-live="polite"></span>
  </div>
</div>

<div class="artifact-page">
  <header>
    <p class="eyebrow" data-t="page.eyebrow"></p>
    <h1 data-t="page.h1"></h1>
    <p class="lede" data-t="page.lede"></p>
    <p class="cap" style="margin-top:8px" data-t="page.source"></p>
    <div class="key"><span><button class="btn" data-mine="true" type="button" tabindex="-1" data-t="page.keyDashed"></button><span data-t="page.keyMine"></span></span><span><button class="btn" aria-pressed="true" type="button" tabindex="-1" data-t="page.keyFilled"></button><span data-t="page.keyYours"></span></span></div>
    <p class="cap" style="margin-top:8px" data-t="page.mineNote"></p>
    <nav class="toc" id="toc" aria-label="contents"></nav>
  </header>

  <section class="sec" data-sec="1" id="sec-text">
    <div class="sec-head"><h2><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path><path d="M10 9H8"></path><path d="M16 13H8"></path><path d="M16 17H8"></path></svg><span class="st"></span></h2><span class="n"></span></div>
    <div class="body">
      <p class="cap" data-t="text.cap"></p>
      <div class="tcols">
        <div class="tleft">
          <p class="lab" data-t="text.boxLab"></p>
          <textarea class="tbox" id="vt-box" spellcheck="false" data-aria="text.boxAria"></textarea>
          <div class="acts">
            <button class="btn pri ic js-read" type="button"></button>
            <button class="btn ic js-stop" type="button"></button>
            <button class="btn ic" type="button" id="vt-reset"></button>
            <button class="btn ic" type="button" id="vt-copy"></button>
            <span class="said" id="vt-said" aria-live="polite"></span>
          </div>
          <p class="cap" id="vt-nospeech" hidden data-t="text.noSpeech"></p>
        </div>
        <div class="tright">
          <p class="lab" data-t="text.viewLab"></p>
          <div class="vt-view" id="vt-view"></div>
        </div>
      </div>
    </div>
    <p class="take"></p>
  </section>

  <section class="sec" data-sec="2" id="sec-browser">
    <div class="sec-head"><h2><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" x2="12" y1="19" y2="22"></line></svg><span class="st"></span></h2><span class="n"></span></div>
    <div class="body">
      <p class="cap" data-t="browser.cap"></p>
      <div class="toolbar">
        <span class="lab" data-t="browser.filterLab"></span>
        <div class="seg" id="v-lang" role="group" data-aria="browser.filterLab">
          <button class="btn tog" type="button" data-lang="en" data-t="browser.langEn"></button>
          <button class="btn tog" type="button" data-lang="all" data-t="browser.langAll"></button>
        </div>
      </div>
      <p class="cap" id="v-empty" hidden></p>
      <div class="vgrid" id="v-grid"></div>
      <div class="panel set" id="set">
        <h3 data-t="settings.head"></h3>
        <p class="cap" data-t="settings.note"></p>
        <div class="acts">
          <button class="btn pri ic js-read" type="button"></button>
          <button class="btn ic js-stop" type="button"></button>
          <button class="btn ic" type="button" id="set-reset"></button>
        </div>
        <div class="sgrid" id="sgrid"></div>
        <p class="cap" id="engnote" hidden data-t="settings.enginePiper"></p>
      </div>
      <div class="panel cmp" id="cmp">
        <h3 data-t="compare.head"></h3>
        <p class="cap" data-t="compare.cap"></p>
        <div class="acts">
          <label class="rate"><span data-t="compare.sentenceLab"></span><select class="sel" id="cmp-sel"></select></label>
          <button class="btn pri ic" type="button" id="cmp-go"></button>
          <span class="said" id="cmp-said" aria-live="polite"></span>
        </div>
      </div>
    </div>
    <p class="take"></p>
  </section>

  <section class="sec" data-sec="3" id="sec-local">
    <div class="sec-head"><h2><svg viewBox="0 0 24 24" aria-hidden="true"><line x1="22" x2="2" y1="12" y2="12"></line><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path><line x1="6" x2="6.01" y1="16" y2="16"></line><line x1="10" x2="10.01" y1="16" y2="16"></line></svg><span class="st"></span></h2><span class="n"></span></div>
    <div class="body">
      <p class="cap" data-t="local.cap"></p>
      <p class="cap" data-t="local.speedHelp"></p>
      <div class="pgrid" id="p-grid"></div>
      <details class="ptext"><summary data-t="local.textHead"></summary><p class="say-text" id="p-text"></p></details>
    </div>
    <p class="take"></p>
  </section>

  <section class="sec" data-sec="4" id="sec-notyet">
    <div class="sec-head"><h2><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg><span class="st"></span></h2><span class="n"></span></div>
    <div class="body"><div class="ngrid" id="n-grid"></div></div>
    <p class="take"></p>
  </section>

  <section class="sec" data-sec="5" id="sec-pick">
    <div class="sec-head"><h2><svg viewBox="0 0 24 24" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="m9 14 2 2 4-4"></path></svg><span class="st"></span></h2><span class="n"></span></div>
    <div class="body">
      <p class="cap" data-t="pick.cap"></p>
      <div class="panel">
        <div class="tw" id="pk-table"></div>
        <p class="lab" data-t="pick.lineLab"></p>
        <textarea class="out" id="pk-line" readonly spellcheck="false" data-aria="pick.lineAria"></textarea>
        <div class="acts">
          <button class="btn pri ic" type="button" id="pk-copy"></button>
          <button class="btn ic" type="button" id="pk-reset"></button>
          <span class="said" id="pk-said" aria-live="polite"></span>
          <span class="state" id="pk-saved"></span>
        </div>
      </div>
    </div>
    <p class="take"></p>
  </section>

  <section class="sec" data-sec="6" id="sec-bar">
    <div class="sec-head"><h2><svg viewBox="0 0 24 24" aria-hidden="true"><line x1="12" x2="12" y1="17" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path></svg><span class="st"></span></h2><span class="n"></span></div>
    <div class="body">
      <p class="cap" data-t="bar.cap"></p>
      <div class="toolbar">
        <span class="lab" data-t="bar.modeLab"></span>
        <div class="seg" id="bar-mode" role="group" data-aria="bar.modeLab">
          <button class="btn tog" type="button" data-bar="playing" data-t="bar.modeOn"></button>
          <button class="btn tog" type="button" data-bar="always" data-mine="true" data-t="bar.modeAlways"></button>
        </div>
      </div>
      <p class="cap" data-t="bar.modeNote"></p>
    </div>
    <p class="take"></p>
  </section>
</div>

<script>window.VL_DATA = /*__DATA__*/null;</script>
<script>
(function () {
  "use strict";
  var D = window.VL_DATA, U = D.ui, KEY = "gabe:voice:v1", KEY2 = "gabe:voice:v1:lab", DEF = D.defaults, RNG = D.ranges, PR = D.piper.rate;
  var SS = window.speechSynthesis, SPEECH = !!(SS && window.SpeechSynthesisUtterance);
  var VL = window.__vl = { ready: false, key: KEY, lastCopy: null };

  /* ── small helpers ── */
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function $(id) { return document.getElementById(id); }
  function rt(s, o) { return String(s).replace(/\{\{(\w+)\}\}/g, function (m, k) { return o && o[k] != null ? String(o[k]) : m; }); }
  function get(path) { return path.split(".").reduce(function (o, k) { return o && o[k]; }, U); }
  function ico(name) { var t = document.createElement("span"); t.innerHTML = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + (D.icons[name] || "") + "</svg>"; return t.firstChild; }
  function fmt(n) { return Number.isInteger(n) ? n.toFixed(1) : String(+n.toFixed(2)); }
  function clamp(n, a, b) { return Math.min(b, Math.max(a, n)); }
  function setBtn(b, icon, text) { b.textContent = ""; b.appendChild(ico(icon)); b.appendChild(el("span", null, text)); }
  function each(sel, fn) { Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
  function isEn(v) { return /^en([-_]|$)/i.test(v.lang || ""); }

    HIS = {}; KEPT = false; try { window.localStorage.removeItem(KEY); window.localStorage.removeItem(KEY2); } catch (e) {}
    render(); renderCards(); renderPiper();
  }
  function buildSettings() {
    var g = $("sgrid"); g.textContent = "";
    function row(key, kind, spec) {
      var w = U.settings[key], r = el("div", "srow"), hd = el("div", "srow-hd"), c = el("div", "srow-c"), chip = el("button", "btn nb"), inp, out = null;
      r.setAttribute("data-set", key); hd.appendChild(el("span", "srow-l", w.label)); chip.type = "button"; chip.addEventListener("click", function () { if (HIS[key]) resetKey(key); }); hd.appendChild(chip);
      r.appendChild(hd); r.appendChild(el("p", "srow-w", w.what));
      if (kind === "range") { inp = document.createElement("input"); inp.type = "range"; inp.min = spec[0]; inp.max = spec[1]; inp.step = spec[2]; inp.setAttribute("aria-label", w.label);
        inp.addEventListener("input", function () { touch(key, Number(inp.value)); }); out = document.createElement("output"); c.appendChild(inp); c.appendChild(out); }
      else if (kind === "select") { inp = el("select", "sel"); inp.setAttribute("aria-label", w.label); inp.addEventListener("change", function () { S.engine = "browser"; S.bvoice = inp.value || null; HIS.voice = true; changed(); renderCards(); renderPiper(); }); c.appendChild(inp); }
      else { inp = el("button", "btn tog ic"); inp.type = "button"; inp.addEventListener("click", function () { touch(key, !S[key]); }); c.appendChild(inp); }
      r.appendChild(c); g.appendChild(r); CTRL[key] = { row: r, inp: inp, out: out, chip: chip, kind: kind };
    }
    row("voice", "select"); row("rate", "range", RNG.rate); row("pitch", "range", RNG.pitch); row("volume", "range", RNG.volume);
    row("pauseSentence", "range", RNG.pauseSentence); row("pauseSection", "range", RNG.pauseSection); row("readTitles", "tog");
  }
  function fillVoiceSelect() {
    var s = CTRL.voice.inp; s.textContent = ""; var o0 = el("option", null, U.browser.defaultVoice); o0.value = ""; s.appendChild(o0);
    sorted(VOICES).forEach(function (v) { var o = el("option", null, v.name + " (" + normLang(v.lang) + ")"); o.value = v.name; s.appendChild(o); });
  }
  function syncSettings() {
    Object.keys(CTRL).forEach(function (k) {
      var c = CTRL[k], his = !!HIS[k], isMs = k === "pauseSentence" || k === "pauseSection";
      c.chip.textContent = his ? U.settings.yours : U.settings.mine; if (his) { c.chip.setAttribute("aria-pressed", "true"); c.chip.removeAttribute("data-mine"); c.chip.title = U.settings.yoursTip; } else { c.chip.removeAttribute("aria-pressed"); c.chip.setAttribute("data-mine", "true"); c.chip.title = ""; }
      if (c.kind === "range") { c.inp.value = String(S[k]); c.out.textContent = isMs ? S[k] + " " + U.settings.ms : fmt(S[k]); }
      else if (c.kind === "select") { var v = curVoice(); c.inp.value = S.bvoice && byName(S.bvoice) ? S.bvoice : (v && !S.bvoice ? v.name : ""); }
      else { c.inp.setAttribute("data-on", String(S[k])); c.inp.textContent = ""; c.inp.appendChild(ico(S[k] ? "check" : "stop")); c.inp.appendChild(el("span", null, S[k] ? U.settings.readTitles.on : U.settings.readTitles.off)); }
    });
    $("engnote").hidden = S.engine !== "piper";
    $("vb-rate").textContent = fmt(S.rate);
  }
  $("set-reset").addEventListener("click", resetAll); setBtn($("set-reset"), "reset", U.settings.resetAll);

  /* ── 3 · local voices (Piper) ── */
  var AUD = [];
  function renderPiper() {
    var g = $("p-grid"); g.textContent = "";
    D.piper.voices.forEach(function (v) {
      var c = el("div", "pc panel"), hd = el("div", "pc-hd"), chips = el("div", "chips");
      c.setAttribute("data-piper", v.id); hd.appendChild(el("span", "pc-name", U.local.voice[v.id])); chips.appendChild(el("span", "chip", U.local.accent[v.lang])); chips.appendChild(el("span", "chip", U.local.quality[v.quality])); hd.appendChild(chips); c.appendChild(hd);
      v.speeds.forEach(function (s) {
        var r = el("div", "pr"), a = document.createElement("audio"), b = el("button", "btn"), isPick = S.engine === "piper" && S.pvoice === v.id && S.pspeed === s.id;
        r.setAttribute("data-speed", s.id); r.appendChild(el("span", "lab", U.local.speed[s.id]));
        a.controls = true; a.preload = "none"; a.src = D.piper.dir + s.file; a.setAttribute("aria-label", rt(U.local.audioAria, { voice: U.local.voice[v.id], speed: U.local.speed[s.id] }));
        a.addEventListener("play", function () { halt(); each("audio", function (o) { if (o !== a) o.pause(); }); });
        a.addEventListener("error", function () { r.appendChild(el("span", "chip", U.local.missing)); });
        r.appendChild(a); b.type = "button"; b.setAttribute("data-pick", v.id + "/" + s.id);
        if (isPick) { b.setAttribute("aria-pressed", "true"); b.textContent = U.local.picked; } else b.textContent = U.local.pick;
        b.addEventListener("click", function () { S.engine = "piper"; S.pvoice = v.id; S.pspeed = s.id; HIS.voice = true; HIS.pspeed = true; changed(); renderCards(); renderPiper(); });
        r.appendChild(b); r.appendChild(el("span", "len", rt(U.local.len, { sec: s.seconds, mb: (s.bytes / 1048576).toFixed(1) }))); c.appendChild(r); });
      g.appendChild(c); });
    $("p-text").textContent = D.piper.text;
  }

  /* ── 4 · not here yet ── */
  (function () {
    var g = $("n-grid"); U.notyet.cards.forEach(function (k) {
      var c = el("div", "nc panel"), hd = el("div", "nc-hd"), code = el("code", "cmd", k.cmd), act = el("div", "acts"), cp = el("button", "btn ic"), said = el("span", "said");
      c.setAttribute("data-card", k.id); hd.appendChild(el("span", "nc-name", k.name)); hd.appendChild(el("span", "chip acc", k.tag)); hd.appendChild(el("span", "chip", U.notyet.state));
      c.appendChild(hd); c.appendChild(el("p", null, k.what)); c.appendChild(el("p", null, k.need)); c.appendChild(el("p", "lab", U.notyet.cmdLab)); c.appendChild(code);
      cp.type = "button"; setBtn(cp, "copy", U.notyet.copy); said.setAttribute("aria-live", "polite"); cp.addEventListener("click", function () { copyText(k.cmd, said, U.notyet.copied, U.notyet.failed); });
      act.appendChild(cp); act.appendChild(said); c.appendChild(act); g.appendChild(c); });
  })();

  /* ── 5 · your pick ── */
  function whose(k) { var his = !!HIS[k], s = el("span", "chip " + (his ? "his" : "mine"), his ? U.pick.yours : U.pick.mine); s.setAttribute("data-whose", his ? "yours" : "mine"); return s; }
  function renderPickTable() {
    var p = pickObj(), piper = S.engine === "piper", rows = [
      ["voice", U.settings.voice.label, piper ? p.voice + " (" + p.lang + ")" : p.voice || U.line.voiceDefault + " (" + p.lang + ")"],
      piper ? ["pspeed", U.settings.rate.label, S.pspeed] : ["rate", U.settings.rate.label, fmt(S.rate)],
      ["pitch", U.settings.pitch.label, piper ? U.pick.naPiper : fmt(S.pitch)], ["volume", U.settings.volume.label, piper ? U.pick.naPiper : fmt(S.volume)],
      ["pauseSentence", U.settings.pauseSentence.label, S.pauseSentence + " " + U.settings.ms], ["pauseSection", U.settings.pauseSection.label, S.pauseSection + " " + U.settings.ms],
      ["readTitles", U.settings.readTitles.label, S.readTitles ? U.settings.readTitles.on : U.settings.readTitles.off]];
    var w = $("pk-table"), t = el("table", "t"), tr = el("tr"); w.textContent = "";
    U.pick.head.forEach(function (h, i) { tr.appendChild(el("th", i === 0 ? "sv" : null, h)); }); t.appendChild(tr);
    rows.forEach(function (r) { var x = el("tr"), a = el("td", "sv", r[1]), b = el("td", null, r[2]), c = el("td", "sv"); x.setAttribute("data-row", r[0]);
      if (piper && (r[0] === "pitch" || r[0] === "volume")) c.appendChild(el("span", "state", "")); else c.appendChild(whose(r[0]));
      x.appendChild(a); x.appendChild(b); x.appendChild(c); t.appendChild(x); });
    w.appendChild(t);
  }
  function renderPick() {
    var l = line(); $("pk-line").value = l; VL.line = l; renderPickTable();
    var ks = keysShown(), n = ks.filter(function (k) { return HIS[k]; }).length;
    $("sec-pick").querySelector(".n").textContent = rt(U.sec.pick.n, { yours: n, all: ks.length });
    $("pk-saved").textContent = !STORED ? U.pick.notSaved : (KEPT ? U.pick.saved : U.pick.notYet);
  }
  function render() { syncSettings(); renderPick(); paint(); }
  setBtn($("pk-copy"), "copy", U.pick.copy); setBtn($("pk-reset"), "reset", U.settings.resetAll);
  $("pk-copy").addEventListener("click", function () { copyText(line(), $("pk-said"), U.pick.copied, U.pick.failed); });
  $("pk-reset").addEventListener("click", resetAll);

  /* ── 6 · the bar's own option ── */
  $("bar-mode").addEventListener("click", function (e) { var b = e.target.closest("[data-bar]"); if (!b) return; BAR = b.getAttribute("data-bar"); persist(); paint(); });

  /* ── start ── */
  buildSettings(); fillVoiceSelect(); renderPiper(); SECS = parseText(box.value); renderView(); buildBar(); fillCompareSel(); counts();
  if (SPEECH) { loadVoices(); try { SS.addEventListener("voiceschanged", loadVoices); } catch (e) { SS.onvoiceschanged = loadVoices; }
    var tries = 0, poll = setInterval(function () { if (VOICES.length) clearInterval(poll); else if (++tries > 12) { clearInterval(poll); renderCards(); } else loadVoices(); }, 400); }
  else { renderCards(); }
  render();
  VL.state = function () { return { S: JSON.parse(JSON.stringify(S)), HIS: Object.keys(HIS), bar: BAR, lang: LANG, pick: pickObj() }; };
  VL.player = function () { return { mode: P.mode, sec: P.sec, j: P.j, paused: P.paused }; };
  VL.sections = function () { return SECS.map(function (s) { return { title: s.title, n: s.sents.length }; }); };
  VL.ready = true;
})();
</script>
